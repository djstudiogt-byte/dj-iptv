<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#04060c"/>
<meta name="description" content="DJ-IPTV · Cliente IPTV web personal estilo Apple tvOS · Xtream Codes"/>
<title>DJ-IPTV</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="%230A84FF"/><text x="32" y="42" font-family="Arial" font-size="26" font-weight="bold" fill="white" text-anchor="middle">DJ</text></svg>'/>
<!-- Motor HLS: Hls.js con fallback nativo en Safari (canPlayType). Si el CDN falla o está
     bloqueado, prueba la copia local hls.min.js incluida junto a este archivo. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" defer
  onerror="var s=document.createElement('script');s.src='hls.min.js';s.defer=true;s.onerror=function(){window.__hlsCdFail=true};document.head.appendChild(s);"></script>
<!-- mux.js: remux de MPEG-TS (.ts) a fMP4 vía MediaSource (los .mkv usan el demuxer propio) -->
<script src="https://cdn.jsdelivr.net/npm/mux.js@6.3.0/dist/mux.min.js" defer
  onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.3.0/mux.min.js';s.defer=true;s.onerror=function(){window.__muxCdFail=true};document.head.appendChild(s);"></script>
<style>
/* ============================================================
   DJ-IPTV · Sistema de diseño estilo Apple tvOS (Liquid Glass)
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-0:#04060c; --bg-1:#0f172a;
  --glass:rgba(255,255,255,.065);
  --glass-2:rgba(255,255,255,.10);
  --panel:rgba(16,21,34,.78);
  --panel-2:rgba(22,28,44,.92);
  --stroke:rgba(255,255,255,.10);
  --stroke-2:rgba(255,255,255,.18);
  --t-1:#f5f7fb; --t-2:rgba(226,232,248,.62); --t-3:rgba(226,232,248,.38);
  --accent:#0A84FF;
  --accent-soft:rgba(10,132,255,.22);
  --ok:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --r-xs:12px; --r-sm:16px; --r-md:20px; --r-lg:26px; --r-xl:32px; --r-pill:999px;
  --blur:saturate(1.7) blur(22px);
  --sh-1:0 10px 30px -12px rgba(0,0,0,.55);
  --sh-2:0 24px 60px -18px rgba(0,0,0,.65);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html{height:100%;-webkit-tap-highlight-color:transparent}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.001s!important;transition-duration:.001s!important}
body{
  min-height:100%;font-family:var(--font);color:var(--t-1);background:var(--bg-0);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
img{-webkit-user-drag:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
/* Táctil: sin resalto naranja nativo y sin retardo de doble toque en los controles */
button,[data-focus],.card,.tab,.chip,.switch,.acc-chip,.mini-btn,.pl-btn,.icon-btn,.menu-item,.q-item,.ep-row,.ed-row,.dl-item,.cat-item,.sr-item{touch-action:manipulation}
[hidden]{display:none!important}
::selection{background:var(--accent-soft)}

/* ---------- Fondo ambiental ---------- */
#ambient{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(1100px 700px at 85% -10%,rgba(10,132,255,.14),transparent 60%),
  radial-gradient(900px 600px at -10% 110%,rgba(94,92,230,.10),transparent 60%),
  linear-gradient(180deg,#070b16 0%,var(--bg-1) 55%,#05070d 100%)}
#ambient::before,#ambient::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s ease-in-out infinite alternate}
#ambient::before{width:520px;height:520px;left:-140px;top:-120px;background:radial-gradient(circle,rgba(10,132,255,.20),transparent 65%)}
#ambient::after{width:640px;height:640px;right:-180px;bottom:-200px;background:radial-gradient(circle,rgba(191,90,242,.12),transparent 65%);animation-delay:-13s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(60px,40px,0) scale(1.12)}}

/* ---------- Barra superior tipo pill glass ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:120;display:flex;justify-content:center;padding:16px 20px 10px;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:1180px;width:100%;
  padding:9px 12px;border-radius:var(--r-pill);
  background:rgba(13,17,29,.55);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke);box-shadow:var(--sh-1);transition:background .3s}
.topbar.scrolled .pill{background:rgba(11,15,26,.82)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 6px;border-radius:var(--r-pill)}
.logo-mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  font-size:12px;font-weight:800;letter-spacing:.5px;color:#fff;
  background:linear-gradient(135deg,var(--accent),#5e5ce6);box-shadow:0 4px 14px -4px var(--accent)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand-name small{color:var(--t-2);font-weight:600}
.tabs{display:flex;gap:2px;margin-left:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-pill);
  color:var(--t-2);font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .22s,color .22s,transform .18s}
.tab svg{flex:none}
.tab.active{background:rgba(255,255,255,.13);color:#fff}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--t-2);
  background:var(--glass);border:1px solid var(--stroke);transition:transform .18s,background .2s,color .2s;flex:none}
.icon-btn:hover{background:var(--glass-2);color:#fff}
.icon-btn.big{width:52px;height:52px}
.acc-wrap{position:relative}
.acc-chip{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 6px;border-radius:var(--r-pill);
  background:var(--glass);border:1px solid var(--stroke);font-size:13px;font-weight:600;color:var(--t-1);max-width:190px}
.acc-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.avatar svg{width:14px;height:14px}

/* ---------- Menús desplegables glass ---------- */
.menu{position:absolute;top:calc(100% + 10px);right:0;min-width:250px;padding:8px;z-index:200;
  border-radius:var(--r-md);background:var(--panel-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke);box-shadow:var(--sh-2);animation:pop .16s ease}
.menu.up{top:auto;bottom:calc(100% + 10px)}
.menu-head{padding:9px 12px 7px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t-3)}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;
  font-size:13.5px;font-weight:500;text-align:left;color:var(--t-1);transition:background .15s}
.menu-item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item small{display:block;color:var(--t-2);font-size:11.5px;font-weight:400;margin-top:2px}
.menu-item svg{flex:none;color:var(--t-2)}
.menu-item.danger,.menu-item.danger svg{color:var(--danger)}
.menu-sep{height:1px;background:var(--stroke);margin:7px 6px}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- Contenido / vistas ---------- */
main{max-width:1400px;margin:0 auto;padding:96px 28px 130px}
.view{animation:viewIn .32s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:6px 2px 14px}
.view-title{font-size:26px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.view-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.view-sub{font-size:13px;color:var(--t-2);font-weight:500}
.section-title{font-size:19px;font-weight:750;letter-spacing:-.01em;margin:26px 2px 4px;display:flex;align-items:center;gap:9px}
.section-title svg{color:var(--accent)}
.section-more{font-size:13px;color:var(--t-2);font-weight:600;margin-left:auto;transition:color .2s}
.section-more:hover{color:#fff}
.empty{padding:60px 24px;text-align:center;color:var(--t-2)}
.empty .big{font-size:19px;font-weight:700;color:var(--t-1);margin-bottom:8px}
.empty p{max-width:460px;margin:0 auto 18px;font-size:14px;line-height:1.55}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:var(--r-pill);
  font-size:14px;font-weight:700;letter-spacing:.01em;transition:transform .18s,filter .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 10px 26px -8px var(--accent)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-glass{background:var(--glass-2);border:1px solid var(--stroke-2);color:#fff;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.btn-glass:hover{background:rgba(255,255,255,.16)}
.btn-danger{background:rgba(255,69,58,.14);border:1px solid rgba(255,69,58,.35);color:#ff8b84}
.btn-sm{padding:8px 14px;font-size:12.5px}
.link-btn{color:var(--accent);font-weight:700;font-size:13.5px}

/* ---------- Chips de categoría ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--stroke);
  font-size:13px;font-weight:600;color:var(--t-2);transition:all .2s;white-space:nowrap}
.chip.active{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 6px 18px -6px var(--accent)}

/* ---------- Rieles horizontales ---------- */
.rail{position:relative;margin-bottom:6px}
.rail-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding:14px 4px 22px;
  scrollbar-width:none;scroll-behavior:smooth}
.rail-track::-webkit-scrollbar{display:none}
.rail-nav{position:absolute;top:38%;width:44px;height:44px;border-radius:50%;z-index:5;display:grid;place-items:center;
  background:rgba(20,26,40,.85);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke-2);color:#fff;opacity:0;transition:opacity .25s,transform .2s;box-shadow:var(--sh-1)}
.rail:hover .rail-nav{opacity:1}
.rail-nav:hover{transform:scale(1.08)}
.rail-nav.prev{left:-10px}.rail-nav.next{right:-10px}

/* ---------- Tarjetas ---------- */
.card{flex:none;scroll-snap-align:start;width:var(--cw,170px);border-radius:var(--r-md);position:relative}
.card .art{position:relative;aspect-ratio:var(--ar,2/3);border-radius:var(--r-md);overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid var(--stroke);box-shadow:var(--sh-1);transition:transform .24s cubic-bezier(.2,.7,.3,1.2),box-shadow .24s}
.card .art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card .cap{padding:10px 4px 0}
.card .t1{font-size:13.5px;font-weight:650;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.card .t2{font-size:12px;color:var(--t-2);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.card .rate{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:var(--r-pill);
  background:rgba(5,8,15,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:11.5px;font-weight:700}
.card .rate svg{color:#FFD60A}
/* Estrella de favorito en la esquina de la tarjeta (aparece al pasar el ratón o al enfocar) */
.card .fav-btn{position:absolute;top:8px;right:8px;width:31px;height:31px;border-radius:50%;background:rgba(8,12,24,.62);
  border:1px solid rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;z-index:4;
  opacity:0;transform:scale(.85);transition:opacity .16s,transform .16s,background .16s,color .16s;cursor:pointer}
.card:hover .fav-btn,.card.focused .fav-btn,.card .fav-btn.on{opacity:1;transform:none}
.card .fav-btn:hover{background:rgba(8,12,24,.88)}
.card .fav-btn.on{color:var(--accent)}
.card.has-fav .rate{right:48px}
.pl-btn.on{color:var(--accent)}
.badge-live{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);
  background:rgba(255,59,48,.9);font-size:10px;font-weight:800;letter-spacing:.08em}
.badge-live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.card.chan{--cw:264px}.card.chan .art{--ar:16/9;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015))}
.chan .ch-top{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:10px}
.card .art img.ch-logo{width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid var(--stroke);background:#0b1020;flex:none}
.chan .ch-name{font-size:14px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chan .ch-now{font-size:12.5px;font-weight:600;color:var(--t-1);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .ch-prog{height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.chan .ch-prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .5s}
.chan .ch-next{font-size:11.5px;color:var(--t-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Hero / cartelera ---------- */
.hero{position:relative;height:min(56vh,500px);border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--stroke);
  box-shadow:var(--sh-2);background:#0a0f1c;margin-bottom:8px}
.hero-slides{display:flex;height:100%;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.hero-slide{position:relative;flex:none;width:100%;height:100%}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transform:scale(1.04);animation:kenburns 9s ease-out forwards}
@keyframes kenburns{from{transform:scale(1.1)}to{transform:scale(1.0)}}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,7,14,.92) 8%,rgba(4,7,14,.55) 45%,rgba(4,7,14,.12) 75%),linear-gradient(0deg,rgba(4,7,14,.85),transparent 46%)}
.hero-content{position:absolute;left:46px;right:46px;bottom:42px;max-width:600px}
.hero-kicker{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:var(--r-pill);margin-bottom:14px;
  background:var(--accent-soft);border:1px solid rgba(10,132,255,.4);color:#7cbcff;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.hero h1{font-size:clamp(26px,4vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.08;margin-bottom:12px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--t-2);font-weight:600;margin-bottom:12px}
.hero-meta .imdb{display:inline-flex;align-items:center;gap:5px;color:#FFD60A}
.hero-meta .imdb svg{width:13px;height:13px}
.hero-plot{font-size:14.5px;line-height:1.6;color:var(--t-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:20px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;background:rgba(15,20,33,.6);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke-2);color:#fff;opacity:0;transition:opacity .25s,transform .2s}
.hero:hover .hero-arrow{opacity:1}
.hero-arrow:hover{transform:translateY(-50%) scale(1.1)}
.hero-arrow.prev{left:18px}.hero-arrow.next{right:18px}
.hero-dots{position:absolute;right:40px;bottom:24px;display:flex;gap:7px;z-index:6}
.hero-dots button{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);transition:all .3s}
.hero-dots button.on{background:#fff;width:22px;border-radius:var(--r-pill)}

/* ---------- Rejillas ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:20px 16px;padding:14px 2px 26px}
.grid.chan-grid{grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px}
.grid .card{--cw:auto;width:auto}
.grid .card .art{transform:none}
.sentinel{height:10px;width:100%;grid-column:1/-1}
.skel{border-radius:var(--r-md);background:linear-gradient(100deg,rgba(255,255,255,.05) 40%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.05) 60%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- Buscador global ---------- */
#search-overlay{position:fixed;inset:0;z-index:260;background:rgba(2,4,9,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;justify-content:center;align-items:flex-start;padding:11vh 20px 40px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}}
.search-panel{width:min(920px,100%);border-radius:var(--r-lg);overflow:hidden;background:var(--panel-2);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke-2);box-shadow:var(--sh-2);animation:pop .2s ease}
.search-row{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--stroke)}
.search-row svg{color:var(--t-2);flex:none}
#search-input{flex:1;background:none;border:0;outline:none;font-size:18px;font-weight:500;color:#fff}
#search-input::placeholder{color:var(--t-3)}
.search-kbd{font-size:11px;font-weight:700;color:var(--t-3);border:1px solid var(--stroke-2);border-radius:7px;padding:3px 8px}
.search-results{max-height:56vh;overflow-y:auto;padding:10px 14px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 18px}
.sr-col-head{grid-column:span 1;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--t-3);padding:12px 8px 6px}
.sr-col-head svg{color:var(--accent)}
.sr-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 8px;border-radius:12px;text-align:left;transition:background .15s}
.sr-item:hover{background:rgba(255,255,255,.07)}
.sr-item img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none;background:#0b1020;border:1px solid var(--stroke)}
.sr-item .sr-t{font-size:13px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sr-item small{display:block;color:var(--t-2);font-size:11px;font-weight:500;margin-top:2px}
.search-hint{padding:34px;text-align:center;color:var(--t-3);font-size:14px;grid-column:1/-1}

/* ---------- Modales ---------- */
.modal-veil{position:fixed;inset:0;z-index:330;background:rgba(2,4,9,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;padding:26px;animation:fadeIn .2s ease}
.modal{position:relative;width:min(880px,100%);max-height:88vh;overflow-y:auto;border-radius:var(--r-xl);
  background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke-2);box-shadow:var(--sh-2);animation:popIn .26s cubic-bezier(.2,.9,.3,1.1)}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.modal.slim{width:min(460px,100%)}
.modal-x{position:absolute;top:16px;right:16px;z-index:8;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:rgba(10,14,24,.65);border:1px solid var(--stroke-2);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.det-hero{position:relative;height:300px}
.det-hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 22%}
.det-hero .fade{position:absolute;inset:0;background:linear-gradient(0deg,var(--panel) 2%,rgba(16,21,34,.25) 60%,rgba(16,21,34,.45))}
.det-body{position:relative;padding:0 34px 32px;margin-top:-86px;display:flex;gap:26px}
.det-poster{width:170px;flex:none;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--stroke-2);
  box-shadow:var(--sh-2);background:#0b1020}
.det-poster img{width:100%;height:100%;object-fit:cover}
.det-info{flex:1;min-width:0;padding-top:56px}
.det-info h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.det-meta{display:flex;flex-wrap:wrap;gap:7px 14px;font-size:13px;color:var(--t-2);font-weight:600;margin-bottom:14px}
.det-meta .imdb{color:#FFD60A;display:inline-flex;align-items:center;gap:5px}
.det-plot{font-size:14px;line-height:1.65;color:var(--t-2);margin-bottom:20px;max-width:600px}
.det-actions{display:flex;gap:11px;flex-wrap:wrap}
.seasons{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.ep-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ep-row{display:flex;align-items:center;gap:15px;padding:11px 14px;border-radius:var(--r-sm);background:var(--glass);border:1px solid var(--stroke);transition:background .2s}
.ep-row:hover{background:var(--glass-2)}
.ep-num{width:74px;height:46px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:800;
  background:linear-gradient(135deg,rgba(10,132,255,.28),rgba(10,132,255,.08));border:1px solid rgba(10,132,255,.3);color:#9dcbff}
.ep-mid{flex:1;min-width:0}
.ep-t{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-d{font-size:12px;color:var(--t-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-actions{display:flex;gap:7px;flex:none}
.mini-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--glass-2);
  border:1px solid var(--stroke);color:var(--t-1);transition:all .18s}
.mini-btn:hover{background:rgba(255,255,255,.17);transform:scale(1.06)}
.mini-btn.accent{background:var(--accent);border-color:transparent;color:#fff}

/* Formularios */
.form{display:flex;flex-direction:column;gap:15px;padding:26px}
.form h3{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.form h3 svg{color:var(--accent)}
.form .hint{font-size:12.5px;color:var(--t-2);line-height:1.5;margin-top:-6px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t-3);margin:0 2px 7px}
.field input,.field select{width:100%;padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.07);
  border:1px solid var(--stroke);color:#fff;font-size:14px;outline:none;transition:border .2s,background .2s}
.field input:focus,.field select:focus{border-color:var(--accent);background:rgba(255,255,255,.10)}
.field input::placeholder{color:var(--t-3)}
.field select option,select option{background:#131a2c;color:#fff}
.set-row select{padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:#fff;font-size:13px;outline:none;cursor:pointer}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.form-err{display:none;padding:11px 14px;border-radius:12px;background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.3);
  color:#ffb0aa;font-size:13px;line-height:1.5}
.form-err.show{display:block}
.row2{display:grid;grid-template-columns:1fr 130px;gap:12px}

/* Confirmación */
.confirm-body{padding:28px;text-align:center}
.confirm-body .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;
  background:rgba(255,69,58,.14);border:1px solid rgba(255,69,58,.3);color:var(--danger)}
.confirm-body h3{font-size:18px;font-weight:800;margin-bottom:8px}
.confirm-body p{font-size:13.5px;color:var(--t-2);line-height:1.55;margin-bottom:20px}

/* ---------- Reproductor ---------- */
#player-root{position:fixed;inset:0;z-index:300;background:#000;animation:fadeIn .22s ease}
#pl-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.pl-top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:flex-start;gap:16px;padding:22px 28px;
  background:linear-gradient(180deg,rgba(0,0,0,.72),transparent);transition:opacity .3s,transform .3s}
.pl-titles{min-width:0;padding-top:6px}
#pl-title{font-size:19px;font-weight:750;text-shadow:0 2px 12px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pl-sub{font-size:12.5px;color:var(--t-2);font-weight:600;margin-top:3px}
.pl-epgmini{margin-left:auto;max-width:390px;text-align:right;padding-top:4px}
.pl-epgmini .now{font-size:13px;font-weight:700}
.pl-epgmini .now small{color:var(--accent);font-weight:800;margin-right:7px;font-size:10.5px;letter-spacing:.08em}
.pl-epgmini .next{font-size:11.5px;color:var(--t-2);margin-top:4px}
.pl-epgmini .desc{font-size:11.5px;color:var(--t-2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-badge{position:absolute;top:24px;right:28px;z-index:7;display:flex;align-items:center;gap:9px;padding:9px 16px;
  border-radius:var(--r-pill);background:rgba(255,59,48,.16);border:1px solid rgba(255,69,58,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:13px;font-weight:800;color:#ff8d86;letter-spacing:.04em}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:pulse 1.2s infinite}
.pl-controls{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:60px 30px 24px;
  background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,.42) 55%,transparent);transition:opacity .3s,transform .3s}
.pl-seekrow{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.pl-time{font-size:12.5px;font-weight:650;color:var(--t-2);font-variant-numeric:tabular-nums;flex:none}
.live-pill{flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:var(--r-pill);
  background:rgba(255,59,48,.18);border:1px solid rgba(255,69,58,.45);color:#ff8d86;font-size:11px;font-weight:800;letter-spacing:.1em;cursor:pointer}
.live-pill i{width:7px;height:7px;border-radius:50%;background:var(--danger);animation:pulse 1.4s infinite}
#pl-seek{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:
  linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.22);outline:none;cursor:pointer}
#pl-seek::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.5);transition:transform .15s}
#pl-seek::-webkit-slider-thumb:hover{transform:scale(1.25)}
#pl-seek::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
#pl-vol{-webkit-appearance:none;appearance:none;width:86px;height:4px;border-radius:2px;outline:none;cursor:pointer;
  background:linear-gradient(#fff,#fff) 0/var(--p,100%) 100% no-repeat,rgba(255,255,255,.25)}
#pl-vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
#pl-vol::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.pl-btnrow{display:flex;align-items:center;gap:6px}
.pl-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .18s,background .2s;flex:none}
.pl-btn:hover{background:rgba(255,255,255,.14);transform:scale(1.08)}
.pl-btn.on{color:var(--accent)}
.pl-btn.rec-on{color:var(--danger)}
.pl-spacer{flex:1}
.vol-wrap{display:flex;align-items:center;gap:8px}
#pl-menu{position:absolute;right:26px;bottom:96px;z-index:8;min-width:220px}
.q-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border-radius:11px;font-size:13.5px;font-weight:600;text-align:left;transition:background .15s}
.q-item:hover{background:rgba(255,255,255,.09)}
.q-item svg{margin-left:auto;color:var(--accent)}
.q-item small{color:var(--t-2);font-weight:500}
.pl-spin{position:absolute;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none}
.spinner{width:58px;height:58px;border-radius:50%;border:4px solid rgba(255,255,255,.16);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pl-error{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:24px}
.pl-error .card-err{max-width:480px;padding:30px;border-radius:var(--r-lg);text-align:center;background:var(--panel-2);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke-2)}
.pl-error .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:rgba(255,159,10,.14);border:1px solid rgba(255,159,10,.35);color:var(--warn)}
.pl-error h3{font-size:17px;font-weight:800;margin-bottom:8px}
.pl-error p{font-size:13px;color:var(--t-2);line-height:1.6;margin-bottom:18px}
.pl-error p code{font-family:var(--mono);font-size:11.5px;background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px}
#player-root.hidecursor{cursor:none}
#player-root.hidecursor .pl-top,#player-root.hidecursor .pl-controls{opacity:0;pointer-events:none}

/* ---------- MultiPantalla (2-4 señales en vivo a la vez) ---------- */
#multi-root{position:fixed;inset:0;z-index:310;background:#020409;display:flex;flex-direction:column;animation:fadeIn .22s ease}
.multi-bar{display:flex;align-items:center;gap:14px;padding:14px 20px 10px;flex:none}
.multi-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.multi-title svg{color:var(--accent);flex:none}
.multi-count{display:flex;gap:8px;margin-left:auto}
.multi-count .chip{padding:8px 17px}
.multi-grid{flex:1;min-height:0;display:grid;gap:10px;padding:6px 20px calc(18px + env(safe-area-inset-bottom))}
.multi-grid[data-n="2"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.multi-grid[data-n="3"]{grid-template-columns:1fr 1fr;grid-template-rows:1.55fr 1fr}
.multi-grid[data-n="3"] .multi-slot[data-slot="0"]{grid-column:1/-1}
.multi-grid[data-n="4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.multi-slot{position:relative;min-height:0;border-radius:var(--r-md);overflow:hidden;background:#000;
  border:1px solid var(--stroke);transition:border-color .2s,box-shadow .2s}
.multi-slot.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ms-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ms-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  color:var(--t-2);font-size:13px;font-weight:600;text-align:center;padding:14px}
.ms-empty .big-ic{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:var(--t-2);
  background:var(--glass);border:1px dashed var(--stroke-2);transition:transform .18s,color .18s}
.multi-slot.empty:hover .big-ic{transform:scale(1.08);color:#fff}
.ms-empty b{display:block;font-size:14.5px;color:var(--t-1);margin-bottom:4px}
.ms-info{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);display:flex;align-items:center;gap:8px;
  padding:7px 13px;border-radius:var(--r-pill);background:rgba(5,8,15,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);font-size:12.5px;font-weight:700}
.ms-info .live-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);animation:pulse 1.4s infinite;flex:none}
.ms-info .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-audio{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r-pill);
  font-size:10.5px;font-weight:800;letter-spacing:.08em;max-width:calc(100% - 64px);
  background:rgba(48,209,88,.22);border:1px solid rgba(48,209,88,.5);color:#83eaa6}
.ms-audio span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-audio.off{background:rgba(5,8,15,.6);border-color:rgba(255,255,255,.16);color:rgba(226,232,248,.55)}
.ms-pick{position:absolute;top:8px;right:8px;width:36px;height:36px;z-index:4}
.multi-hint{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;pointer-events:none;
  font-size:12px;font-weight:600;letter-spacing:.2px;color:rgba(255,255,255,.75);background:rgba(8,10,14,.62);
  border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 18px;white-space:nowrap;max-width:92%;
  overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .35s}
.multi-hint.show{opacity:1}
@media (orientation:portrait){
  .multi-grid[data-n="2"]{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
}

/* ---------- Descargas / Grabaciones ---------- */
.dl-sec{margin-top:26px}
.dl-item{display:flex;align-items:center;gap:16px;padding:15px 18px;border-radius:var(--r-md);background:var(--glass);
  border:1px solid var(--stroke);margin-bottom:11px;transition:background .2s}
.dl-item:hover{background:var(--glass-2)}
.dl-ic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(10,132,255,.25),rgba(10,132,255,.07));border:1px solid rgba(10,132,255,.3);color:#9dcbff}
.dl-ic.rec{background:linear-gradient(135deg,rgba(255,69,58,.22),rgba(255,69,58,.06));border-color:rgba(255,69,58,.3);color:#ff9d97}
.dl-mid{flex:1;min-width:0}
.dl-name{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-sub{font-size:12px;color:var(--t-2);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.dl-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.13);overflow:hidden;margin-top:9px}
.dl-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s}
.dl-actions{display:flex;gap:7px;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);font-size:10.5px;font-weight:800;letter-spacing:.05em}
.tag.ok{background:rgba(48,209,88,.14);color:#6fe391}
.tag.rec{background:rgba(255,69,58,.14);color:#ff8d86}
.tag.load{background:rgba(255,159,10,.14);color:#ffc46b}
.tag.disk{background:rgba(10,132,255,.16);color:#8cc4ff}

/* Hub flotante de progreso */
#dl-hub{position:fixed;right:26px;bottom:26px;z-index:230;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.hub-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-md);cursor:pointer;
  background:var(--panel-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke-2);
  box-shadow:var(--sh-2);animation:pop .2s ease;max-width:330px}
.hub-ring{position:relative;width:40px;height:40px;flex:none}
.hub-ring svg{transform:rotate(-90deg)}
.hub-ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:800}
.hub-txt{min-width:0}
.hub-t{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.hub-s{font-size:11px;color:var(--t-2);margin-top:2px}

/* ---------- Ajustes ---------- */
.set-grid{display:flex;flex-direction:column;gap:20px;max-width:820px}
.set-card{border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--stroke);padding:24px 26px}
.set-card>h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.set-card>h3 svg{color:var(--accent)}
.set-card>.sub{font-size:12.5px;color:var(--t-2);margin-bottom:16px}
.set-row{display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--stroke)}
.set-row:first-of-type{border-top:0}
.set-row .lbl{flex:1;min-width:0}
.set-row .lbl b{display:block;font-size:13.5px;font-weight:650}
.set-row .lbl span{display:block;font-size:12px;color:var(--t-2);margin-top:3px;line-height:1.45}
.switch{position:relative;width:48px;height:29px;border-radius:var(--r-pill);background:rgba(255,255,255,.16);
  border:1px solid var(--stroke);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2.5px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.3,.8,.3,1.2)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(19px)}
.swatches{display:flex;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;transition:transform .18s,border .18s;position:relative}
.swatch.on{border-color:transparent;box-shadow:0 0 0 2px var(--accent-soft),0 0 14px var(--accent);transform:scale(1.12)}
.swatch:hover{transform:scale(1.1)}
.code{font-family:var(--mono);font-size:12px;line-height:1.75;background:rgba(0,0,0,.5);border:1px solid var(--stroke);
  border-radius:13px;padding:15px 17px;overflow-x:auto;white-space:pre;color:#c9e2ff;margin:10px 0}
.code .c{color:var(--t-3)}
.acc-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-top:1px solid var(--stroke)}
.acc-row:first-of-type{border-top:0}
.acc-row .inf{flex:1;min-width:0}
.acc-row .inf b{font-size:14px;display:flex;align-items:center;gap:8px}
.acc-row .inf small{display:block;color:var(--t-2);font-size:12px;margin-top:3px}
/* Editor de listas (Ajustes → Canales y categorías) */
.ed-search{width:100%;padding:11px 14px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);color:#fff;font-size:13.5px;outline:none;transition:border .2s}
.ed-search:focus{border-color:var(--accent)}
.ed-list{display:flex;flex-direction:column;gap:5px;margin-top:2px;scrollbar-width:thin}
.ed-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--stroke);transition:background .15s,opacity .2s}
.ed-row:hover{background:var(--glass-2)}
.ed-row.off{opacity:.45}
.ed-row .nm{flex:1;min-width:0;cursor:pointer}
.ed-row.ch .nm{cursor:default}
.ed-row .nm b{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-row .nm small{display:block;color:var(--t-2);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-kids{display:flex;flex-direction:column;gap:4px;margin:2px 0 4px 22px;padding-left:12px;border-left:2px solid var(--stroke)}
.ed-count{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--t-3);margin:10px 2px 2px}
.ed-sum{font-size:12.5px;color:var(--t-2);flex:1;min-width:200px}
.ed-mini-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--t-3);margin:8px 2px 0}
.state-dot{width:8px;height:8px;border-radius:50%;flex:none}
.state-dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.state-dot.err{background:var(--danger)}
.state-dot.idle{background:var(--t-3)}

/* ---------- Toasts ---------- */
#toast-root{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:11px;padding:13px 20px;border-radius:var(--r-pill);max-width:min(560px,92vw);
  background:var(--panel-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke-2);
  box-shadow:var(--sh-2);font-size:13.5px;font-weight:600;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.15)}
.toast.out{animation:toastOut .3s ease forwards}
.toast svg{flex:none}
.toast.ok svg{color:var(--ok)}.toast.err svg{color:var(--danger)}.toast.info svg{color:var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(12px) scale(.95)}}

/* ---------- Onboarding ---------- */
.onb{max-width:720px;margin:4vh auto 0;text-align:center;padding:52px 40px;border-radius:var(--r-xl);
  background:var(--glass);border:1px solid var(--stroke);position:relative;overflow:hidden}
.onb::before{content:"";position:absolute;inset:-40%;background:radial-gradient(420px 300px at 50% 0%,rgba(10,132,255,.16),transparent 65%);pointer-events:none}
.onb .logo-big{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;margin:0 auto 22px;font-size:26px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--accent),#5e5ce6);box-shadow:0 18px 44px -12px var(--accent)}
.onb h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.onb p{font-size:14.5px;color:var(--t-2);line-height:1.65;max-width:520px;margin:0 auto 26px}
.onb .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px;text-align:left}
.onb .step{padding:16px;border-radius:var(--r-md);background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
.onb .step b{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:7px}
.onb .step b i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:11px;font-style:normal}
.onb .step span{font-size:12px;color:var(--t-2);line-height:1.5;display:block}
.onb .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- Asistente de conexión (reutiliza .step en modales) ---------- */
.form .steps{display:grid;grid-template-columns:1fr;gap:10px;margin:2px 0 6px;text-align:left}
.form .step{padding:13px 15px;border-radius:var(--r-md);background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
.form .step b{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.form .step b i{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:11px;font-style:normal}
.form .step span{font-size:12px;color:var(--t-2);line-height:1.55;display:block}
.form .step code,.hint code,.sub code{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.09);padding:2px 6px;border-radius:6px;word-break:break-all}
.form .step a{color:var(--accent);font-weight:650;text-decoration:underline;text-underline-offset:2px}

/* ---------- Focus engine (estilo tvOS): brillito con el acento, sin bordes blancos ---------- */
[data-focus]{outline:none}
.focused{transform:scale(1.055)!important;z-index:20;position:relative;
  box-shadow:0 0 0 2px var(--accent-soft),0 8px 26px -6px var(--accent),0 22px 48px -14px rgba(0,0,0,.7)!important;
  border-radius:inherit}
.card.focused .art{box-shadow:0 0 0 2px var(--accent-soft),0 8px 30px -6px var(--accent),0 26px 54px -14px rgba(0,0,0,.75)}
.card.focused{transform:scale(1.06)!important}
.card.focused .art img{transform:scale(1.07)}
.focused .t1{color:#fff}
.icon-btn.focused,.tab.focused,.chip.focused,.menu-item.focused,.btn.focused,.mini-btn.focused,.pl-btn.focused,.q-item.focused,.sr-item.focused,.ep-row.focused,.acc-chip.focused{background:rgba(255,255,255,.16);color:#fff}

/* ---------- Scrollbars ---------- */
.modal::-webkit-scrollbar,.search-results::-webkit-scrollbar{width:9px}
.modal::-webkit-scrollbar-thumb,.search-results::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:5px;border:2px solid transparent;background-clip:content-box}
.modal::-webkit-scrollbar-track,.search-results::-webkit-scrollbar-track{background:transparent}

/* ---------- Responsive / móviles ---------- */
@media (max-width:900px){
  .brand-name{display:none}
  .tab{padding:9px 12px}
  .tab .lbl{display:none}
  main{padding:92px 16px 110px}
  .hero{height:min(46vh,400px)}
  .hero-content{left:24px;right:24px;bottom:24px}
  .hero-dots{right:20px;bottom:16px}
  .det-body{flex-direction:column;margin-top:-40px;padding:0 22px 24px;gap:16px}
  .det-poster{width:130px}
  .det-info{padding-top:0}
  .det-hero{height:230px}
  .search-results{grid-template-columns:1fr;max-height:62vh}
  .sr-col-head{grid-column:1/-1}
  .acc-chip .nm{display:none}
  .acc-chip{padding:0 9px}
  .onb .steps{grid-template-columns:1fr}
  .set-grid{max-width:100%}
}
/* Pantallas táctiles: lo que dependía del hover pasa a estar siempre visible */
@media (hover:none){
  .card .fav-btn{opacity:1;transform:none}
  .hero-arrow,.rail-nav{display:none}                /* el deslizamiento es con el dedo */
  .kbd-hint,.pl-hints,.search-kbd{display:none}      /* pistas de teclado sin sentido en móvil */
}
@media (max-width:560px){
  main{padding:86px 14px calc(118px + env(safe-area-inset-bottom))}
  /* Barra superior compacta, respeta el "notch" */
  .topbar{padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
  .pill{padding:7px 8px;gap:6px}
  .icon-btn{width:35px;height:35px}
  .acc-chip{height:35px}
  .tab{padding:8px 10px}
  /* Encabezados y rejillas: 3 pósters cómodos en pantallas pequeñas */
  .view-head{flex-wrap:wrap;gap:6px 12px}
  .view-title{font-size:21px}
  .section-title{font-size:16.5px;margin-top:20px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:14px 11px}
  .grid.chan-grid{grid-template-columns:1fr}
  .card{--cw:148px}
  .card.chan{--cw:236px}
  .card .t1{font-size:12.5px}
  /* Hero compacto */
  .hero{height:min(52vh,420px);border-radius:var(--r-lg)}
  .hero-content{left:16px;right:16px;bottom:18px}
  .hero h1{font-size:clamp(23px,6.4vw,30px)}
  .hero-kicker{margin-bottom:10px;font-size:10.5px}
  .hero-meta{font-size:12px;gap:6px 10px;margin-bottom:10px}
  .hero-plot{display:none}
  .hero-actions{gap:9px}
  .hero-actions .btn{padding:11px 14px;font-size:13px;flex:1;min-width:0}
  .row2{grid-template-columns:1fr}
  /* Vista de detalle */
  .det-body{padding:0 16px 22px}
  .det-info h2{font-size:21px}
  .det-plot{font-size:13.5px}
  .det-actions{gap:9px}
  .det-actions .btn{flex:1;min-width:0;padding:12px 14px}
  .ep-row{gap:10px;padding:10px 11px}
  .ep-num{width:56px;height:42px;font-size:12px}
  /* Modales como hoja inferior (bottom sheet) */
  .modal-veil{padding:0;align-items:flex-end}
  .modal,.modal.slim{width:100%;max-height:93dvh;border-radius:22px 22px 0 0;border-left:0;border-right:0;border-bottom:0}
  .modal-x{top:12px;right:12px;width:40px;height:40px}
  .form{padding:20px 18px}
  .form-actions{flex-wrap:wrap}
  .form-actions .btn{flex:1;min-width:0}
  .confirm-body{padding:22px 18px}
  /* Buscador pegado arriba */
  #search-overlay{padding:calc(8px + env(safe-area-inset-top)) 10px 14px}
  .search-row{padding:14px;gap:10px}
  #search-input{font-size:16px}
  .sr-item{padding:11px 8px}
  /* Evita que iOS haga zoom automático al enfocar formularios (requiere ≥16px) */
  .field input,.field select,.ed-search,.set-row select,input[type="text"],input[type="password"],input[type="number"],input[type="url"],select{font-size:16px}
  .menu{min-width:220px}
  .menu-item{padding:12px 14px}
  /* Ajustes */
  .set-card{padding:18px 16px;border-radius:var(--r-md)}
  .set-row{flex-wrap:wrap;gap:10px 14px}
  .set-row .lbl{flex:1 1 200px}   /* el control ancho baja de línea sin aplastar el título */
  .set-row select{max-width:100%}
  .acc-row{flex-wrap:wrap}
  .acc-row .inf{flex:1 1 150px}
  .ed-sum{min-width:0}
  /* Descargas */
  .dl-item{padding:12px;gap:11px}
  .dl-actions{flex-wrap:wrap}
  #dl-hub{left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));align-items:stretch}
  .hub-item{max-width:none}
  /* Onboarding */
  .onb{padding:30px 18px;margin-top:2vh;border-radius:var(--r-lg)}
  .onb h1{font-size:23px}
  .onb p{font-size:13.5px}
  /* Reproductor: controles grandes y sin desborde */
  .pl-top{padding:calc(12px + env(safe-area-inset-top)) 14px 8px;gap:10px}
  #pl-title{font-size:15px}
  #pl-sub{font-size:11.5px}
  .pl-epgmini{display:none}
  .pl-controls{padding:40px 12px calc(14px + env(safe-area-inset-bottom))}
  .pl-seekrow{gap:10px}
  .pl-time{font-size:11px}
  .pl-btnrow{flex-wrap:wrap;justify-content:center;gap:2px}
  .pl-btn{width:40px;height:40px}
  .vol-wrap{gap:0}
  #pl-vol{display:none}
  #pl-menu{right:12px;bottom:120px}
  .rec-badge{top:calc(14px + env(safe-area-inset-top));right:14px;padding:7px 12px;font-size:11.5px}
  .pl-error{padding:16px}
  .pl-error .card-err{padding:22px 18px}
  /* Toasts a lo ancho */
  #toast-root{bottom:calc(16px + env(safe-area-inset-bottom));width:calc(100% - 20px)}
  .toast{max-width:100%}
  /* MultiPantalla */
  .multi-bar{padding:calc(10px + env(safe-area-inset-top)) 10px 6px;gap:8px}
  .multi-title{font-size:15px}
  .multi-count .chip{padding:7px 13px;font-size:12px}
  .multi-grid{gap:8px;padding:4px 10px calc(12px + env(safe-area-inset-bottom))}
  .multi-slot{border-radius:14px}
  .ms-info{font-size:11px;padding:6px 10px;left:8px;bottom:8px;max-width:calc(100% - 16px)}
  .ms-audio{font-size:9.5px;padding:4px 9px}
  .ms-pick{width:32px;height:32px}
}
/* Móvil en horizontal: el reproductor aprovecha la altura */
@media (max-width:920px) and (orientation:landscape) and (max-height:520px){
  .pl-top{padding:10px 16px 4px}
  .pl-controls{padding:28px 16px 10px}
  .pl-btn{width:36px;height:36px}
  .pl-seekrow{margin-bottom:6px;gap:12px}
  #pl-title{font-size:14px}
  .rec-badge{top:10px;right:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}
/* Panel de categorías del reproductor (TV en vivo) */
.cat-panel{position:absolute;top:0;left:0;bottom:0;width:min(330px,82%);z-index:40;background:rgba(10,12,17,.94);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;animation:catIn .22s ease}
@keyframes catIn{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px 18px;font-weight:750;font-size:15px}
.cat-body{flex:1;overflow-y:auto;padding:0 10px 16px}
.cat-item{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border-radius:11px;font-size:13.5px;font-weight:600;text-align:left;color:var(--t-1);transition:background .15s}
.cat-item small{margin-left:auto;color:var(--t-3);font-weight:600}
.cat-item .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.cat-item.cur{color:var(--accent)}
.cat-item.cur .live-dot{box-shadow:0 0 0 3px rgba(10,132,255,.25)}
.cat-back{color:var(--t-2)}
/* Pista de atajos del reproductor */
.pl-hints{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);z-index:7;pointer-events:none;
  font-size:11.5px;font-weight:600;letter-spacing:.2px;color:rgba(255,255,255,.62);background:rgba(8,10,14,.45);
  border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:7px 16px;white-space:nowrap;max-width:92%;
  overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
#player-root.hidecursor .pl-hints{opacity:0}
/* Pista del mando de TV (inicio) */
.kbd-hint{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;margin:28px auto 36px;max-width:880px;
  font-size:12px;font-weight:600;color:var(--t-3);letter-spacing:.2px;text-align:center;padding:0 18px}
.kbd-hint b{display:inline-block;padding:2px 9px;border-radius:7px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);color:var(--t-2);font-weight:750;font-size:11px}
.kbd-hint .sep{font-style:normal;opacity:.55}
</style>

<body>
<!-- =======================================================
     DJ-IPTV · Estructura de la aplicación (SPA)
     ======================================================= -->
<div id="ambient" aria-hidden="true"></div>

<!-- Barra superior flotante glass -->
<header class="topbar" id="topbar">
  <div class="pill">
    <div class="brand" data-focus id="btn-home" role="button" tabindex="-1" aria-label="DJ-IPTV, ir al inicio">
      <span class="logo-mark">DJ</span>
      <span class="brand-name">DJ·IPTV <small>tvOS</small></span>
    </div>
    <nav class="tabs" id="nav-tabs" aria-label="Secciones principales"></nav>
    <div class="top-actions">
      <button class="icon-btn" id="btn-search" data-focus aria-label="Buscar contenido (Ctrl+K)" title="Buscar (Ctrl+K)"></button>
      <div class="acc-wrap">
        <button class="acc-chip" id="btn-accounts" data-focus aria-label="Selector de cuenta" title="Cuentas"></button>
        <div class="menu" id="menu-accounts" hidden role="menu" aria-label="Cuentas"></div>
      </div>
      <button class="icon-btn" id="btn-settings" data-focus aria-label="Ajustes" title="Ajustes"></button>
    </div>
  </div>
</header>

<!-- Vistas principales -->
<main id="main">
  <section class="view" id="view-dashboard" aria-label="Inicio"></section>
  <section class="view" id="view-live" hidden aria-label="Canales en vivo"></section>
  <section class="view" id="view-movies" hidden aria-label="Películas"></section>
  <section class="view" id="view-series" hidden aria-label="Series"></section>
  <section class="view" id="view-downloads" hidden aria-label="Descargas y grabaciones"></section>
  <section class="view" id="view-settings" hidden aria-label="Ajustes"></section>
</main>

<!-- Buscador global flotante -->
<div id="search-overlay" hidden role="dialog" aria-label="Buscador global">
  <div class="search-panel">
    <div class="search-row">
      <span id="search-ic"></span>
      <input id="search-input" type="text" placeholder="Buscar canales, películas y series…" autocomplete="off" spellcheck="false"/>
      <span class="search-kbd">ESC</span>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<!-- Contenedor de modales -->
<div id="modal-root"></div>

<!-- Reproductor universal -->
<div id="player-root" hidden role="dialog" aria-label="Reproductor">
  <video id="pl-video" playsinline></video>
  <div class="pl-spin" id="pl-spin" hidden><div class="spinner"></div></div>
  <div class="pl-top" id="pl-top">
    <button class="icon-btn" id="pl-back" data-focus aria-label="Cerrar reproductor (Esc)"></button>
    <div class="pl-titles">
      <div id="pl-title"></div>
      <div id="pl-sub"></div>
    </div>
    <div class="pl-epgmini" id="pl-epgmini" hidden></div>
  </div>
  <div class="rec-badge" id="pl-rec" hidden>
    <span class="rec-dot"></span><span id="pl-rec-time">00:00</span>
  </div>
  <div class="cat-panel" id="pl-catpanel" hidden>
    <div class="cat-head"><span>Categorías</span><button class="icon-btn" id="pl-catx" aria-label="Cerrar categorías (Esc)"></button></div>
    <div class="cat-body" id="pl-catbody"></div>
  </div>
  <div class="pl-error" id="pl-error" hidden></div>
  <div class="pl-controls" id="pl-controls">
    <div class="pl-seekrow">
      <span class="live-pill" id="pl-livebadge" hidden role="button" tabindex="-1" aria-label="Volver al directo"><i></i>EN VIVO</span>
      <input id="pl-seek" type="range" min="0" max="1000" value="0" step="1" data-focus aria-label="Progreso de reproducción"/>
      <span class="pl-time" id="pl-time">00:00 / 00:00</span>
    </div>
    <div class="pl-btnrow">
      <button class="pl-btn" id="pl-prev" data-focus aria-label="Anterior: canal o episodio" hidden></button>
      <button class="pl-btn" id="pl-play" data-focus aria-label="Reproducir o pausar (Espacio)"></button>
      <button class="pl-btn" id="pl-next" data-focus aria-label="Siguiente: canal o episodio" hidden></button>
      <div class="vol-wrap">
        <button class="pl-btn" id="pl-mute" data-focus aria-label="Silenciar (M)"></button>
        <input id="pl-vol" type="range" min="0" max="100" value="100" data-focus aria-label="Volumen"/>
      </div>
      <div class="pl-spacer"></div>
      <button class="pl-btn" id="pl-quality" data-focus aria-label="Calidad de vídeo" hidden></button>
      <button class="pl-btn" id="pl-fav" data-focus aria-label="Favorito (L)" hidden></button>
      <button class="pl-btn" id="pl-record" data-focus aria-label="Grabar (R)" hidden></button>
      <button class="pl-btn" id="pl-download" data-focus aria-label="Descargar (B)" hidden></button>
      <button class="pl-btn" id="pl-pip" data-focus aria-label="Picture-in-Picture" hidden></button>
      <button class="pl-btn" id="pl-full" data-focus aria-label="Pantalla completa (F)"></button>
    </div>
    <div class="menu" id="pl-menu" hidden></div>
  </div>
  <div class="pl-hints" id="pl-hints"></div>
</div>

<!-- MultiPantalla: 2, 3 o 4 canales en vivo a la vez (v1.9).
     La pantalla elegida se escucha; el resto queda silenciado. -->
<div id="multi-root" hidden role="dialog" aria-label="MultiPantalla">
  <div class="multi-bar">
    <button class="icon-btn" id="multi-back" data-focus aria-label="Cerrar MultiPantalla (Esc o 1)" title="Cerrar (Esc o 1)"></button>
    <div class="multi-title" id="multi-title">MultiPantalla</div>
    <div class="multi-count" id="multi-count" role="group" aria-label="Número de pantallas">
      <button class="chip" data-n="2" data-focus aria-label="2 pantallas">2</button>
      <button class="chip" data-n="3" data-focus aria-label="3 pantallas">3</button>
      <button class="chip" data-n="4" data-focus aria-label="4 pantallas">4</button>
    </div>
  </div>
  <div class="multi-grid" id="multi-grid"></div>
  <div class="multi-hint" id="multi-hint"></div>
</div>

<!-- Hub flotante de progreso de descargas -->
<div id="dl-hub" hidden></div>

<!-- Toasts -->
<div id="toast-root" aria-live="polite"></div>
<script>
/* ============================================================
 * DJ-IPTV · RED DE SEGURIDAD (independiente del núcleo)
 * Muestra en pantalla cualquier error interno o de compatibilidad.
 * Se ejecuta aunque el script principal no llegue a arrancar.
 * ============================================================ */
(function () {
  var shown = 0;
  function overlay(title, detail) {
    var root = document.getElementById('dj-fault-root');
    if (!root) {
      root = document.createElement('div');
      root.id = 'dj-fault-root';
      root.style.cssText = 'position:fixed;left:14px;right:14px;bottom:14px;z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none';
      (document.body || document.documentElement).appendChild(root);
    }
    shown++;
    if (shown > 4) return;
    var card = document.createElement('div');
    card.style.cssText = 'pointer-events:auto;max-width:600px;background:rgba(60,10,14,.93);color:#ffd9dc;border:1px solid rgba(255,110,120,.5);' +
      'border-radius:14px;padding:12px 14px;font:12.5px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.55)';
    var b = document.createElement('b');
    b.textContent = title;
    b.style.cssText = 'display:block;margin-bottom:3px';
    var pre = document.createElement('div');
    pre.textContent = String(detail || '').slice(0, 460);
    pre.style.cssText = 'white-space:pre-wrap;word-break:break-word';
    var x = document.createElement('button');
    x.textContent = 'Cerrar';
    x.style.cssText = 'margin-top:8px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer';
    x.onclick = function () { card.remove(); };
    card.appendChild(b); card.appendChild(pre); card.appendChild(x);
    root.appendChild(card);
  }
  window.__djFault = function (where, e) {
    overlay('DJ-IPTV · ' + where, (e && (e.stack || e.message)) || e);
  };
  window.addEventListener('error', function (ev) {
    if (ev && ev.message && !/Script error/i.test(ev.message))
      overlay('DJ-IPTV · Error interno', ev.message + (ev.filename ? '\n' + ev.filename.split('/').pop() + ':' + ev.lineno : ''));
  });

  const n = document.createElement(tag);

/* ---------- IndexedDB nativo (promesas) ---------- */
const DB = {
  NAME: 'dj-iptv', VER: 1, _db: null,
  STORES: [
    ['accounts', { keyPath: 'id' }],   // perfiles multicuenta
    ['cache', { keyPath: 'key' }],     // catálogos/EPG por cuenta
    ['downloads', { keyPath: 'id' }],  // blobs + metadatos offline/PVR
    ['kv', { keyPath: 'k' }],          // clave criptográfica y otros
  ],
  _db: null,
  _ls: null,          // respaldo cuando IndexedDB no está disponible
  _lsWarned: false,

  open() {
    if (this._db) return Promise.resolve(this._db);
    if (this._ls) return Promise.resolve(this._ls);
    return new Promise((res, rej) => {
      let settled = false;
      const fail = err => {
        if (settled) return;
        settled = true;
        try { this._ls = this._lsShim(); res(this._ls); }
        catch (e) { rej(err || e); }
      };
      try {
        if (!window.indexedDB) { fail(new Error('IndexedDB no existe en este navegador')); return; }
        const guard = setTimeout(() => fail(new Error('IndexedDB no respondió')), 4000);
        const r = indexedDB.open(this.NAME, this.VER);
        r.onupgradeneeded = () => {
          const d = r.result;
          for (const [name, opts] of this.STORES)
            if (!d.objectStoreNames.contains(name)) d.createObjectStore(name, opts);
        };
        r.onsuccess = () => { clearTimeout(guard); settled = true; this._db = r.result; res(r.result); };
        r.onerror = () => { clearTimeout(guard); fail(r.error); };
        r.onblocked = () => { clearTimeout(guard); fail(new Error('IndexedDB bloqueado')); };
      } catch (e) { fail(e); }
    });
  },

  /** Respaldo en localStorage con la misma API de promesas (navegadores sin IndexedDB). */
  _lsShim() {
    const pfx = 'dj:idb:';
    const read = store => {
      try { return JSON.parse(localStorage.getItem(pfx + store)) || {}; }
      catch (_e) { return {}; }
    };
    const write = (store, map) => {
      localStorage.setItem(pfx + store, JSON.stringify(map));
    };
    const warnOnce = () => {
      if (this._lsWarned) return;
      this._lsWarned = true;
      Toast.info('Este navegador no permite IndexedDB: se usa un almacenamiento reducido (las descargas grandes no se conservarán).', 6000);
    };
    const keyOf = (store, key) => {
      return key !== undefined && key !== null ? String(key) : null;
    };
    return {
      __ls: true,
      get: (store, key) => {
        const v = read(store)[keyOf(store, key)];
        return Promise.resolve(v === undefined ? null : v);
      },
      all: store => Promise.resolve(Object.values(read(store))),
      put: (store, val) => new Promise((res, rej) => {
        try {
          const map = read(store);
          const k = keyOf(store, val[this.STORES.find(s => s[0] === store)[1].keyPath]);
          map[k] = val;
          write(store, map);
          warnOnce();
          res(val);
        } catch (e) { rej(e); }
      }),
      del: (store, key) => new Promise((res, rej) => {
        try { const map = read(store); delete map[keyOf(store, key)]; write(store, map); res(true); }
        catch (e) { rej(e); }
      }),
      clear: store => new Promise((res, rej) => {
        try { localStorage.removeItem(pfx + store); res(true); } catch (e) { rej(e); }
      }),
    };
  },

  _tx(store, mode) { return this._db.transaction(store, mode).objectStore(store); },
  get(store, key) {
    if (this._ls) return this._ls.get(store, key);
    return new Promise((res, rej) => {
      const q = this._tx(store, 'readonly').get(key);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  all(store) {
    if (this._ls) return this._ls.all(store);
    return new Promise((res, rej) => {
      const q = this._tx(store, 'readonly').getAll();
      q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error);
    });
  },
  put(store, val) {
    if (this._ls) return this._ls.put(store, val);
    return new Promise((res, rej) => {
      const q = this._tx(store, 'readwrite').put(val);
      q.onsuccess = () => res(val); q.onerror = () => rej(q.error);
    });
  },
  del(store, key) {
    if (this._ls) return this._ls.del(store, key);
    return new Promise((res, rej) => {
      const q = this._tx(store, 'readwrite').delete(key);
      q.onsuccess = () => res(true); q.onerror = () => rej(q.error);
    });
  },
  clear(store) {
    if (this._ls) return this._ls.clear(store);
    return new Promise((res, rej) => {
      const q = this._tx(store, 'readwrite').clear();
      q.onsuccess = () => res(true); q.onerror = () => rej(q.error);
    });
  },
  kvGet(k) { return this.get('kv', k).then(r => r && r.v); },
  kvPut(k, v) { return this.put('kv', { k, v }); },
};

/* ---------- Cifrado local AES-GCM (Web Crypto API) ----------
 * Si el navegador no ofrece WebCrypto (contexto no seguro o muy antiguo),
 * se degrada a un ofuscado reversible (prefijo «w:») para no bloquear la app. */
const Crypt = {
  _key: null,
  XORKEY: 'DJ-IPTV·almacenamiento·local·v1',
  b64(buf) { let s = ''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); },
  unb64(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; },
  hasSubtle() { return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.importKey); },
  _xor(text) {
    const bytes = new TextEncoder().encode(text);
    const k = new TextEncoder().encode(this.XORKEY);
    for (let i = 0; i < bytes.length; i++) bytes[i] ^= k[i % k.length];
    let s = '';
    for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s);
  },
  _unxor(b64) {
    const bin = atob(b64);
    const k = new TextEncoder().encode(this.XORKEY);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ k[i % k.length];
    return new TextDecoder().decode(bytes);
  },
  async key() {
    if (this._key) return this._key;
    let raw = await DB.kvGet('devkey');
    if (!(raw instanceof ArrayBuffer) || raw.byteLength !== 32) {
      raw = crypto.getRandomValues(new Uint8Array(32)).buffer;
      await DB.kvPut('devkey', raw);
    }
    this._key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
    return this._key;
  },
  async enc(text) {
    if (!this.hasSubtle()) return 'w:' + this._xor(text);   // modo degradado sin WebCrypto
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await this.key(), new TextEncoder().encode(text));
    return this.b64(iv) + '.' + this.b64(ct);
  },
  async dec(payload) {
    const p = String(payload || '');
    if (p.startsWith('w:')) {
      try { return this._unxor(p.slice(2)); } catch (_e) { return ''; }
    }
    if (!this.hasSubtle()) return '';   // payload AES pero sin WebCrypto: indescifrable aquí
    try {
      const [ivS, ctS] = p.split('.');
      if (!ivS || !ctS) return '';
      const pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: this.unb64(ivS) }, await this.key(), this.unb64(ctS));
      return new TextDecoder().decode(pt);
    } catch (_e) { return ''; }
  },
};

    document.documentElement.classList.toggle('rm', !!this.data.reduceMotion);

};

/* ---------- Favoritos (TV en vivo, películas y series) ----------
 * Se guardan por cuenta en localStorage: 'dj:favs:<cuenta>' → {live:[], vod:[], series:[]}.
 * Cada entrada es el id del canal (stream_id), la película (stream_id) o la serie (series_id);
 * en modo demo se usa el id ficticio del catálogo de demostración. */
const Favs = {
  _key() {
    const acc = Session.isDemo ? 'demo' : (Accounts.activeId || 'ninguna');
    return 'dj:favs:' + acc;
  },
  _data() {
    try { const d = JSON.parse(localStorage.getItem(this._key()) || '{}'); return d && typeof d === 'object' ? d : {}; }
    catch (_e) { return {}; }
  },
  _save(d) { try { localStorage.setItem(this._key(), JSON.stringify(d)); } catch (_e) { /* lleno o privado */ } },
  has(type, id) {
    if (id == null) return false;
    const d = this._data();
    return !!(d[type] && d[type].indexOf(String(id)) >= 0);
  },
  /** Añade/quita. Devuelve true si quedó AÑADIDO. */
  toggle(type, id) {
    if (id == null) return false;
    const k = String(id), d = this._data();
    if (!d[type]) d[type] = [];
    const i = d[type].indexOf(k);
    if (i >= 0) d[type].splice(i, 1); else d[type].unshift(k);
    this._save(d);
    return i < 0;
  },
  ids(type) { const d = this._data(); return d[type] || []; },
  count(type) { return this.ids(type).length; },
  /** Id estable de un elemento para favoritos (canal, película o serie). */
  idOf(kind, item) {
    if (!item) return null;
    const id = kind === 'series' ? (item.series_id != null ? item.series_id : item.id)
      : (item.stream_id != null ? item.stream_id : item.id);
    return id == null ? null : String(id);
  },
  /** Sincroniza todas las estrellas visibles con el estado guardado. */
  refreshStars() {
    const btns = document.querySelectorAll('.fav-btn');
    for (let i = 0; i < btns.length; i++) {
      const b = btns[i];
      b.classList.toggle('on', Favs.has(b.dataset.favType, b.dataset.favId));
    }
  },
};
