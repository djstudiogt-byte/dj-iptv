    el('div', { class: 'det-hero' },
      el('div', { class: 'bg', style: 'background-image:url("' + (item.cover || item.stream_icon || '') + '")' }),
      el('div', { class: 'fade' })),
    el('div', { class: 'det-body' },
      el('div', { class: 'det-poster' },
        el('img', { src: item.cover || fallbackPoster(item.name), alt: item.name, onerror: e => { e.target.onerror = null; e.target.src = fallbackPoster(item.name); } })),
      el('div', { class: 'det-info' },
        el('h2', {}, item.name || ''),
        metaRow, plotEl,
        el('div', { style: 'margin:14px 0 0' }, el('h3', { style: 'font-size:15px;font-weight:750' }, 'Episodios'), seasonsWrap, epList)))));

  if (Number(item.rating) > 0) metaRow.append(el('span', { class: 'imdb', html: I('star', 13) + '<b>' + Number(item.rating).toFixed(1) + '</b>' }));

  /** Normaliza get_series_info: «episodes» puede venir como objeto {«1»:[…]} o como
   *  array plano; ordena episodios por número dentro de cada temporada. */
  const normalizeSeasons = d => {
    const epsObj = (d && d.episodes) || {};
    let seasons = [];
    if (Array.isArray(epsObj)) {
      const by = {};
      for (const ep of epsObj) {
        const s = Number((ep && ep.season) || 1) || 1;
        if (!by[s]) by[s] = [];
        by[s].push(ep);
      }
      seasons = Object.keys(by).map(k => ({ season: Number(k), episodes: by[k] }));
    } else {
      seasons = Object.keys(epsObj).map(k => ({ season: Number(k), episodes: epsObj[k] || [] }));
    }
    seasons.sort((a, b) => a.season - b.season);
    for (const sn of seasons)
      sn.episodes.sort((a, b) => (Number(a.episode_num) || 0) - (Number(b.episode_num) || 0));
    return seasons;
  };

  const retryBtn = () => {
    const b = el('button', { class: 'btn btn-glass btn-sm', 'data-focus': '', html: I('refresh', 16) + '<span>Reintentar</span>' });
    b.addEventListener('click', () => { SeriesInfoMem.delete(item.series_id); loadInfo(); });
    return b;
  };

  let loadSeq = 0;   // un reintento viejo no puede pintar encima de uno nuevo
  async function loadInfo() {
    const seq = ++loadSeq;
    epList.innerHTML = '';
    epList.append(el('div', { class: 'search-hint', style: 'padding:18px' }, 'Cargando temporadas…'));
    $$('span', metaRow).forEach(s => { if (!s.classList.contains('imdb')) s.remove(); });

    let seasons = [];
    try {
      if (item.demo) {
        const s = DemoData.series.find(x => x.id === item.series_id);
        const d = DemoData.seriesInfo(s);
        seasons = d.seasons;
        if (!item.plot) plotEl.textContent = d.info.plot || '';
        metaRow.append(el('span', {}, item.year || ''));
        metaRow.append(el('span', {}, s.seasons + ' temporadas'));
      } else {
        if (!Session.client) throw new Error('No hay cuenta activa: elige tu cuenta arriba y vuelve a abrir la serie.');
        let d = SeriesInfoMem.get(item.series_id);
        if (!d) {
          d = await Session.client.getSeriesInfo(item.series_id);
          const s2 = normalizeSeasons(d);
          if (s2.length) SeriesInfoMem.set(item.series_id, d);   // no guardar respuestas sin episodios
        }
        seasons = normalizeSeasons(d);
        const inf = (d && d.info) || {};
        if (inf.plot) plotEl.textContent = inf.plot;
        if (inf.genre) metaRow.append(el('span', {}, inf.genre));
        if (inf.release || inf.releasedate) metaRow.append(el('span', {}, String(inf.release || inf.releasedate).slice(0, 4)));
        metaRow.append(el('span', {}, seasons.length + (seasons.length === 1 ? ' temporada' : ' temporadas')));
        if (inf.backdrop || inf.cover) $('.det-hero .bg', m.veil).style.backgroundImage = 'url("' + (inf.backdrop || inf.cover) + '")';
      }
    } catch (e) {
      if (seq !== loadSeq) return;
      epList.innerHTML = '';
      epList.append(el('div', { class: 'search-hint', style: 'display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px' },
        el('div', { style: 'text-align:center' }, 'No se pudo cargar la serie: ' + Net.explain(e)),
        retryBtn()));
      return;
    }
    if (seq !== loadSeq) return;

    if (!seasons.length) {
      epList.innerHTML = '';
      epList.append(el('div', { class: 'search-hint', style: 'display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px' },
        el('div', { style: 'text-align:center' }, 'El servidor no devolvió episodios para esta serie (puede que aún no los haya publicado).'),
        retryBtn()));
      return;
    }

    seasonsWrap.hidden = false;
    const renderSeason = (sn) => {
      epList.innerHTML = '';
      for (const ep of sn.episodes) {
        const info = ep.info || {};
        const durTxt = info.duration
          ? (/^\d+$/.test(info.duration) ? Math.round(info.duration / 60) + ' min' : info.duration)
          : '';
        const row = el('div', { class: 'ep-row', 'data-focus': '', role: 'button', tabindex: '-1' });
        const open = () => Player.openEpisode(item, sn.season, ep, sn.episodes);
        row.addEventListener('click', open);
        row.append(
          el('div', { class: 'ep-num' }, 'T' + sn.season + '·E' + (ep.episode_num || '?')),
          el('div', { class: 'ep-mid' },
            el('div', { class: 'ep-t' }, ep.title || ('Episodio ' + (ep.episode_num || ''))),
            el('div', { class: 'ep-d' }, [durTxt, info.plot].filter(Boolean).join(' · ') || 'Sin descripción.')),
          el('div', { class: 'ep-actions' },
            el('button', { class: 'mini-btn accent', html: I('play', 16), 'data-focus': '', 'aria-label': 'Reproducir episodio', onclick: e => { e.stopPropagation(); open(); } })));
        if (!item.demo) row.append(
          el('button', { class: 'mini-btn', html: I('download', 16), 'data-focus': '', 'aria-label': 'Descargar episodio', onclick: e => { e.stopPropagation(); downloadEpisode(item, sn.season, ep); Toast.info('Descarga iniciada: T' + sn.season + 'E' + ep.episode_num); } }));
        epList.append(row);
      }
    };

    seasons.forEach((sn, i) => {
      const b = el('button', {
        class: 'chip' + (i === 0 ? ' active' : ''), 'data-focus': '',
        onclick: () => { $$('.chip', seasonsWrap).forEach(c => c.classList.remove('active')); b.classList.add('active'); renderSeason(sn); },
      }, 'Temporada ' + sn.season);
      seasonsWrap.append(b);
    });
    renderSeason(seasons[0]);
  }

  loadInfo();
}

/* ---------- Sincronía con la sesión ---------- */
on('session:loading', () => { if (Router.current === 'dashboard') renderDashboard(); });
on('session:partial', () => { dashRev = -1; if (Router.current === 'dashboard') renderDashboard(); });
on('session:changed', () => {
  dashRev = -1;
  Topbar.renderAccounts();
  if (['dashboard', 'live', 'movies', 'series'].includes(Router.current)) Router.refreshView();
});
on('session:error', () => { if (Router.current === 'dashboard') renderDashboard(); });

/* ---------- Utilidad de MIME por extensión ---------- */
function mimeForExt(ext) {
  ext = String(ext || '').toLowerCase();
  return { mp4: 'video/mp4', m4v: 'video/mp4', mov: 'video/quicktime', mkv: 'video/x-matroska', avi: 'video/x-msvideo', webm: 'video/webm', ts: 'video/mp2t' }[ext] || 'application/octet-stream';
}
/* ============================================================
 * DJ-IPTV · REPRODUCTOR UNIVERSAL (Fase 4)
 * Hls.js + fallback nativo · Calidad · EPG · Controles tvOS
 * ============================================================ */

const Player = {
  hls: null,
  video: null,
  isOpenFlag: false,
  isLive: false,
  canDownload: false,
  canRecord: false,
  menuOpen: false,
  isOpen() { return this.isOpenFlag; },
  demoSrc: null,          // {stream, stop()} del modo demo
  localUrl: null,
  _prevFocus: null,
  _hideTimer: 0,
  _epgTimer: 0,
  _retryCount: 0,
  _proxyTried: false,
  _lastOpts: null,

  el: {},                 // referencias DOM

  init() {
    const ids = ['player-root', 'pl-video', 'pl-back', 'pl-title', 'pl-sub', 'pl-epgmini',
      'pl-rec', 'pl-rec-time', 'pl-spin', 'pl-error', 'pl-controls', 'pl-livebadge',
      'pl-seek', 'pl-time', 'pl-play', 'pl-mute', 'pl-vol', 'pl-quality',
      'pl-fav', 'pl-record', 'pl-download', 'pl-pip', 'pl-full', 'pl-menu',
      'pl-prev', 'pl-next', 'pl-catpanel', 'pl-catbody', 'pl-catx', 'pl-hints'];
    ids.forEach(id => { const key = id === 'player-root' ? 'root' : id.replace('pl-', ''); this.el[key] = $('#' + id); });
    this.el.root = $('#player-root');        // alias estable
    this.el.recTime = $('#pl-rec-time');     // alias legible para el cronómetro PVR
    this.video = this.el.video;

    this.el.back.innerHTML = I('back', 20);
    this.el.play.innerHTML = I('play', 22);
    this.el.mute.innerHTML = I('vol', 20);
    this.el.quality.innerHTML = I('grid', 20);
    this.el.record.innerHTML = I('record', 20);
    this.el.fav.innerHTML = I('star', 20);
    this.el.download.innerHTML = I('download', 20);
    this.el.pip.innerHTML = I('pip', 20);
    this.el.full.innerHTML = I('full', 20);
    this.el.prev.innerHTML = I('prev', 20);
    this.el.next.innerHTML = I('next', 20);
    this.el.catx.innerHTML = I('x', 16);

    this.el.back.addEventListener('click', () => this.requestClose());
    this.el.play.addEventListener('click', () => this.togglePlay());
    this.el.mute.addEventListener('click', () => this.toggleMute());
    this.el.full.addEventListener('click', () => this.toggleFull());
    this.el.prev.addEventListener('click', () => this.step(-1));
    this.el.next.addEventListener('click', () => this.step(1));
    this.el.fav.addEventListener('click', () => this.toggleFav());
    this.el.catx.addEventListener('click', () => this.closeCats());
    if (this.el.pip && document.pictureInPictureEnabled)
      this.el.pip.addEventListener('click', () => this.togglePip());
    else this.el.pip.hidden = true;

    this.el.vol.addEventListener('input', e => this.setVolume(Number(e.target.value) / 100));
    // Barra de progreso: mientras se arrastra solo se previsualiza; al soltar se salta.
    // Así el timeupdate nunca pelea con el pulgar y el salto se hace una sola vez.
    this.el.seek.addEventListener('input', e => {
      if (this.isLive || !isFinite(this.video.duration)) return;
      this._scrubbing = true;
      const t = (Number(e.target.value) / 1000) * this.video.duration;
      this.el.time.textContent = fmtTime(Math.max(0, t)) + ' / ' + fmtTime(this.video.duration);
      this.poke();
    });
    this.el.seek.addEventListener('change', e => {
      this._scrubbing = false;
      if (this.isLive || !isFinite(this.video.duration)) return;
      const t = Math.max(0, (Number(e.target.value) / 1000) * this.video.duration);
      this._seekTarget = t; this._seekAt = Date.now();   // para el guardián de adelanto
      this.video.currentTime = t;
      this.poke();
    });
    this.el.livebadge.addEventListener('click', () => this.goLiveEdge());
    this.video.addEventListener('click', () => this.togglePlay());
    this.video.addEventListener('dblclick', () => this.toggleFull());

    const v = this.video;
    v.addEventListener('playing', () => { this.spin(false); this.poke(); this.syncPlayIcon(); });
    v.addEventListener('pause', () => { this.poke(); this.syncPlayIcon(); });
    v.addEventListener('waiting', () => this.spin(true));
    v.addEventListener('seeking', () => { if (!this._scrubbing) this.spin(true); });
    v.addEventListener('seeked', () => { this.spin(false); this.seekGuard(); });
    v.addEventListener('canplay', () => clearTimeout(this._wdTimer));
    v.addEventListener('timeupdate', () => { this.syncTime(); this.seekGuard(); });
    v.addEventListener('volumechange', () => this.syncVolUI());
    v.addEventListener('error', () => {
      if (this.isOpenFlag && v.error && this.el.error.hidden) {
        const c = v.error.code;                       // 3=decodificación · 4=formato no soportado
        if ((c === 3 || c === 4) && this.tryAltExt()) return;   // ¿era la extensión del archivo?
        this.plError(c === 3 || c === 4 ? 'format' : 'net');
      }
    });
    document.addEventListener('fullscreenchange', () => {
      this.el.full.innerHTML = I(document.fullscreenElement ? 'x' : 'full', 20);
    });
    this.el.root.addEventListener('pointermove', () => this.poke());
    this.setVolume(S.get('volume'));
  },

  /* ---------- Aperturas públicas ---------- */
  openLive(item) {
    if (item.demo) {
      this._open({ kind: 'demo', demoLabel: item.name, title: item.name, sub: 'Canal en vivo · Demo',
        isLive: true, canRecord: true, epgStreamId: String(item.stream_id), channelName: item.name,
        fav: { type: 'live', id: Favs.idOf('live', item), name: item.name } });
    } else {
      const list = Session.live.filter(x => String(x.category_id) === String(item.category_id));
      const idx = Math.max(0, list.findIndex(x => String(x.stream_id) === String(item.stream_id)));
      this._open({ kind: 'live', url: Session.liveUrl(item), title: item.name, sub: 'Canal en vivo',
        isLive: true, canRecord: true, epgStreamId: String(item.stream_id), channelName: item.name,
        liveList: list, liveIdx: idx,
        fav: { type: 'live', id: Favs.idOf('live', item), name: item.name } });
    }
  },
  openMovie(item) {
    if (item.demo) {
      this._open({ kind: 'demo', demoLabel: item.name, title: item.name,
        sub: (item.year ? item.year + ' · ' : '') + 'Película · Demo',
        fav: { type: 'vod', id: Favs.idOf('vod', item), name: item.name } });
    } else {
      const url = Session.vodUrl(item);
      if (!url) { Toast.err('No se pudo construir la URL de esta película.'); return; }
      const ext = item.container_extension || 'mp4';
      this._open({ kind: 'movie', url, title: item.name, sub: 'Película',
        canDownload: true, downloadUrl: url, downloadName: safeName(item.name) + '.' + ext,
        downloadMime: mimeForExt(ext),
        fav: { type: 'vod', id: Favs.idOf('vod', item), name: item.name } });
    }
  },
  openEpisode(seriesItem, season, ep, episodes) {
    const url = Session.client ? Session.client.episodeUrl(ep.id, ep.container_extension || 'mp4') : null;
    if (!url) { Toast.err('La señal demo de series no incluye reproducción.'); return; }
    const ext = ep.container_extension || 'mp4';
    this._open({ kind: 'episode', url, title: seriesItem.name,
      sub: 'T' + season + ' · E' + (ep.episode_num || '?') + (ep.title ? ' — ' + ep.title : ''),
      canDownload: true, downloadUrl: url,
      downloadName: safeName(seriesItem.name) + ' T' + season + 'E' + ep.episode_num + '.' + ext,
      downloadMime: mimeForExt(ext),
      epList: episodes || null,
      epIdx: episodes ? episodes.findIndex(x => String(x.id) === String(ep.id)) : -1,
      seriesItem: seriesItem, season: season,
      fav: { type: 'series', id: Favs.idOf('series', seriesItem), name: seriesItem.name } });
  },
  openLocal(blobUrl, name) {
    this._open({ kind: 'local', url: blobUrl, title: name, sub: 'Reproducción local' });
  },

  /* ---------- Apertura interna ---------- */
  _open(opts) {
    const wasOpen = this.isOpenFlag;          // cambio de canal/episodio sin cerrar
    this._lastOpts = opts;
    this._retryCount = 0;
    this._proxyTried = false;
    this._scrubbing = false;
    this._altExts = null;
    this._seekTarget = 0; this._seekAt = 0;
    this._seekRetries = 0; this._seekWarned = false;
    this._fav = opts.fav || null;
    this.syncFavIcon();
    this._teardownMedia();
    if (!wasOpen) this._prevFocus = Focus.current;
    this.isOpenFlag = true;
    this.isLive = !!opts.isLive;
    this.canDownload = !!opts.canDownload;
    this.canRecord = !!opts.canRecord;
    this.localUrl = opts.kind === 'local' ? opts.url : null;
    // Contexto para cambiar de canal (TV) o de episodio (series) con las teclas
    this._liveCtx = opts.kind === 'live' && opts.liveList && opts.liveList.length
      ? { list: opts.liveList, idx: Math.max(0, opts.liveIdx || 0) }
      : null;
    this._epCtx = opts.kind === 'episode' && opts.epList && opts.epIdx >= 0
      ? { seriesItem: opts.seriesItem, season: opts.season, list: opts.epList, idx: opts.epIdx }
      : null;

    const r = this.el.root;
    r.hidden = false;
    this.el.title.textContent = opts.title || '';
    this.el.sub.textContent = opts.sub || '';
    this.el.epgmini.hidden = true;
    this.el.error.hidden = true;
    this.el.rec.hidden = true;
    this.closeMenu();
    this.closeCats();
    this.el.record.hidden = !opts.canRecord;
    this.el.record.classList.remove('rec-on');
    this.el.download.hidden = !opts.canDownload;
    this.el.quality.hidden = true;
    const stepable = opts.kind === 'live' || opts.kind === 'episode';   // canales y episodios
    this.el.prev.hidden = !stepable;
    this.el.next.hidden = !stepable;
    this.el.hints.textContent = opts.isLive
      ? '↑↓ o W/S canal · C categorías · R grabar · L favorito · Q calidad · M silencio · Espacio pausa · F pantalla · Esc salir'
      : opts.kind === 'episode'
        ? '←→ o A/D 10 s · ↑↓ o W/S episodio · B descarga · L favorito · Q calidad · M silencio · F pantalla · Esc salir'
        : '←→ o A/D 10 s · B descarga · L favorito · Q calidad · M silencio · F pantalla · Esc salir';
    this.el.livebadge.hidden = !opts.isLive;
    this.el.seek.hidden = !!opts.isLive;
    this.syncTime();

    if (!wasOpen) Focus.push(r);
    clearInterval(this._epgTimer);
    if (opts.epgStreamId) this._startEPG(opts.epgStreamId);

    // Vigilante: si en 16 s la señal no entrega datos, avisa en vez de girar para siempre
    this._armWatchdog();
    this.spin(true);
    this._setupSource(opts);
    if (S.get('autoplay')) this.video.play().catch(() => { this.spin(false); this.poke(); });
    this.poke();
    setTimeout(() => Focus.focusFirst(), 40);
  },

  _setupSource(opts) {
    const v = this.video;
    // Contenido mixto: HTTPS no puede cargar streams HTTP (salvo vía proxy público)
    const mixedBlocked = !!opts.url && location.protocol === 'https:' && /^http:/i.test(opts.url) &&
      !Net.isProxied() && !(Net.publicOn() && S.get('corsMode') !== 'off');
    if (mixedBlocked) {
      this.plError('mixed');
      return;
    }
    if (opts.kind === 'demo') {
      this.demoSrc = DemoData.makeStream(opts.demoLabel);
      v.srcObject = this.demoSrc.stream;
      return;
    }
    if (opts.kind === 'local' || !/\.m3u8($|\?)/i.test(opts.url)) {
      v.src = Net.streamFile(opts.url); v.srcObject = null;   // <video> nativo: no sufre CORS
      return;
    }
    // HLS: Hls.js con fallback nativo (Safari/iOS)
    if (window.Hls && Hls.isSupported()) {
      // ¿Todas las peticiones (manifiesto + segmentos) deben salir por un proxy?
      const wantProxy = !!opts.forceProxyLoader || Net.isProxied() ||
        (Net.publicOn() && S.get('corsMode') === 'always');
      const cfg = {
        manifestLoadingTimeOut: 15000,
        manifestLoadingMaxRetry: 2,
        levelLoadingTimeOut: 15000,
        fragLoadingTimeOut: 25000,
        backBufferLength: 45,
      };
      if (wantProxy) {
        const wrapFn = Net.isProxied() ? (u => Net.proxied(u)) : (u => Net.wrapOnce(u));
        const ProxyLoaderClass = Net.hlsProxyLoader(wrapFn);
        if (ProxyLoaderClass) {
          cfg.loader = ProxyLoaderClass;
          cfg.manifestLoadingMaxRetry = 4;
          cfg.fragLoadingMaxRetry = 4;
        }
      }
      const hls = new Hls(cfg);
      this.hls = hls;
      hls.attachMedia(v);
      hls.loadSource(opts.url);          // el loader se ocupa de envolver la URL si hace falta
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        this.spin(false);
        this.buildQualityMenu();
        const pref = S.get('quality');
        if (pref !== 'auto') {
          const idx = hls.levels.findIndex(l => l.height === Number(pref));
          if (idx >= 0) hls.currentLevel = idx;
        }
      });
      hls.on(Hls.Events.LEVEL_SWITCHED, () => this.syncQualityMenu());
      hls.on(Hls.Events.ERROR, (evt, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          if (this._retryCount < 1) { this._retryCount++; hls.startLoad(); }
          else if (!this._proxyTried && !opts.forceProxyLoader && Net.publicOn() && S.get('corsMode') !== 'off') {
            // Último recurso: reenviar TODO el stream (manifiesto + segmentos) por el proxy público
            this._proxyTried = true;
            try { hls.destroy(); } catch (_e) { /* noop */ }
            if (this.hls === hls) this.hls = null;
            this.spin(true);
            this._setupSource(Object.assign({}, opts, { forceProxyLoader: true }));
          }
          else this.plError('net');
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else this.plError('net');
      });
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = Net.streamSrc(opts.url); v.srcObject = null;   // HLS nativo (Safari/WebKit)
    } else {
      this.plError('hls');
    }
  },

  _teardownMedia() {
    clearTimeout(this._wdTimer);
    if (this.hls) { try { this.hls.destroy(); } catch (_e) { /* noop */ } this.hls = null; }
    if (this.demoSrc) { this.demoSrc.stop(); this.demoSrc = null; }
    this.video.pause();
    this.video.removeAttribute('src');
    this.video.srcObject = null;
    try { this.video.load(); } catch (_e) { /* noop */ }
  },

  /** Vigilante de señal: si en 16 s no hay datos, prueba extensión alternativa y si no, avisa. */
  _armWatchdog() {
    clearTimeout(this._wdTimer);
    this._wdTimer = setTimeout(() => {
      if (this.isOpenFlag && this.video.readyState < 3 && this.el.error.hidden) {
        if (this.tryAltExt()) return;
        this.plError('slow');
      }
    }, 16000);
  },

  /** Respaldo de extensión para VOD: muchos paneles anuncian .mp4 pero sirven el archivo
   *  como .mkv/.avi (o al revés) y el navegador no lo decodifica. El servidor Xtream resuelve
   *  por ID, así que basta con cambiar la extensión en la URL y reintentar. */
  tryAltExt() {
    const o = this._lastOpts;
    if (!o || !o.url) return false;
    if (o.kind !== 'movie' && o.kind !== 'episode') return false;
    if (!this._altExts) {
      const cur = ((String(o.url).match(/\.([a-z0-9]{2,5})(?:\?|#|$)/i) || [])[1] || '').toLowerCase();
      this._altExts = ['mkv', 'mp4', 'avi', 'm4v'].filter(x => x !== cur);
    }
    const next = this._altExts.shift();
    if (!next) return false;
    const swap = u => String(u).replace(/\.([a-z0-9]{2,5})((?:\?|#|$))/i, '.' + next + '$2');
    const o2 = Object.assign({}, o, { url: swap(o.url) });
    if (o2.downloadUrl) o2.downloadUrl = swap(o2.downloadUrl);
    this._lastOpts = o2;
    this.spin(true);
    this._setupSource(o2);
    this._armWatchdog();
    return true;
  },

  /* ---------- EPG en el reproductor (ahora + siguiente) ---------- */
  _startEPG(streamId) {
    const box = this.el.epgmini;
    const fill = () => {
      EPG.ensure(streamId, list => {
        if (!this.isOpenFlag || !box.isConnected) return;
        const { now, next } = EPG.now(list);
        if (!now) { box.hidden = true; return; }
        box.hidden = false;
        box.innerHTML =
          '<div class="now"><small>AHORA</small>' + esc(now.title) + ' <span style="color:var(--t-3);font-weight:500">' +
          fmtClock(now.start) + '–' + fmtClock(now.end) + '</span></div>' +
          (next ? '<div class="next">Luego ' + fmtClock(next.start) + ' · ' + esc(next.title) + '</div>' : '') +
          (now.desc ? '<div class="desc">' + esc(now.desc) + '</div>' : '');
      });
    };
    fill();
    this._epgTimer = setInterval(fill, 60000);
  },

  /* ---------- Panel de error con ayuda contextual ---------- */
  plError(kind = 'net') {
    this.spin(false);
    const e = this.el.error;
    const proxyOn = Net.isProxied() || Net.publicOn();
    const proxyName = Net.isProxied() ? 'proxy propio' : 'proxy público';
    const msgs = {
      mixed: ['Contenido mixto bloqueado',
        'La vista previa se sirve por <b>HTTPS</b> y tu servidor IPTV emite por <b>HTTP</b>. Descarga la carpeta y abre <code>index.html</code> con doble clic (desde el archivo local no hay bloqueo), o activa un proxy en <b>Ajustes → Red</b>.'],
      net: ['No se pudo cargar la señal',
        (proxyOn ? 'Tampoco funcionó a través del ' + proxyName + '. Verifica que el servidor IPTV y tu suscripción estén activos y revisa host/puerto. Puedes probar otro proxy en <b>Ajustes → Red → Probar conexión</b>.'
          : 'El navegador bloqueó la señal (CORS) o el servidor está caído. Prueba en <b>Ajustes → Red → Probar conexión</b> (proxy público, sin instalar nada), usa la <b>extensión CORS</b> del Asistente o publica la app en la nube (carpeta <code>publicar</code>).')],
      hls: ['Formato no soportado',
        'Tu navegador no soporta HLS ni de forma nativa ni vía Hls.js (¿sin conexión al CDN?). Prueba con Chrome, Edge o Safari actualizados.'],
      format: ['Este vídeo no se puede reproducir en el navegador',
        'El archivo llegó en un formato o códec que el navegador no decodifica (típico en MKV/AVI con HEVC, DTS o AC3, o en MPEG-TS). No es un fallo de tu red ni de la cuenta: prueba otro contenido, o descárgalo con la tecla <b>D</b> para verlo en un reproductor de escritorio.'],
      slow: ['El servidor tarda demasiado en responder',
        'La señal no entrega datos (se queda cargando). Suele ser saturación del servidor IPTV o un corte puntual. Reintenta, prueba otro contenido, o usa <b>D</b> para descargarlo y verlo con calma.'],
    };
    const [t, m] = msgs[kind] || msgs.net;
    e.innerHTML = '';
    e.append(el('div', { class: 'card-err' },
      el('div', { class: 'ic', html: I('wifi', 24) }),
      el('h3', {}, t),
      el('p', { html: m }),
      el('div', { style: 'display:flex;gap:10px;justify-content:center' },
        el('button', { class: 'btn btn-primary', 'data-focus': '', html: I('refresh', 17) + '<span>Reintentar</span>', onclick: () => { e.hidden = true; this.spin(true); this._setupSource(this._lastOpts); } }),
        el('button', { class: 'btn btn-glass', 'data-focus': '', onclick: () => this.requestClose() }, 'Cerrar'))));
    e.hidden = false;
  },

  /* ---------- Menú de calidad ---------- */
  buildQualityMenu() {
    if (!this.hls || !this.hls.levels || this.hls.levels.length < 2) return;
    this.el.quality.hidden = false;
    this.syncQualityMenu();
  },
  toggleMenu() {
    if (this.menuOpen) { this.closeMenu(); return; }
    if (!this.hls || !this.hls.levels) return;
    const menu = this.el.menu;
    menu.innerHTML = '';
    const levels = this.hls.levels.map((l, i) => ({ i, h: l.height || 0, br: l.bitrate })).sort((a, b) => b.h - a.h);
    const mk = (label, sub, onClick, on) => {
      const b = el('button', { class: 'q-item', 'data-focus': '', html: '<span>' + esc(label) + (sub ? ' <small>' + esc(sub) + '</small>' : '') + '</span>' + (on ? I('check', 17) : '') });
      b.addEventListener('click', () => { onClick(); this.closeMenu(); this.poke(); });
      menu.append(b);
      return on;
    };
    menu.append(el('div', { class: 'menu-head' }, 'Calidad'));
    const autoOn = this.hls.currentLevel === -1 || this.hls.autoLevelEnabled;
    mk('Auto', 'adaptativa', () => { this.hls.currentLevel = -1; S.set('quality', 'auto'); }, autoOn);
    for (const l of levels) {
      mk((l.h ? l.h + 'p' : (Math.round(l.br / 1e6 * 10) / 10 + ' Mbps')),
        (l.br / 1e6).toFixed(1) + ' Mbps',
        () => { this.hls.currentLevel = l.i; S.set('quality', String(l.h || 'auto')); },
        !autoOn && this.hls.currentLevel === l.i);
    }
    menu.hidden = false;
    this.menuOpen = true;
    Focus.push(menu);
    requestAnimationFrame(() => Focus.focusFirst());
  },
  syncQualityMenu() { /* los checks se recalculan al abrir el menú */ },
  closeMenu() {
    const menu = this.el.menu;
    if (!menu.hidden) {
      menu.hidden = true; this.menuOpen = false;
      Focus.pop(menu);
    }
  },

  /* ---------- Controles ---------- */
  togglePlay() {
    if (this.video.paused) this.video.play().catch(() => {});
    else this.video.pause();
    this.poke();
  },
  syncPlayIcon() { this.el.play.innerHTML = I(this.video.paused ? 'play' : 'pause', 22); },
  toggleMute() {
    this.video.muted = !this.video.muted;
    if (!this.video.muted && this.video.volume === 0) this.setVolume(.5);
    this.syncVolUI(); this.poke();
  },
  setVolume(x) {
    x = Math.min(1, Math.max(0, x));
    this.video.volume = x;
    this.video.muted = x === 0;
    S.set('volume', x);
    this.syncVolUI();
  },
  syncVolUI() {
    const eff = this.video.muted ? 0 : this.video.volume;
    this.el.mute.innerHTML = I(eff === 0 ? 'volX' : 'vol', 20);
    this.el.vol.value = Math.round(eff * 100);
    this.el.vol.style.setProperty('--p', Math.round(eff * 100) + '%');
  },
  syncTime() {
    const v = this.video;
    if (this.isLive) {
      this.el.time.textContent = 'Directo';
      return;
    }
    if (this._scrubbing) return;      // el usuario está arrastrando la barra: no pelear con el pulgar
    const d = isFinite(v.duration) ? v.duration : 0;
    const p = d ? (v.currentTime / d) : 0;
    this.el.seek.value = Math.round(p * 1000);
    this.el.seek.style.setProperty('--p', (p * 100) + '%');
    this.el.time.textContent = fmtTime(v.currentTime) + ' / ' + (d ? fmtTime(d) : '—');
  },
  /** Guardián del adelanto: cuando el servidor (o un proxy viejo) ignora el encabezado
   *  Range y contesta 200 con el archivo completo, Chrome reinicia el vídeo y la
   *  posición regresa a 0 («lo manda al principio»). Aquí detectamos ese reinicio:
   *  reintentamos el salto hasta 2 veces y, si sigue pasando, avisamos con la causa
   *  y la solución (subir la versión nueva de functions/api/proxy.js al hosting). */
  seekGuard() {
    const v = this.video;
    if (this.isLive || !isFinite(v.duration)) return;
    const t = Number(this._seekTarget) || 0;
    if (t < 15 || !this._seekAt || (Date.now() - this._seekAt) > 6000) return;
    if (v.seeking || v.currentTime > t - 15) return;      // salto normal: nada que hacer
    this._seekTarget = 0; this._seekAt = 0;               // el recurso se reinició en cero
    if ((this._seekRetries || 0) < 2) {
      this._seekRetries = (this._seekRetries || 0) + 1;
      const back = t;
      setTimeout(() => { try { v.currentTime = back; } catch (_e) { /* noop */ } }, 300);
    } else if (!this._seekWarned) {
      this._seekWarned = true;
      Toast.err('Adelantar falla con este servidor: no responde a rangos. En GitHub, sube también la carpeta functions/api (proxy nuevo) y espera el redespliegue de Cloudflare.');
    }
  },
  goLiveEdge() {
    if (this.hls) {
      const pos = this.hls.liveSyncPosition;
      if (isFinite(pos)) this.video.currentTime = pos;
    } else if (isFinite(this.video.duration)) {
      this.video.currentTime = Math.max(0, this.video.duration - 1);
    }
  },
  toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (this.el.root.requestFullscreen) this.el.root.requestFullscreen().catch(() => Toast.info('Pantalla completa no disponible aquí'));
  },
  togglePip() {
    if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
    else this.video.requestPictureInPicture().catch(() => Toast.info('Picture-in-Picture no disponible'));
  },
  download() {
    const o = this._lastOpts;
    if (!o || !o.downloadUrl) return;
    DL.add({ url: o.downloadUrl, name: o.downloadName || 'video.mp4', mime: o.downloadMime || 'video/mp4', kind: 'vod', accId: Accounts.activeId });
    Toast.info('Cuando termine la ves en la sección «Descargas y Grabaciones».');
  },

  /* ---------- Cambio de canal (TV) y de episodio (series) ---------- */
  step(dir) {
    this.closeMenu();
    this.poke();
    if (this.isLive) this.channelStep(dir);
    else if (this._lastOpts && this._lastOpts.kind === 'episode') this.episodeStep(dir);
  },
  channelStep(dir) {
    const ctx = this._liveCtx;
    if (!ctx || !ctx.list || !ctx.list.length) { Toast.info('El canal de demostración no tiene lista de canales.'); return; }
    if (ctx.list.length < 2) { Toast.info('Solo hay un canal en esta categoría.'); return; }
    if (PVR.active) PVR.stop().catch(() => { /* noop */ });
    const idx = (ctx.idx + dir + ctx.list.length) % ctx.list.length;
    this.playLiveItem(ctx.list[idx], idx);
  },
  playLiveItem(item, idx) {
    const ctx = this._liveCtx;
    this._open({ kind: 'live', url: Session.liveUrl(item), title: item.name, sub: 'Canal en vivo',
      isLive: true, canRecord: true, epgStreamId: String(item.stream_id), channelName: item.name,
      liveList: ctx.list, liveIdx: idx,
      fav: { type: 'live', id: Favs.idOf('live', item), name: item.name } });
    Toast.ok('Canal: ' + (item.name || ''));
  },
  episodeStep(dir) {
    const ctx = this._epCtx;
    if (!ctx || !ctx.list || ctx.list.length < 2) { Toast.info('No hay más episodios en esta temporada.'); return; }
    if (PVR.active) PVR.stop().catch(() => { /* noop */ });
    const idx = (ctx.idx + dir + ctx.list.length) % ctx.list.length;
    const ep = ctx.list[idx];
    this.openEpisode(ctx.seriesItem, ctx.season, ep, ctx.list);
    Toast.ok('Episodio: T' + ctx.season + 'E' + (ep.episode_num || '?'));
  },

  /* ---------- Panel de categorías (TV en vivo, tecla C) ---------- */
  openCats() {
    if (!this._lastOpts || this._lastOpts.kind !== 'live') return;
    if (!Session.ready || !Session.liveCats.length) { Toast.err('No hay categorías cargadas para esta cuenta.'); return; }
    this._catLevel = 1;
    this.el.catpanel.hidden = false;
    this._catOpen = true;
    this.renderCats();
    Focus.push(this.el.catpanel);
    requestAnimationFrame(() => Focus.focusFirst());
    this.poke();
  },
  closeCats() {
    if (!this._catOpen) return;
    this._catOpen = false;
    this.el.catpanel.hidden = true;
    Focus.pop(this.el.catpanel);
    this.poke();
  },
  renderCats() {
    const body = this.el.catbody;
    body.innerHTML = '';
    const cur = this._liveCtx && this._liveCtx.list && this._liveCtx.list[this._liveCtx.idx];
    const curCatId = cur ? String(cur.category_id) : '';
    const curChId = cur ? String(cur.stream_id) : '';
    if (this._catLevel === 1) {
      for (const c of Session.liveCats) {
        const n = Session.live.filter(x => String(x.category_id) === String(c.category_id)).length;
        const b = el('button', { class: 'cat-item' + (String(c.category_id) === curCatId ? ' cur' : ''), 'data-focus': '' },
          el('span', { class: 'live-dot' }), el('span', {}, c.category_name || 'Sin nombre'), el('small', {}, String(n)));
        b.addEventListener('click', () => { this._catLevel = 2; this._catSel = c.category_id; this.renderCats(); requestAnimationFrame(() => Focus.focusFirst()); });
        body.append(b);
      }
    } else {
      const back = el('button', { class: 'cat-item cat-back', 'data-focus': '', html: I('back', 16) + '<span>Todas las categorías</span>' });
      back.addEventListener('click', () => { this._catLevel = 1; this.renderCats(); requestAnimationFrame(() => Focus.focusFirst()); });
      body.append(back);
      const chans = Session.live.filter(x => String(x.category_id) === String(this._catSel));
      for (const ch of chans) {
        const b = el('button', { class: 'cat-item' + (String(ch.stream_id) === curChId ? ' cur' : ''), 'data-focus': '' },
          el('span', { class: 'live-dot' }), el('span', {}, ch.name || 'Canal'));
        b.addEventListener('click', () => {
          const idx = Math.max(0, chans.findIndex(x => String(x.stream_id) === String(ch.stream_id)));
          this.closeCats();
          if (PVR.active) PVR.stop().catch(() => { /* noop */ });
          this._liveCtx = { list: chans, idx };
          this.playLiveItem(ch, idx);
        });
        body.append(b);
      }
    }
  },

  spin(on) { this.el.spin.hidden = !on; },

  /** Muestra controles y reprograma el auto-ocultado tvOS. */
  poke() {
    const r = this.el.root;
    r.classList.remove('hidecursor');
    clearTimeout(this._hideTimer);
    this._hideTimer = setTimeout(() => {
      if (!this.video.paused && !this.menuOpen && !r.contains(document.activeElement))
        r.classList.add('hidecursor');
    }, 3200);
  },

  /* ---------- Cierre ---------- */
  requestClose() {
    if (PVR.active) {
      confirmDialog({
        title: 'Grabación en curso',
        text: 'Si cierras el reproductor se detendrá y se guardará la grabación actual. ¿Continuar?',
        okLabel: 'Detener y guardar', okIcon: 'record',
      }).then(yes => { if (yes) { PVR.stop().catch(() => {}); this.close(); } });
      return;
    }
    this.close();
  },
  close() {
    if (!this.isOpenFlag) return;
    this.isOpenFlag = false;
    clearTimeout(this._wdTimer);
    if (PVR.active) PVR.stop().catch(() => {});
    clearInterval(this._epgTimer);
    clearTimeout(this._hideTimer);
    this._teardownMedia();
    if (this.localUrl) { URL.revokeObjectURL(this.localUrl); this.localUrl = null; }
    this.el.root.hidden = true;
    this.el.root.classList.remove('hidecursor');
    Focus.pop(this.el.root);
    if (this._prevFocus && this._prevFocus.isConnected) Focus.set(this._prevFocus);
    else Focus.focusFirst();
  },

  /* ---------- Teclado del reproductor ---------- */
  keydown(e) {
    const v = this.video;
    // Panel de categorías abierto: navegación propia dentro del panel (flechas o WASD)
    if (this._catOpen) {
      const k = e.key;
      const up = k === 'ArrowUp' || k === 'w' || k === 'W';
      const down = k === 'ArrowDown' || k === 's' || k === 'S';
      const right = k === 'ArrowRight' || k === 'd' || k === 'D';
      const left = k === 'ArrowLeft' || k === 'a' || k === 'A';
      if (up || down) { e.preventDefault(); Focus.move(0, down ? 1 : -1); this.poke(); }
      else if (left || right) { e.preventDefault(); Focus.move(right ? 1 : -1, 0); this.poke(); }
      else if (k === 'Enter' || k === 't' || k === 'T') { e.preventDefault(); if (Focus.current) Focus.current.click(); }   // T = OK del mando
      else if (k === 'Escape' || k === 'c' || k === 'C') { e.preventDefault(); this.closeCats(); }
      return;
    }
    // Movimiento: WASD = igual que las flechas (A/D adelantan 10 s en películas y episodios)
    const isUp = e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W';
    const isDown = e.key === 'ArrowDown' || e.key === 's' || e.key === 'S';
    const isLeft = e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A';
    const isRight = e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D';
    if (isRight) {
      if (!this.isLive && isFinite(v.duration)) {
        const t = Math.min(v.duration, v.currentTime + 10);
        v.currentTime = t; this._seekTarget = t; this._seekAt = Date.now(); this.poke();
      }
      return;
    }
    if (isLeft) {
      if (!this.isLive) {
        const t = Math.max(0, v.currentTime - 10);
        if (t >= 15) { this._seekTarget = t; this._seekAt = Date.now(); }
        v.currentTime = t; this.poke();
      }
      return;
    }
    if (isUp) {
      e.preventDefault();
      if (this.isLive) this.channelStep(1);                       // zapear hacia el canal siguiente…
      else if (this._lastOpts && this._lastOpts.kind === 'episode') this.episodeStep(1);
      else this.setVolume(v.volume + .05);
      this.poke(); return;
    }
    if (isDown) {
      e.preventDefault();
      if (this.isLive) this.channelStep(-1);
      else if (this._lastOpts && this._lastOpts.kind === 'episode') this.episodeStep(-1);
      else this.setVolume(v.volume - .05);
      this.poke(); return;
    }
    switch (e.key) {
      case 'Escape':
        e.preventDefault();
        if (this.menuOpen) this.closeMenu(); else this.requestClose();
        break;
      case ' ': case 'k': case 'K': case 't': case 'T':   // T = OK del mando → play/pausa
        e.preventDefault(); this.togglePlay(); break;
      case '+': case '=': this.setVolume(v.volume + .05); this.poke(); break;
      case '-': case '_': this.setVolume(v.volume - .05); this.poke(); break;
      case 'c': case 'C':
        if (this._lastOpts && this._lastOpts.kind === 'live') this.openCats();
        else if (this.isLive) Toast.info('El canal de demostración no tiene lista de canales.');
        break;
      case 'f': case 'F': this.toggleFull(); break;
      case 'm': case 'M': this.toggleMute(); break;
      case 'r': case 'R': if (this.canRecord) PVR.toggle(this); break;
      case 'b': case 'B': if (this.canDownload) this.download(); break;
      case 'l': case 'L': this.toggleFav(); break;
      case 'q': case 'Q':
        if (!this.el.quality.hidden) this.toggleMenu();
        else Toast.info('Este contenido ofrece una sola calidad: el servidor no envía alternativas.');
        break;
    }
  },

  /* ---------- Favoritos ---------- */
  /** Añade/quita el contenido actual en favoritos (botón ★ o tecla L). */
  toggleFav() {
    if (!this._fav || this._fav.id == null) { Toast.info('Este contenido no se puede añadir a favoritos.'); return; }
    const added = Favs.toggle(this._fav.type, this._fav.id);
    this.syncFavIcon();
    Favs.refreshStars();
    Toast.ok(added ? ('Favorito: ' + (this._fav.name || this.el.title.textContent)) : 'Quitado de favoritos');
  },
  syncFavIcon() {
    if (!this.el.fav) return;
    const ok = !!(this._fav && this._fav.id != null);
    this.el.fav.hidden = !ok;
    if (ok) this.el.fav.classList.toggle('on', Favs.has(this._fav.type, this._fav.id));
  },
};
/* ============================================================
 * DJ-IPTV · DESCARGAS OFFLINE + PVR + AJUSTES + ARRANQUE (Fase 5)
 * Downloader (File System Access / IndexedDB + Range)
 * Grabador PVR (captureStream + MediaRecorder)
 * Vistas Descargas y Ajustes · Teclado global · Bootstrap
 * ============================================================ */

/* ---------- Motor de descargas ---------- */
const DL = {
  items: new Map(),
  MAX: 3,
  PAR: 4,                     // conexiones simultáneas por archivo (modo rápido)
  SLICE: 8 * 1024 * 1024,     // tamaño de trozo para descarga paralela (8 MB)
  _running: 0,
  _queue: [],

  add({ url, name, mime, kind, accId, useFS = true }) {
    if (!url) return null;
    const it = {
      id: uid(), url, name, mime, kind, accId, useFS,
      state: 'queued', received: 0, total: 0, speed: 0,
      created: Date.now(), ctl: new AbortController(),
      handle: null, writer: null, chunks: null,
    };
    this.items.set(it.id, it);
    this._queue.push(it);
    this._pump();
    this._ui();
    Toast.info('Descarga iniciada: ' + name);
    return it.id;
  },

  _pump() {
    while (this._running < this.MAX && this._queue.length) {
      const it = this._queue.shift();
      this._running++;
      this._run(it);
    }
  },

  async _run(it) {
    it.state = 'active';
    this._ui();
    try {
      await this._openSink(it);
      // Sonda Range: ¿el servidor (vía proxy) acepta trozos? → descarga paralela
      let rangeOK = false, total = 0;
      try {
        const pr = await fetch(Net.downloadUrl(it.url), { headers: { Range: 'bytes=0-0' }, signal: it.ctl.signal, cache: 'no-store' });
        if (pr.status === 206) {
          rangeOK = true;
          const m = /\/(\d+)\s*$/.exec(pr.headers.get('content-range') || '');
          total = m ? Number(m[1]) : 0;
        } else {
          total = Number(pr.headers.get('content-length') || 0);
        }
        try { if (pr.body) await pr.body.cancel(); } catch (_e) { /* noop */ }
      } catch (_e) { /* sin sonda: sigue el camino simple */ }
      if (total) it.total = total;
      if (rangeOK && it.writer && total > this.SLICE) await this._runParallel(it, total);
      else await this._runSimple(it);
      await this._finish(it);
    } catch (e) {
      if (e && e.name === 'AbortError') {
        this._persist(it);            // guarda el progreso final mientras sigue «active»
        it.state = 'paused';
        if (it.writer) { try { await it.writer.close(); } catch (_e) { /* noop */ } it.writer = null; }
        Toast.info('Descarga en pausa: ' + it.name);
      } else {
        it.state = 'error';
        it.err = String((e && e.message) || e);
        Toast.err('Error descargando «' + it.name + '»: ' + Net.explain(e));
      }
    } finally {
      this._running--;
      this._ui();
      this._pump();
    }
  },

  /** Camino clásico: un solo flujo secuencial (memoria o disco, con reanudación). */
  async _runSimple(it) {
    const headers = {};
    if (it.received > 0) headers.Range = 'bytes=' + it.received + '-';
    const r = await fetch(Net.downloadUrl(it.url), { headers, signal: it.ctl.signal, cache: 'no-store' });
    if (!r.ok && r.status !== 206) throw new Error('HTTP ' + r.status);
    // El servidor ignora Range → reinicia limpio
    if (it.received > 0 && r.status === 200) {
      it.received = 0;
      if (it.chunks) it.chunks.length = 0;
      if (it.writer) { try { await it.writer.close(); } catch (_e) { /* noop */ } it.writer = await it.handle.createWritable(); }
    }
    if (r.status === 206 && r.headers.get('content-range')) {
      const m = /\/(\d+)\s*$/.exec(r.headers.get('content-range'));
      it.total = m ? Number(m[1]) : 0;
    } else {
      it.total = it.received + Number(r.headers.get('content-length') || 0);
    }
    const reader = r.body.getReader();
    let lastT = performance.now(), lastB = it.received;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (it.writer) await it.writer.write(value);
      else it.chunks.push(value);
      it.received += value.byteLength;
      const now = performance.now();
      if (now - lastT > 800) {
        it.speed = (it.received - lastB) * 1000 / (now - lastT);
        lastT = now; lastB = it.received;
        this._persist(it);
        this._ui();
      }
    }
  },

  /** Modo rápido: N conexiones, cada una con un trozo Range del archivo.
   *  Solo con destino en disco (writer); multiplica la velocidad a través del proxy. */
  async _runParallel(it, total) {
    if (!Array.isArray(it.parts) || !it.parts.length) {
      it.parts = [];
      for (let off = 0; off < total; off += this.SLICE) {
        it.parts.push({ off: off, end: Math.min(off + this.SLICE, total) - 1, done: false, got: 0 });
      }
      it.received = 0;
    } else {
      it.received = it.parts.reduce((s, p) => s + (p.done ? p.end - p.off + 1 : 0), 0);
    }
    const pending = it.parts.filter(p => !p.done);
    if (!pending.length) return;
    const lock = { q: Promise.resolve() };
    const workers = [];
    let next = 0, failed = null;
    const stopAll = () => { for (const w of workers) w.ctl.abort(); };
    it.ctl.signal.addEventListener('abort', stopAll);
    for (let w = 0; w < this.PAR && next < pending.length; w++) {
      const ctl = new AbortController();
      const job = (async () => {
        while (next < pending.length && !failed) {
          const part = pending[next++];
          try {
            part.got = part.got || 0;
            const r = await fetch(Net.downloadUrl(it.url), {
              headers: { Range: 'bytes=' + part.off + '-' + part.end },
              signal: ctl.signal, cache: 'no-store',
            });
            if (r.status !== 206) throw new Error('HTTP ' + r.status);
            const reader = r.body.getReader();
            let cursor = part.off;
            while (true) {
              const rd = await reader.read();
              if (rd.done) break;
              const chunk = rd.value;
              const len = chunk.byteLength;
              lock.q = lock.q.then(async () => {
                await it.writer.seek(cursor);
                await it.writer.write(chunk);
              }).catch(e2 => { failed = failed || e2; throw e2; });
              cursor += len;
              part.got += len;
              it.received += len;
            }
            await lock.q;
            part.done = true;
            part.got = part.end - part.off + 1;
          } catch (e) {
            if (e && e.name === 'AbortError') {
              try { await lock.q; } catch (_e2) { /* noop */ }
              return;                       // pausa intencionada
            }
            failed = failed || e;
            stopAll();
            return;
          }
        }
      })();
      workers.push({ ctl: ctl, p: job });
    }
    let lastT = performance.now(), lastB = it.received;
    const spdT = setInterval(() => {
      const now = performance.now();
      it.speed = Math.max(0, (it.received - lastB) * 1000 / (now - lastT));
      lastT = now; lastB = it.received;
      this._persist(it);
      this._ui();
    }, 800);
    try {
      await Promise.all(workers.map(w => w.p));
    } finally {
      clearInterval(spdT);
      it.ctl.signal.removeEventListener('abort', stopAll);
    }
    if (it.ctl.signal.aborted) { const e = new Error('pausa'); e.name = 'AbortError'; throw e; }
    if (failed) throw failed;
    it.received = total;
  },

  /** Abre el destino: File System Access (disco) o bloques en IndexedDB. */
  async _openSink(it) {
    const canFS = 'showSaveFilePicker' in window;
    if (it.handle) {                                    // reanudación sobre archivo existente
      it.writer = await it.handle.createWritable({ keepExistingData: true });
      await it.writer.seek(it.received);
      return;
    }
    if (canFS && it.useFS) {
      try {
        it.handle = await window.showSaveFilePicker({ suggestedName: safeName(it.name) });
        it.writer = await it.handle.createWritable();
        await DB.put('downloads', {
          id: it.id, name: it.name, kind: it.kind, mime: it.mime, state: 'active',
          received: 0, total: 0, hasHandle: true, handle: it.handle,
          created: it.created, accountId: it.accId, url: it.url,
        });
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') it.useFS = false;  // sin archivo → modo memoria/IDB
      }
    }
    it.chunks = [];
  },

  async _finish(it) {
    if (it.writer) {
      try { await it.writer.close(); } catch (_e) { /* noop */ }
      it.writer = null;
      await DB.put('downloads', {
        id: it.id, name: it.name, kind: it.kind, mime: it.mime, state: 'disk',
        received: it.received, total: it.total, hasHandle: true, handle: it.handle,
        created: it.created, accountId: it.accId, url: it.url,
      });
      Toast.ok('Guardado en disco: ' + it.name);
    } else {
      await DB.put('downloads', {
        id: it.id, name: it.name, kind: it.kind, mime: it.mime, state: 'done',
        chunks: it.chunks, received: it.received, total: it.total,
        created: it.created, accountId: it.accId, url: it.url,
      });
      it.chunks = null;
      Toast.ok('Descarga completada: ' + it.name);
    }
    it.state = 'done';
    emit('dl:records');
  },

  /** Persistencia periódica (permite reanudar tras recargar la pestaña). */
  _persist(it) {
    if (it.state !== 'active') return;
    const base = {
      id: it.id, name: it.name, kind: it.kind, mime: it.mime, state: 'paused',
      received: it.received, total: it.total, created: it.created, accountId: it.accId, url: it.url,
    };
    if (it.writer) {
      base.hasHandle = true;
      base.handle = it.handle;
      if (it.parts) base.parts = it.parts.map(p => ({ off: p.off, end: p.end, done: p.done }));
    }
    else { base.chunks = it.chunks.slice(); }
    DB.put('downloads', base).catch(() => { /* cuota llena */ });
  },

  pause(id) {
    const it = this.items.get(id);
    if (it && (it.state === 'active' || it.state === 'queued')) it.ctl.abort();
  },

  async resume(id) {
    let it = this.items.get(id);
    if (!it) {
      const rec = await DB.get('downloads', id).catch(() => null);
      if (!rec) return;
      it = {
        id, url: rec.url, name: rec.name, mime: rec.mime, kind: rec.kind, accId: rec.accountId,
        useFS: false, state: 'queued', received: rec.received || 0, total: rec.total || 0, speed: 0,
        created: rec.created || Date.now(), ctl: new AbortController(),
        handle: rec.handle || null, writer: null, chunks: rec.chunks || [], parts: rec.parts || null,
      };
      this.items.set(id, it);
    } else if (it.state === 'paused' || it.state === 'error') {
      it.ctl = new AbortController();
    } else return;
    it.state = 'queued';
    this._queue.push(it);
    this._pump();
    this._ui();
  },

  async cancel(id) {
    const it = this.items.get(id);
    if (it) {
      it.ctl.abort();
      this.items.delete(id);
      if (it.handle && it.handle.remove) { try { await it.handle.remove(); } catch (_e) { /* noop */ } }
    }
    await DB.del('downloads', id).catch(() => { /* noop */ });
    emit('dl:records');
    this._ui();
  },

  async deleteDone(id) {
    await DB.del('downloads', id).catch(() => { /* noop */ });
    emit('dl:records');
  },

  /** Exporta a disco un elemento guardado en IndexedDB. */
  async exportItem(id) {
    const rec = await DB.get('downloads', id);
    if (!rec || !rec.chunks) return;
    try {
      const h = await window.showSaveFilePicker({ suggestedName: safeName(rec.name) });
      const w = await h.createWritable();
      for (const c of rec.chunks) await w.write(c);
      await w.close();
      Toast.ok('Exportado: ' + rec.name);
    } catch (e) {
      if (!e || e.name !== 'AbortError') Toast.err('No se pudo exportar: ' + ((e && e.message) || e));
    }
  },

  /** Reproducción offline: Blob en memoria o archivo del disco (con permiso). */
  async playOffline(id) {
    const rec = await DB.get('downloads', id);
    if (!rec) return null;
    if (rec.handle) {
      try {
        let perm = await rec.handle.queryPermission({ mode: 'read' });
        if (perm !== 'granted') perm = await rec.handle.requestPermission({ mode: 'read' });
        if (perm !== 'granted') { Toast.err('Permiso de lectura denegado para el archivo.'); return null; }
        const file = await rec.handle.getFile();
        return { url: URL.createObjectURL(file), name: rec.name };
      } catch (e) {
        Toast.err('No se pudo abrir el archivo: ' + ((e && e.message) || e));
        return null;
      }
    }
    if (rec.chunks && rec.chunks.length) {
      const blob = new Blob(rec.chunks, { type: rec.mime || 'video/mp4' });
      return { url: URL.createObjectURL(blob), name: rec.name };
    }
    Toast.err('Este elemento se guardó directamente en disco; ábrelo desde tu carpeta de descargas.');
    return null;
  },

  /** Marca transferencias interrumpidas por recarga como «en pausa». */
  async init() {
    try {
      const recs = await DB.all('downloads');
      for (const r of recs) if (r.state === 'active') { r.state = 'paused'; await DB.put('downloads', r); }
    } catch (_e) { /* IDB no disponible */ }
  },

  _ui() {
    renderHub();
    if (Router.current === 'downloads') Router.refreshView();
  },
};

/* ---------- Anillo de progreso del hub flotante ---------- */
function ringSVG(p) {
  const C = 2 * Math.PI * 16;
  const off = C * (1 - Math.min(1, Math.max(0, p)));
  return '<svg width="40" height="40" viewBox="0 0 40 40">' +
    '<circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="4"/>' +
    '<circle cx="20" cy="20" r="16" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" ' +
    'stroke-dasharray="' + C + '" stroke-dashoffset="' + off + '"/></svg>';
}

function renderHub() {
  const hub = $('#dl-hub');
  const items = [...DL.items.values()].filter(it => it.state === 'active' || it.state === 'queued');
  if (!items.length) { hub.hidden = true; hub.innerHTML = ''; return; }
  hub.hidden = false;
  hub.innerHTML = '';
  for (const it of items.slice(0, 3)) {
    const p = it.total ? it.received / it.total : 0;
    hub.append(el('div', { class: 'hub-item', onclick: () => Router.show('downloads'), role: 'button', tabindex: '-1', 'data-focus': '' },
      el('div', { class: 'hub-ring', html: ringSVG(p) + '<span class="pct">' + (it.total ? Math.round(p * 100) + '%' : '···') + '</span>' }),
      el('div', { class: 'hub-txt' },
        el('div', { class: 'hub-t' }, it.name),
        el('div', { class: 'hub-s' }, it.state === 'queued' ? 'En cola…'
          : fmtSize(it.speed) + '/s · ' + fmtSize(it.received) + (it.total ? ' / ' + fmtSize(it.total) : '')))));
  }
}

/* ---------- Grabador PVR en vivo (MediaRecorder) ---------- */
const PVR = {
  active: false,
  rec: null,
  startedAt: 0,
  timer: 0,
  chunks: [],
  writer: null,
  handle: null,
  wchain: Promise.resolve(),
  bytes: 0,
  name: '',
  mime: '',

  supported() {
    return typeof MediaRecorder !== 'undefined' &&
      !!(HTMLMediaElement.prototype.captureStream || HTMLMediaElement.prototype.mozCaptureStream);
  },
  pickMime() {
    const cands = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
    for (const c of cands) { try { if (MediaRecorder.isTypeSupported(c)) return c; } catch (_e) { /* noop */ } }
    return '';
  },
  _suggestedName(player) {
    this.mime = this.pickMime();
    const ext = this.mime.includes('mp4') ? '.mp4' : '.webm';
    const base = (player.el.title.textContent || 'grabacion').slice(0, 60);
    const stamp = new Date().toISOString().slice(0, 16).replace('T', '_').replace(/:/g, '-');
    this.name = safeName(base) + '_' + stamp + ext;
    return this.name;
  },

  async toggle(player) { this.active ? await this.stop() : await this.start(player); },

  async start(player) {
    if (this.active) return;
    if (!this.supported()) { Toast.err('Este navegador no soporta MediaRecorder/captureStream.'); return; }
    const v = player.video;
    const stream = (v.captureStream && v.captureStream()) || (v.mozCaptureStream && v.mozCaptureStream());
    if (!stream || (!stream.getVideoTracks().length && !stream.getAudioTracks().length)) {
      Toast.err('No se puede capturar la señal: deja que el vídeo se esté reproduciendo unos segundos e inténtalo de nuevo.');
      return;
    }
    const name = this._suggestedName(player);
    if (!this.mime) { Toast.err('Ningún códec de grabación disponible en este navegador.'); return; }

    // Destino preferente: escritura progresiva a disco (File System Access)
    let writer = null, handle = null;
    if ('showSaveFilePicker' in window) {
      try {
        handle = await window.showSaveFilePicker({ suggestedName: name });
        writer = await handle.createWritable();
      } catch (e) {
        if (e && e.name === 'AbortError') Toast.info('Sin archivo de destino: la grabación irá a la memoria y se guardará al detener.');
        writer = null; // sin acceso a disco → memoria
      }
    }

    try {
      this.rec = new MediaRecorder(stream, { mimeType: this.mime, videoBitsPerSecond: 6_000_000 });
    } catch (err) {
      Toast.err('No se pudo iniciar la grabación: ' + (err && err.message || err));
      return;
    }
    this.chunks = [];
    this.bytes = 0;
    this.writer = writer;
    this.handle = handle;
    this.wchain = Promise.resolve();
    this.rec.ondataavailable = e => {
      if (!e.data || !e.data.size) return;
      this.bytes += e.data.size;
      if (this.writer) {
        this.wchain = this.wchain.then(() => this.writer && this.writer.write(e.data)).catch(() => { /* noop */ });
      } else {
        this.chunks.push(e.data);   // bloques en memoria (fallback Safari/Firefox)
      }
    };
    this.rec.start(1000);           // fragmentos cada segundo
    this.startedAt = Date.now();
    this.active = true;
    player.el.rec.hidden = false;
    player.el.record.classList.add('rec-on');
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      Player.el.recTime.textContent = fmtTime((Date.now() - this.startedAt) / 1000);
    }, 500);
    Toast.ok('Grabando «' + player.el.title.textContent + '»' + (writer ? ' → disco' : ' → memoria'));
  },

  async stop() {
    if (!this.active || !this.rec) return null;
    const rec = this.rec;
    const stopped = new Promise(res => { rec.onstop = res; });
    try { rec.stop(); } catch (_e) { /* noop */ }
    await stopped;
    clearInterval(this.timer);
    this.active = false;
    Player.el.rec.hidden = true;
    Player.el.record.classList.remove('rec-on');
    try { await this.wchain; } catch (_e) { /* noop */ }

    let record;
    if (this.writer) {
      try { await this.writer.close(); } catch (_e) { /* noop */ }
      record = {
        id: uid(), name: this.name, kind: 'recording', mime: this.mime, state: 'disk',
        received: this.bytes, size: this.bytes, hasHandle: true, handle: this.handle,
        created: Date.now(), accountId: Accounts.activeId,
      };
    } else {
      record = {
        id: uid(), name: this.name, kind: 'recording', mime: this.mime, state: 'done',
        chunks: this.chunks, received: this.bytes, size: this.bytes,
        created: Date.now(), accountId: Accounts.activeId,
      };
    }
    await DB.put('downloads', record).catch(() => { /* noop */ });
    this.rec = null; this.writer = null; this.handle = null; this.chunks = [];
    if (!this.bytes) {
      Toast.err('La grabación quedó vacía: la señal se reproduce en directo (sin proxy) y el navegador la bloquea para capturar. Activa el proxy propio en Ajustes → Red y repite.', 6500);
    } else {
      Toast.ok('Grabación guardada en Descargas y Grabaciones');
    }
    emit('dl:records');
    return record;
  },
};

/* ---------- Vista: Descargas y Grabaciones ---------- */
let dlRecs = null;
async function ensureDlRecs() { dlRecs = await DB.all('downloads').catch(() => []); }
on('dl:records', async () => { await ensureDlRecs(); if (Router.current === 'downloads') Router.refreshView(); });

function renderDownloadsView() {
  const v = $('#view-downloads');
  v.innerHTML = '';
  const sub = el('span', { class: 'view-sub' }, '');
  v.append(el('div', { class: 'view-head' },
    el('h2', { class: 'view-title' }, el('span', { class: 'dot' }), 'Descargas y Grabaciones'),
    el('div', { style: 'display:flex;align-items:center;gap:12px' }, sub)));
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(e => {
      sub.textContent = fmtSize(e.usage || 0) + ' usados de ' + fmtSize(e.quota || 0) + ' disponibles';
    }).catch(() => {});
  }

  if (dlRecs == null) {
    v.append(buildLoadingPanel('Cargando biblioteca…'));
    ensureDlRecs().then(() => { if (Router.current === 'downloads') Router.refreshView(); });
    return;
  }

  const inProgress = [...DL.items.values()].filter(it => it.state !== 'done');
  if (inProgress.length) {
    const sec = el('div', { class: 'dl-sec' }, el('div', { class: 'section-title', html: I('download', 19) + '<span>Transferencias</span>' }));
    for (const it of inProgress) {
      const p = it.total ? Math.min(1, it.received / it.total) : 0;
      const acts = el('div', { class: 'dl-actions' });
      if (it.state === 'paused' || it.state === 'error') {
        acts.append(el('button', { class: 'mini-btn accent', html: I('play', 16), 'data-focus': '', 'aria-label': 'Reanudar', onclick: () => DL.resume(it.id) }));
      } else if (it.state === 'active') {
        acts.append(el('button', { class: 'mini-btn', html: I('pause', 16), 'data-focus': '', 'aria-label': 'Pausar', onclick: () => DL.pause(it.id) }));
      }
      acts.append(el('button', { class: 'mini-btn', html: I('x', 16), 'data-focus': '', 'aria-label': 'Cancelar', onclick: () => DL.cancel(it.id) }));
      sec.append(el('div', { class: 'dl-item' },
        el('div', { class: 'dl-ic', html: I('download', 20) }),
        el('div', { class: 'dl-mid' },
          el('div', { class: 'dl-name' }, it.name),
          el('div', { class: 'dl-sub' },
            el('span', { class: 'tag ' + (it.state === 'active' ? 'load' : 'ok') }, it.state === 'active' ? 'DESCARGANDO' : it.state === 'queued' ? 'EN COLA' : it.state === 'paused' ? 'EN PAUSA' : 'ERROR'),
            el('span', {}, fmtSize(it.received) + (it.total ? ' / ' + fmtSize(it.total) : '')),
            it.state === 'active' ? el('span', {}, fmtSize(it.speed) + '/s') : null),
          el('div', { class: 'dl-bar' }, el('i', { style: 'width:' + Math.round(p * 100) + '%' }))),
        acts));
    }
    v.append(sec);
  }

  const pausedRecs = dlRecs.filter(r => r.state === 'paused');
  if (pausedRecs.length) {
    const sec = el('div', { class: 'dl-sec' }, el('div', { class: 'section-title', html: I('clock', 19) + '<span>Pausadas (reanudables)</span>' }));
    for (const r of pausedRecs) sec.append(dlRecordRow(r, true));
    v.append(sec);
  }

  const done = dlRecs.filter(r => r.state === 'done' || r.state === 'disk').sort((a, b) => b.created - a.created);
  const secDone = el('div', { class: 'dl-sec' }, el('div', { class: 'section-title', html: I('grid', 19) + '<span>Biblioteca local</span>' }));
  if (done.length) for (const r of done) secDone.append(dlRecordRow(r, false));
  else if (!inProgress.length && !pausedRecs.length) {
    v.append(el('div', { class: 'empty' },
      el('div', { class: 'big' }, 'Aún no hay descargas ni grabaciones'),
      el('p', {}, 'Descarga películas y episodios con el botón de descarga, o graba un canal en vivo desde el reproductor (botón ● o tecla R). Todo queda guardado en este navegador, por cuenta.'),
      el('button', { class: 'btn btn-glass', 'data-focus': '', onclick: () => Router.show('movies') }, 'Explorar películas')));
  }
  v.append(secDone);
}

function dlRecordRow(r, pausedMode) {
  const isRec = r.kind === 'recording';
  const acts = el('div', { class: 'dl-actions' });
  if (pausedMode) {
    acts.append(el('button', { class: 'mini-btn accent', html: I('play', 16), 'data-focus': '', 'aria-label': 'Reanudar', onclick: () => DL.resume(r.id) }));
  } else {
    acts.append(el('button', {
      class: 'mini-btn accent', html: I('play', 16), 'data-focus': '', 'aria-label': 'Reproducir offline',
      onclick: async () => {
        const res = await DL.playOffline(r.id);
        if (res) Player.openLocal(res.url, res.name);
      },
    }));
    if (r.state === 'done' && r.chunks) acts.append(el('button', { class: 'mini-btn', html: I('save', 16), 'data-focus': '', 'aria-label': 'Guardar en disco', title: 'Guardar en disco', onclick: () => DL.exportItem(r.id) }));
  }
  acts.append(el('button', {
    class: 'mini-btn', html: I('trash', 16), 'data-focus': '', 'aria-label': 'Eliminar',
    onclick: async () => {
      const yes = await confirmDialog({ title: '¿Eliminar «' + r.name + '»?', text: pausedMode ? 'Se descartará la parte descargada.' : 'Esta acción no se puede deshacer.' });
      if (yes) (pausedMode ? DL.cancel(r.id) : DL.deleteDone(r.id));
    },
  }));
  const tags = [];
  if (isRec) tags.push('<span class="tag rec">GRABACIÓN</span>');
  if (pausedMode) tags.push('<span class="tag load">PARCIAL</span>');
  else if (r.state === 'disk') tags.push('<span class="tag disk">EN DISCO</span>');
  else tags.push('<span class="tag ok">OFFLINE</span>');
  return el('div', { class: 'dl-item' },
    el('div', { class: 'dl-ic' + (isRec ? ' rec' : ''), html: I(isRec ? 'record' : 'download', 20) }),
    el('div', { class: 'dl-mid' },
      el('div', { class: 'dl-name' }, r.name),
      el('div', { class: 'dl-sub' },
        el('span', { html: tags.join(' ') }),
        el('span', {}, fmtSize(r.size || r.received || 0)),
        el('span', {}, fmtDate(r.created)),
        r.accountId && !Session.isDemo && r.accountId !== Accounts.activeId ? el('span', {}, 'otra cuenta') : null)),
    acts);
}

function renderSettingsView() {
  const v = $('#view-settings');

  const g = el('div', { class: 'set-grid' });

  /* --- Cuentas --- */
  const accCard = el('div', { class: 'set-card' },
    el('h3', { html: I('user', 18) + '<span>Cuentas Xtream</span>' }),
    el('div', { class: 'sub' }, 'Perfiles almacenados con contraseña cifrada (AES-GCM). Cambia de cuenta sin recargar la app.'));
  if (!Accounts.list.length) accCard.append(el('div', { class: 'sub' }, 'Todavía no hay cuentas. Añade tu proveedor para empezar.'));
  for (const a of Accounts.list) {
    const isActive = Accounts.activeId === a.id && !Session.isDemo;
    const row = el('div', { class: 'acc-row' },
      el('span', { class: 'avatar', style: 'background:hsl(' + (a.hue || 210) + ',60%,40%);width:34px;height:34px;font-size:13px' }, esc((a.alias[0] || 'U').toUpperCase())),
      el('div', { class: 'inf' },
        el('b', {}, a.alias, isActive ? el('span', { class: 'tag ok' }, 'ACTIVA') : null),
        el('small', {}, a.host + (a.port ? ':' + a.port : '') + ' · ' + a.username + (a.expDate ? ' · expira ' + fmtDate(Number(a.expDate) * 1000) : ''))),
      el('span', { class: 'state-dot ' + (a.status === 'Expired' ? 'err' : isActive ? 'ok' : 'idle'), title: a.status || '' }),
      el('button', { class: 'mini-btn', html: I('refresh', 15), 'data-focus': '', 'aria-label': 'Usar esta cuenta', title: 'Usar', onclick: () => Session.load(a.id) }),
      el('button', { class: 'mini-btn', html: I('edit', 15), 'data-focus': '', 'aria-label': 'Editar', onclick: () => openAccountModal(a) }),
      el('button', {
        class: 'mini-btn', html: I('trash', 15), 'data-focus': '', 'aria-label': 'Eliminar',

          const yes = await confirmDialog({ title: '¿Eliminar «' + a.alias + '»?', text: 'Se borrarán también su caché de catálogos. Las descargas se conservan.' });

  accCard.append(el('div', { class: 'form-actions', style: 'justify-content:flex-start;margin-top:14px' },
    el('button', { class: 'btn btn-primary btn-sm', 'data-focus': '', html: I('plus', 16) + '<span>Añadir cuenta</span>', onclick: () => openAccountModal(null) }),
    el('button', { class: 'btn btn-glass btn-sm', 'data-focus': '', html: I('bolt', 16) + '<span>Modo Demo</span>', onclick: () => Session.load('demo') })));
  g.append(accCard);

  /* --- Reproducción --- */
  const selQ = el('select', { 'data-focus': '' },
    el('option', { value: 'auto' }, 'Auto (adaptativa)'),

  selQ.value = S.get('quality');
  selQ.addEventListener('change', () => S.set('quality', selQ.value));
  g.append(el('div', { class: 'set-card' },
    el('h3', { html: I('play', 18) + '<span>Reproducción</span>' }),
    el('div', { class: 'sub' }, 'Preferencias del reproductor HLS.'),
    setRow('Reproducción automática', 'Comenzar a reproducir al abrir cualquier contenido.', switchEl(() => S.get('autoplay'), x => S.set('autoplay', x))),
    setRow('Calidad preferida', 'Se aplica al iniciar streams HLS con varias calidades disponibles.', selQ)));

  /* --- Apariencia --- */
  const sw = el('div', { class: 'swatches' });
  for (const a of ACCENTS) {
    const b = el('button', {

      onclick: () => { S.set('accent', a.v); S.apply(); $$('.swatch', sw).forEach(x => x.classList.remove('on')); b.classList.add('on'); },

  g.append(el('div', { class: 'set-card' },
    el('h3', { html: I('moon', 18) + '<span>Apariencia</span>' }),
    el('div', { class: 'sub' }, 'Dark mode tvOS con acento personalizable.'),
    setRow('Color de acento', 'Botones, foco y progreso.', sw),

  /* --- Red y CORS --- */
  const selMode = el('select', { 'data-focus': '' },
    el('option', { value: 'auto' }, 'Automático: directo y, si lo bloquea, proxy público (recomendado)'),

  const curTpl = S.get('corsTpl') || '';

  selProxy.value = curTpl ? (tplKnown ? curTpl : 'custom') : '';
  const customIn = el('input', {
    type: 'text', placeholder: 'https://mi-proxy.example/?url={enc}',
    value: (curTpl && !tplKnown) ? curTpl : '',

    const val = customIn.value.trim();

  const netLog = el('div', { class: 'code', style: 'display:none;max-height:150px;overflow:auto' });

      const okAny = await Net.testChain(w);
      btnTest.disabled = false;
      if (okAny) Toast.ok('Hay conexión disponible');
      else Toast.info('Ninguna ruta funcionó ahora mismo; reintenta más tarde');
    },
