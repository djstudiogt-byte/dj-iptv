  const proxyIn = el('input', { type: 'text', placeholder: 'http://localhost:8080', value: S.get('proxyBase') || '', style: 'max-width:280px' });
  const proxySave = el('button', { class: 'btn btn-glass btn-sm', 'data-focus': '', onclick: () => { S.set('proxyBase', proxyIn.value.trim()); Toast.ok('Proxy actualizado'); } }, 'Guardar');
  const NET_CODE =
    '<span class="c"># OPCIÓN A · Windows (sin instalar nada)</span>\n' +
    'Doble clic en «Iniciar DJ-IPTV (Windows).bat» · misma carpeta que index.html\n' +
    '<span class="c"># Se abre http://localhost:8080 con la app ya conectada al proxy.</span>\n\n' +
    '<span class="c"># OPCIÓN B · macOS / Linux (Python 3 preinstalado)</span>\n' +
    'python3 proxy-cors.py\n\n' +
    '<span class="c"># Sin instalar nada tampoco: Ajustes → Red → proxy público</span>';
  g.append(el('div', { class: 'set-card' },
    el('h3', { html: I('wifi', 18) + '<span>Red · Conexión anti-CORS</span>' }),
    el('div', { class: 'sub' }, 'Doble clic en index.html funciona solo: si el navegador bloquea la conexión (CORS), la app reconecta automáticamente por un proxy público. Nada que instalar (válido en ChromeOS Flex, Windows, Mac, Linux…).'),
    setRow('Modo de conexión', 'Automático = prueba en directo y, si el navegador lo bloquea, repite por proxy público.', selMode),
    setRow('Proxy público', 'Servicio externo que reenvía las peticiones a tu servidor IPTV. «Personalizado» acepta plantillas con {enc} (URL codificada) o {raw} (URL tal cual).', el('div', {}, selProxy, customIn)),
    setRow('Probar conexión', 'Comprueba la conexión directa y cada proxy público; guarda el primero que funcione.', el('div', { style: 'display:flex;gap:8px;align-items:center' }, btnTest)),
    setRow('URL del micro-proxy (avanzado)', 'Proxy propio: las llamadas se envían a {proxy}/proxy?url=… (hosting con proxy integrado o servidor local).', el('div', { style: 'display:flex;gap:8px;align-items:center' }, proxyIn, proxySave)),
    netLog,
    el('div', { class: 'code', html: NET_CODE }),
    el('p', { class: 'hint', style: 'font-size:11px;margin-top:10px' }, 'Privacidad: con un proxy público, las peticiones —incluidos usuario y clave del IPTV en la URL— pasan por un servicio de terceros. Alternativas más privadas: extensión CORS o publicar la app en la nube con proxy propio (carpeta publicar).'),
    el('div', { class: 'form-actions', style: 'justify-content:flex-start;flex-wrap:wrap' },
      el('button', { class: 'btn btn-primary btn-sm', 'data-focus': '', html: I('wifi', 16) + '<span>Asistente de conexión…</span>', onclick: () => openNetWizard(null) }),
      el('button', { class: 'btn btn-glass btn-sm', 'data-focus': '', html: I('copy', 16) + '<span>Copiar instrucciones</span>', onclick: () => copyText(NET_CODE.replace(/<[^>]+>/g, '')) }))));

  /* --- Almacenamiento --- */
  const btnClear = el('button', {
    class: 'btn btn-danger btn-sm', 'data-focus': '',
    onclick: async () => {
      const yes = await confirmDialog({ title: '¿Vaciar caché de catálogos?', text: 'Se volverán a descargar las listas la próxima vez que entres en cada cuenta.' });
      if (yes) { await CatCache.clearAll(); Toast.ok('Caché vaciada'); }
    },
  }, 'Vaciar caché');
  g.append(el('div', { class: 'set-card' },
    el('h3', { html: I('save', 18) + '<span>Almacenamiento</span>' }),
    el('div', { class: 'sub' }, 'Catálogos en caché y descargas offline guardadas en IndexedDB.'),
    setRow('Caché de catálogos', 'Listas de canales, películas y series por cuenta (TTL 6 h).', btnClear)));

  /* --- Atajos --- */
  g.append(el('div', { class: 'set-card' },
    el('h3', { html: I('grid', 18) + '<span>Atajos de teclado</span>' }),
    el('div', { class: 'sub' }, 'Navegación completa sin ratón, estilo mando Apple TV.'),
    setRow('Flechas / WASD', 'Mover el foco entre tarjetas, chips y menús (igual que el mando de la tele).', el('span', { class: 'tag disk' }, 'MOVER')),
    setRow('T  ·  Enter', 'Abrir o seleccionar lo enfocado (T = OK del mando). Esc vuelve atrás.', el('span', { class: 'tag disk' }, 'OK')),
    setRow('Ctrl + K  ·  /', 'Abrir el buscador global.', el('span', { class: 'tag disk' }, 'BUSCAR')),
    setRow('Espacio · F · M · +/−', 'Play/Pausa · Pantalla completa · Silencio · Volumen (reproductor).', el('span', { class: 'tag disk' }, 'PLAYER')),
    setRow('L', 'Añadir o quitar de FAVORITOS: estrella de la tarjeta enfocada o contenido en reproducción.', el('span', { class: 'tag disk' }, 'FAV')),
    setRow('↑ · ↓', 'TV en vivo: canal siguiente/anterior. Series: episodio siguiente/anterior (también W/S).', el('span', { class: 'tag disk' }, 'ZAP')),
    setRow('C', 'Categorías de TV en un panel a la izquierda (dentro del reproductor).', el('span', { class: 'tag disk' }, 'TV')),
    setRow('R · B · Q', 'Grabar · Descargar · Calidad (reproductor). A/D adelanta o retrocede 10 s.', el('span', { class: 'tag rec' }, 'PVR'))));

  v.append(g);
}

/* ---------- Teclado global ---------- */
function globalKeys(e) {
  // 1 · Reproductor abierto: control total
  if (Player.isOpen()) { Player.keydown(e); return; }

  // 2 · Buscador flotante (T solo selecciona si no estás escribiendo; Enter siempre acepta)
  if (SearchOverlay.isOpen()) {
    const stg = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
    const typingS = stg === 'input' || stg === 'textarea';
    if (e.key === 'Escape') { e.preventDefault(); SearchOverlay.close(); }
    else if (e.key === 'Enter' || (!typingS && (e.key === 't' || e.key === 'T'))) { e.preventDefault(); SearchOverlay.openFirst(); }
    return;
  }

  // 3 · Escape jerárquico: menú → modal → vista inicial
  if (e.key === 'Escape') {
    if (Menus.anyOpen()) { Menus.closeAll(); e.preventDefault(); return; }
    if (Modal.count()) { Modal.top().close(); e.preventDefault(); return; }
    if (Router.current && Router.current !== 'dashboard') { Router.show('dashboard'); e.preventDefault(); }
    return;
  }

  // 4 · Atajo de búsqueda (Ctrl/Cmd+K o "/")
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); SearchOverlay.open(); return;
  }

  const t = e.target;
  const tag = (t.tagName || '').toLowerCase();
  const typing = (tag === 'input' && ['text', 'password', 'search', 'number', 'email'].includes(t.type)) || tag === 'textarea' || tag === 'select';
  if (typing) return;

  // 5 · Focus engine (D-Pad espacial · también WASD)
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1],
    a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1], A: [-1, 0], D: [1, 0], W: [0, -1], S: [0, 1] };
  if (dirs[e.key]) { e.preventDefault(); Focus.move(dirs[e.key][0], dirs[e.key][1]); }
  else if ((e.key === 'Enter' || e.key === 't' || e.key === 'T') && Focus.current) { e.preventDefault(); Focus.current.click(); }   // T = OK del mando
  else if (e.key === 'l' || e.key === 'L') {          // favorito de la tarjeta enfocada (si tiene estrella)
    const b = Focus.current && Focus.current.querySelector ? Focus.current.querySelector('.fav-btn') : null;
    if (b) { e.preventDefault(); b.click(); }
  }
  else if (e.key === '/' && !Modal.count()) { e.preventDefault(); SearchOverlay.open(); }
}

/* ---------- Arranque de la aplicación ----------
 * Cada paso está aislado: un fallo (p. ej. sin IndexedDB o sin WebCrypto)
 * nunca debe dejar la interfaz en blanco. */
(async function boot() {
  try {
    S.load();
    S.apply();
    try { await DB.open(); }
    catch (_e) { Toast.err('Almacenamiento limitado en este navegador: las cuentas no se recordarán al cerrar.', 6000); }

    // Cero configuración: si esta página está alojada con un proxy integrado
    // (Cloudflare Pages / preview / servidor local), lo detecta solo.
    try { if (await Net.autoDetectProxy()) console.log('DJ-IPTV · proxy integrado detectado:', S.get('proxyBase') + S.get('proxyRoute')); }
    catch (_e) { /* conexión directa */ }

    Topbar.init();
    SearchOverlay.init();
    Player.init();
    Router.RENDER['dashboard'] = renderDashboard;
    Router.RENDER['downloads'] = renderDownloadsView;
    Router.RENDER['settings'] = renderSettingsView;

    document.addEventListener('keydown', globalKeys);

    // Sincroniza el foco tvOS al mover el ratón
    document.addEventListener('pointerover', e => {
      if (Player.isOpen() || Modal.count() || Menus.anyOpen() || SearchOverlay.isOpen()) return;
      const t = e.target.closest && e.target.closest('[data-focus]');
      if (t && t !== Focus.current && (t.closest('#main') || t.closest('.topbar'))) Focus.set(t);
    });

    try { await DL.init(); }
    catch (_e) { /* sin persistencia de descargas; la app sigue */ }

    try { await Accounts.refresh(); }
    catch (e) { Toast.err('No se pudieron leer las cuentas guardadas: ' + (e && e.message || e)); }
  } catch (e) {
    if (window.__djFault) window.__djFault('Arranque', e);
  }

  // La interfaz debe existir SIEMPRE, haya fallado algo antes o no
  try { Router.show('dashboard'); }
  catch (e) { if (window.__djFault) window.__djFault('Panel de inicio', e); }

  try {
    const last = S.get('lastAccount');
    if (last === 'demo') Session.load('demo');
    else if (last && Accounts.get(last)) Session.load(last);
    else if (Accounts.list.length === 1) Session.load(Accounts.list[0].id);
  } catch (_e) { /* la sesión manual siempre está disponible */ }

  // Protege transferencias y grabaciones activas al cerrar la pestaña
  window.addEventListener('beforeunload', e => {
    if (PVR.active || DL._running > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  window.__DJ_READY__ = true;   // desactiva el aviso de compatibilidad
  const style = 'color:#0A84FF;font-weight:bold;font-size:14px';
  console.log('%c DJ-IPTV v1.4 ', style + ';background:#0f172a;border-radius:4px', '· cliente 100% web · Hls.js:' + (window.Hls ? 'ok' : 'CDN pendiente') + ' · IDB:' + (DB._db ? 'ok' : DB._ls ? 'respaldo' : 'no'));
})();
</script>
