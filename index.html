/* ============================================================
 * DJ-IPTV · MULTIPANTALLA (v1.9): 2, 3 o 4 señales en vivo a la vez
 * Toca una pantallita → buscador → el canal se carga en la elegida.
 * La pantalla seleccionada se ESCUCHA; el resto queda muteado.
 * Se guarda por cuenta: 'dj:multi:<cuenta>' → {n, a, c:[canales]}.
 * ============================================================ */
const Multi = {
  N: 2,
  active: 0,
  slots: [],            // {item,url,video,hls,demo,err,el}
  isOpenFlag: false,
  _prevFocus: null,
  _tipTimer: 0,

  isOpen() { return this.isOpenFlag; },
  _key() {
    const acc = Session.isDemo ? 'demo' : (Accounts.activeId || 'ninguna');
    return 'dj:multi:' + acc;
  },

  init() {
    this.el = { root: $('#multi-root'), grid: $('#multi-grid'), back: $('#multi-back'), hint: $('#multi-hint') };
    $('#multi-title').innerHTML = I('grid', 18) + '<span>MultiPantalla</span>';
    this.el.back.innerHTML = I('back', 20);
    this.el.back.addEventListener('click', () => this.close());
    $$('#multi-count .chip').forEach(c => c.addEventListener('click', () => this.setCount(Number(c.dataset.n))));
    this.syncChips();
  },

  syncChips() {
    $$('#multi-count .chip').forEach(c => c.classList.toggle('active', Number(c.dataset.n) === this.N));
  },

  open() {
    if (this.isOpenFlag) return;
    while (Modal.count()) Modal.top().close();          // ningún modal por debajo
    if (Player.isOpen()) Player.requestClose();         // el reproductor no sigue sonando
    this.isOpenFlag = true;
    this._prevFocus = Focus.current;
    this.el.root.hidden = false;
    Focus.push(this.el.root);
    // Diseño y canales guardados de la última vez (por cuenta)
    let st = {};
    try { st = JSON.parse(localStorage.getItem(this._key()) || '{}') || {}; } catch (_e) { /* privado */ }
    this.N = [2, 3, 4].indexOf(Number(st.n)) >= 0 ? Number(st.n) : 2;
    this.active = Math.max(0, Math.min(this.N - 1, Number(st.a) || 0));
    this.buildGrid();
    this.syncChips();
    const chans = Array.isArray(st.c) ? st.c : [];
    let any = false;
    for (let i = 0; i < this.N; i++) if (chans[i]) any = this._restoreSlot(i, chans[i]) || any;
    this.applyAudio();
    this.showTip(any ? 'Toca una pantalla para escucharla · el botón 🔍 cambia el canal'
                     : 'Toca una pantallita y elige un canal: ahí se escuchará, el resto queda muteado');
    requestAnimationFrame(() => Focus.focusFirst());
  },

  close() {
    if (!this.isOpenFlag) return;
    this.isOpenFlag = false;
    this.save();
    for (const s of this.slots) this._teardownSlot(s);
    this.el.root.hidden = true;
    Focus.pop(this.el.root);
    if (this._prevFocus && this._prevFocus.isConnected) Focus.set(this._prevFocus);
    else Focus.focusFirst();
  },

  setCount(n) {
    if ([2, 3, 4].indexOf(n) < 0 || n === this.N) return;
    const old = this.slots;
    this.N = n;
    this.buildGrid();
    for (let i = 0; i < n; i++) {
      const o = old[i], d = this.slots[i];
      if (!o || !o.item) continue;
      d.item = o.item; d.url = o.url; d.hls = o.hls; d.demo = o.demo; d.err = o.err;
      this._reattach(d);                                // conserva el stream al cambiar el diseño
    }
    if (this.active >= n) this.active = 0;
    this.applyAudio();
    this.syncChips();
    this.save();
    requestAnimationFrame(() => Focus.focusFirst());
  },

  buildGrid() {
    const g = this.el.grid;
    g.innerHTML = '';
    g.dataset.n = String(this.N);
    this.slots = [];
    for (let i = 0; i < this.N; i++) {
      const slot = { item: null, url: '', video: null, hls: null, demo: null, err: '', el: null };
      const d = el('div', { class: 'multi-slot empty', 'data-focus': '', role: 'button',
        'data-slot': String(i), 'aria-label': 'Pantalla ' + (i + 1) + ': elegir canal' });
      d.innerHTML =
        '<video class="ms-video" playsinline muted></video>' +
        '<div class="ms-empty"><div class="big-ic">' + I('plus', 26) + '</div>' +
        '<div><b>Pantalla ' + (i + 1) + '</b>Toca para elegir canal</div></div>' +
        '<div class="ms-info" hidden><i class="live-dot"></i><span class="nm"></span></div>' +
        '<div class="ms-audio" hidden></div>' +
        '<button class="ms-pick icon-btn" data-focus aria-label="Buscar canal para la pantalla ' + (i + 1) + '" title="Cambiar canal">' + I('search', 16) + '</button>';
      slot.el = d;
      slot.video = $('.ms-video', d);
      d.addEventListener('click', e => {
        if (e.target.closest('.ms-pick')) return;       // el botón de buscar tiene su propio clic
        if (!slot.item) this.assign(i);
        else { this.active = i; this.applyAudio(); this.save(); }
      });
      $('.ms-pick', d).addEventListener('click', () => this.assign(i));
      g.append(d);
      this.slots.push(slot);
    }
  },

  /** Abre el buscador de canales para una pantallita. */
  assign(i) {
    if (!Session.ready || !Session.live.length) { Toast.info('Carga primero tu cuenta o usa el Modo Demo.'); return; }
    openMultiPicker(i);
  },

  /** Pone un canal en la pantallita elegida y la deja como activa (con audio). */
  setChannel(i, item) {
    const s = this.slots[i];
    if (!s) return;
    this._teardownSlot(s);
    s.item = item;
    s.err = '';
    s.url = item.demo ? '' : (item.url || (Session.client ? Session.client.liveUrl(item.stream_id) : ''));
    this.active = i;
    this._setupMedia(s);
    this.applyAudio();
    this.save();
  },

  _restoreSlot(i, c) {
    const s = this.slots[i];
    if (!s) return false;
    let item = null;
    if (c.demo) item = { demo: 1, name: c.name || 'Demo', logo: c.logo || '' };
    else {
      const sid = c.sid != null ? String(c.sid) : null;
      item = sid ? Session.live.find(x => String(x.stream_id) === sid) : null;
      if (!item && c.url) item = { stream_id: sid, name: c.name || 'Canal', logo: c.logo || '', url: c.url };
    }
    if (!item) return false;
    s.item = item;
    s.url = item.demo ? '' : (item.url || (Session.client ? Session.client.liveUrl(item.stream_id) : ''));
    this._setupMedia(s);
    return true;
  },

  /** Conecta un stream que ya estaba corriendo a un <video> nuevo (cambio de diseño). */
  _reattach(s) {
    const v = $('.ms-video', s.el);
    s.video = v;
    if (s.remux) {                                      // MKV/TS: reconstruir en el vídeo nuevo
      try { s.remux.destroy(); } catch (_e) { /* noop */ }
      s.remux = null;
      this._setupMedia(s);
      return;
    }
    if (s.demo) v.srcObject = s.demo.stream;
    else if (s.hls) { try { s.hls.detachMedia(); s.hls.attachMedia(v); } catch (_e) { /* ya muerto */ } }
    else if (s.url) { v.src = this._nativeSrc(s.url); }
    try { v.load(); } catch (_e) { /* noop */ }
    this._tryPlay(s);
  },

  _nativeSrc(url) { return /m3u8([?#]|$)/i.test(url) ? Net.streamSrc(url) : Net.streamFile(url); },

  _setupMedia(s) {
    const v = s.video;
    if (!v) return;
    v.muted = true;
    v.removeAttribute('src');
    v.srcObject = null;
    const item = s.item;
    if (item.demo) {                                    // señal demo sintética (canvas)
      s.demo = DemoData.makeStream(item.name || 'DEMO');
      v.srcObject = s.demo.stream;
      this._tryPlay(s);
      return;
    }
    const url = s.url;
    if (!url) { s.err = 'Sin URL'; this.renderSlots(); return; }
    // HTTPS no puede cargar HTTP sin proxy: avisa igual que el reproductor normal
    if (location.protocol === 'https:' && /^http:/i.test(url) &&
        !Net.isProxied() && !(Net.publicOn() && S.get('corsMode') !== 'off')) {
      s.err = 'Señal HTTP bloqueada: abre el canal en el reproductor para configurar el proxy';
      this.renderSlots();
      return;
    }
    if (/m3u8([?#]|$)/i.test(url) && window.Hls && Hls.isSupported()) {
      const wantProxy = Net.isProxied() || (Net.publicOn() && S.get('corsMode') === 'always');
      const cfg = {
        manifestLoadingTimeOut: 15000, manifestLoadingMaxRetry: 2,
        levelLoadingTimeOut: 15000, fragLoadingTimeOut: 25000, backBufferLength: 45,
      };
      if (wantProxy) {
        const wrapFn = Net.isProxied() ? (u => Net.proxied(u)) : (u => Net.wrapOnce(u));
        const Loader = Net.hlsProxyLoader(wrapFn);
        if (Loader) { cfg.loader = Loader; cfg.manifestLoadingMaxRetry = 4; cfg.fragLoadingMaxRetry = 4; }
      }
      let hls;
      try { hls = new Hls(cfg); } catch (_e) { s.err = 'HLS no disponible'; this.renderSlots(); return; }
      s.hls = hls;
      hls.attachMedia(v);
      hls.loadSource(url);
      hls.on(Hls.Events.MANIFEST_PARSED, () => this._tryPlay(s));
      hls.on(Hls.Events.ERROR, (evt, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { try { hls.startLoad(); } catch (_e) { /* noop */ } }
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { try { hls.recoverMediaError(); } catch (_e) { /* noop */ } }
        else { s.err = 'Sin señal'; this.renderSlots(); }
      });
    } else if (/m3u8([?#]|$)/i.test(url) && v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = Net.streamSrc(url);                       // HLS nativo (Safari)
      this._tryPlay(s);
    } else if (window.Remux && Remux.kindOf(url)) {     // MKV/TS → remux al vuelo
      const self = this;
      s.remux = Remux.create(Remux.kindOf(url), url, v, {
        onReady: () => { s.err = ''; self.renderSlots(); self._tryPlay(s); },
        onError: () => { s.err = 'Sin señal (formato o red)'; self.renderSlots(); },
        onFallback: () => { s.remux = null; v.src = Net.streamFile(url); self._tryPlay(s); },
        onNotice: (m) => Toast.info(m, 6000),
        onSeekFail: () => Toast.info('Sin índice de búsqueda: se reproduce en orden.'),
      });
    } else {
      v.src = Net.streamFile(url);                      // archivo directo: <video> nativo
      this._tryPlay(s);
    }
  },

  _tryPlay(s) {
    const v = s.video;
    if (!v) return;
    try {
      const p = v.play();
      if (p && p.catch) p.catch(() => { v.muted = true; try { v.play(); } catch (_e) { /* noop */ } });
    } catch (_e) { /* autoplay bloqueado */ }
  },

  /** Política de audio: solo la pantalla activa suena; el resto siempre muteado. */
  applyAudio() {
    for (let i = 0; i < this.slots.length; i++) {
      const s = this.slots[i];
      if (!s.video) continue;
      s.video.muted = !(i === this.active && !!s.item);
      s.video.volume = 1;
    }
    this.renderSlots();
  },

  renderSlots() {
    for (let i = 0; i < this.slots.length; i++) {
      const s = this.slots[i], d = s.el;
      if (!d) continue;
      d.classList.toggle('on', i === this.active && !!s.item);
      d.classList.toggle('empty', !s.item);
      const inf = $('.ms-info', d), aud = $('.ms-audio', d), emp = $('.ms-empty', d);
      if (!s.item) { inf.hidden = true; aud.hidden = true; emp.hidden = false; continue; }
      inf.hidden = false; emp.hidden = true;
      $('.nm', inf).textContent = s.item.name || 'Canal';
      aud.hidden = false;
      aud.className = 'ms-audio' + (i === this.active ? '' : ' off');
      if (s.err) aud.innerHTML = I('alert', 12) + '<span>' + esc(s.err) + '</span>';
      else aud.innerHTML = I('vol', 12) + '<span>' + (i === this.active ? 'AUDIO' : 'SILENCIO') + '</span>';
    }
  },

  _teardownSlot(s) {
    if (s.remux) { try { s.remux.destroy(); } catch (_e) { /* noop */ } s.remux = null; }
    if (s.hls) { try { s.hls.destroy(); } catch (_e) { /* noop */ } s.hls = null; }
    if (s.demo) { try { s.demo.stop(); } catch (_e) { /* noop */ } s.demo = null; }
    if (s.video) {
      try { s.video.pause(); } catch (_e) { /* noop */ }
      s.video.removeAttribute('src');
      s.video.srcObject = null;
      try { s.video.load(); } catch (_e) { /* noop */ }
    }
    s.item = null; s.url = ''; s.err = '';
  },

  save() {
    try {
      localStorage.setItem(this._key(), JSON.stringify({
        n: this.N, a: this.active,
        c: this.slots.map(s => s.item ? {
          sid: s.item.stream_id != null ? String(s.item.stream_id) : null,
          name: s.item.name || '', logo: s.item.logo || '',
          url: s.item.url || '', demo: s.item.demo ? 1 : 0,
        } : null),
      }));
    } catch (_e) { /* lleno o modo privado */ }
  },

  showTip(msg) {
    const h = this.el.hint;
    h.textContent = msg;
    h.classList.add('show');
    clearTimeout(this._tipTimer);
    this._tipTimer = setTimeout(() => h.classList.remove('show'), 5200);
  },

  keydown(e) {
    const k = e.key;
    const t = e.target;
    const tag = (t && t.tagName ? t.tagName : '').toLowerCase();
    if (k === 'Escape' || k === '1') {                  // 1 = atrás, igual que Esc
      e.preventDefault();
      if (Modal.count()) Modal.top().close();           // primero cierra el buscador
      else this.close();
      return;
    }
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1],
      a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1], A: [-1, 0], D: [1, 0], W: [0, -1], S: [0, 1] };
    if (dirs[k]) { e.preventDefault(); Focus.move(dirs[k][0], dirs[k][1]); }
    else if (k === 'Enter' || k === 't' || k === 'T') { if (Focus.current) { e.preventDefault(); Focus.current.click(); } }
    else if (k === '/') { e.preventDefault(); this.assign(this.active); }   // buscar para la pantalla activa
  },
};

/** Buscador de canales para una pantallita del MultiPantalla. */
function openMultiPicker(idx) {
  const cats = Session.liveCats.slice().sort((a, b) =>
    String(a.category_name).localeCompare(String(b.category_name), 'es'));
  const m = Modal.open(() => {
    const inp = el('input', { class: 'ed-search', 'data-focus': '', 'data-autofocus': '',
      autocomplete: 'off', spellcheck: 'false', placeholder: 'Buscar canal por nombre…' });
    const sel = el('select', { 'data-focus': '',
      style: 'margin-top:10px;width:100%;padding:10px 13px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:#fff;font-size:14px;outline:none;cursor:pointer' });
    sel.append(el('option', { value: '' }, 'Todas las categorías'));
    for (const c of cats) sel.append(el('option', { value: String(c.category_id) }, c.category_name));
    const list = el('div', { class: 'ed-list', style: 'margin-top:10px;max-height:52vh;overflow-y:auto' });
    const cnt = el('div', { class: 'ed-count', style: 'margin:12px 2px 0' }, '');
    const draw = debounce(() => {
      const q = normFlat(inp.value.trim());
      const cat = sel.value;
      const out = [];
      for (const it of Session.live) {
        if (cat && String(it.category_id) !== cat) continue;
        if (q && normFlat(it.name).indexOf(q) < 0) continue;
        out.push(it);
        if (out.length >= 150) break;
      }
      cnt.textContent = out.length
        ? (out.length >= 150 ? 'Mostrando los primeros 150 · afina la búsqueda' : out.length + (out.length === 1 ? ' canal' : ' canales'))
        : 'Ningún canal coincide';
      list.innerHTML = '';
      for (const it of out) {
        const row = el('div', { class: 'ed-row', 'data-focus': '', role: 'button' },
          el('img', { src: it.logo || '', alt: '',
            style: 'width:38px;height:38px;border-radius:9px;object-fit:cover;background:#0b1020;border:1px solid var(--stroke);flex:none',
            onerror: "this.style.visibility='hidden'" }),
          el('div', { class: 'nm' },
            el('b', {}, it.name || 'Canal'),
            el('small', {}, Session.catName('live', it.category_id) || '')));
        row.addEventListener('click', () => {
          Topbar.lastTrigger = null;                    // el foco vuelve al MultiPantalla
          m.close();
          Multi.setChannel(idx, it);
          requestAnimationFrame(() => { if (Multi.isOpen()) Focus.focusFirst(); });
        });
        list.append(row);
      }
      requestAnimationFrame(() => Focus.focusFirst());
    }, 90);
    inp.addEventListener('input', draw);
    sel.addEventListener('change', draw);
    inp.addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Escape') { ev.preventDefault(); inp.blur(); } });
    sel.addEventListener('keydown', ev => { ev.stopPropagation(); });
    draw();                                                              // lista inicial
    setTimeout(() => { try { inp.focus(); } catch (_e) { /* noop */ } }, 40);   // teclado listo para escribir
    return el('div', { class: 'modal' },
      el('button', { class: 'modal-x', 'data-focus': '', 'aria-label': 'Cerrar (Esc o 1)', html: I('x', 18), onclick: () => m.close() }),
      el('div', { class: 'form', style: 'padding-bottom:18px' },
        el('h3', { html: I('grid', 20) + '<span>Pantalla ' + (idx + 1) + ' · elegir canal</span>' }),
        inp, sel, cnt, list));
  });
  return m;
}

/* ---------- Teclado global ---------- */
function globalKeys(e) {
  // 1 · Reproductor abierto: control total
  if (Player.isOpen()) { Player.keydown(e); return; }

  // 1b · MultiPantalla abierta: control propio (1/Esc cierran, WASD navega, / busca canal)
  if (Multi.isOpen()) { Multi.keydown(e); return; }

  // 2 · Buscador flotante (T solo selecciona si no estás escribiendo; Enter siempre acepta)
  if (SearchOverlay.isOpen()) {
    const stg = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
    const typingS = stg === 'input' || stg === 'textarea';
    if (e.key === 'Escape' || (!typingS && e.key === '1')) { e.preventDefault(); SearchOverlay.close(); }
    else if (e.key === 'Enter' || (!typingS && (e.key === 't' || e.key === 'T'))) { e.preventDefault(); SearchOverlay.openFirst(); }
    return;
  }

  // 3 · Atrás jerárquico con 1 (o Esc): menú → modal → MultiPantalla → vista inicial
  const tgB = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
  const typingB = tgB === 'input' || tgB === 'textarea' || tgB === 'select';
  if (e.key === 'Escape' || (e.key === '1' && !typingB)) {
    if (Menus.anyOpen()) { Menus.closeAll(); e.preventDefault(); return; }
    if (Modal.count()) { Modal.top().close(); e.preventDefault(); return; }
    if (Multi.isOpen()) { Multi.close(); e.preventDefault(); return; }
    if (Router.current && Router.current !== 'dashboard') { Router.show('dashboard'); e.preventDefault(); }
    return;
  }

  // 4 · Atajo de búsqueda (Ctrl/Cmd+K o "/")
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); SearchOverlay.open(); return;
  }

  const t = e.target;
  const tag = (t.tagName || '').toLowerCase();
  const typing = (tag === 'input' && ['text', 'password', 'search', 'number', 'email', 'url'].includes(t.type)) || tag === 'textarea' || tag === 'select';
  if (typing) return;

  // 5 · Focus engine (D-Pad espacial · también WASD)
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1],
    a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1], A: [-1, 0], D: [1, 0], W: [0, -1], S: [0, 1] };
  if (dirs[e.key]) { e.preventDefault(); Focus.move(dirs[e.key][0], dirs[e.key][1]); }
  else if ((e.key === 'Enter' || e.key === 't' || e.key === 'T') && Focus.current) { e.preventDefault(); Focus.current.click(); }   // T = OK del mando
  else if (e.key === 'l' || e.key === 'L') {          // favorito de la tarjeta enfocada (si tiene estrella)
    const b = Focus.current && Focus.current.querySelector ? Focus.current.querySelector('.fav-btn') : null;
    if (b) { e.preventDefault(); b.click(); }
  }
  else if (e.key === '/' && !Modal.count()) { e.preventDefault(); SearchOverlay.open(); }
}

/* ---------- Arranque de la aplicación ----------
 * Cada paso está aislado: un fallo (p. ej. sin IndexedDB o sin WebCrypto)
 * nunca debe dejar la interfaz en blanco. */
(async function boot() {
  try {
    S.load();
    S.apply();
    try { await DB.open(); }
    catch (_e) { Toast.err('Almacenamiento limitado en este navegador: las cuentas no se recordarán al cerrar.', 6000); }

    // Cero configuración: si esta página está alojada con un proxy integrado
    // (Cloudflare Pages / preview / servidor local), lo detecta solo.
    try { if (await Net.autoDetectProxy()) console.log('DJ-IPTV · proxy integrado detectado:', S.get('proxyBase') + S.get('proxyRoute')); }
    catch (_e) { /* conexión directa */ }

    Topbar.init();
    SearchOverlay.init();
    Player.init();
    Multi.init();
    Router.RENDER['dashboard'] = renderDashboard;
    Router.RENDER['downloads'] = renderDownloadsView;
    Router.RENDER['settings'] = renderSettingsView;

    document.addEventListener('keydown', globalKeys);

    // Sincroniza el foco tvOS al mover el ratón
    document.addEventListener('pointerover', e => {
      if (Player.isOpen() || Modal.count() || Menus.anyOpen() || SearchOverlay.isOpen()) return;
      const t = e.target.closest && e.target.closest('[data-focus]');
      if (t && t !== Focus.current && (t.closest('#main') || t.closest('.topbar'))) Focus.set(t);
    });

    try { await DL.init(); }
    catch (_e) { /* sin persistencia de descargas; la app sigue */ }

    try { await Accounts.refresh(); }
    catch (e) { Toast.err('No se pudieron leer las cuentas guardadas: ' + (e && e.message || e)); }
  } catch (e) {
    if (window.__djFault) window.__djFault('Arranque', e);
  }

  // La interfaz debe existir SIEMPRE, haya fallado algo antes o no
  try { Router.show('dashboard'); }
  catch (e) { if (window.__djFault) window.__djFault('Panel de inicio', e); }

  try {
    const last = S.get('lastAccount');
    if (last === 'demo') Session.load('demo');
    else if (last && Accounts.get(last)) Session.load(last);
    else if (Accounts.list.length === 1) Session.load(Accounts.list[0].id);
  } catch (_e) { /* la sesión manual siempre está disponible */ }

  // Protege transferencias y grabaciones activas al cerrar la pestaña
  window.addEventListener('beforeunload', e => {
    if (PVR.active || DL._running > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  window.__DJ_READY__ = true;   // desactiva el aviso de compatibilidad
  const style = 'color:#0A84FF;font-weight:bold;font-size:14px';
  console.log('%c DJ-IPTV v1.9 ', style + ';background:#0f172a;border-radius:4px', '· cliente 100% web · Hls.js:' + (window.Hls ? 'ok' : 'CDN pendiente') + ' · IDB:' + (DB._db ? 'ok' : DB._ls ? 'respaldo' : 'no'));
})();
</script>
