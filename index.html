  async clearAll() { await DB.clear('cache').catch(() => {}); },
};

/* ---------- Filtro de contenido adulto ----------
 * Oculta categorías cuyo nombre apunte a contenido para adultos
 * (adulto/adultos/xxx/porno/+18/erótico/...) y también los canales,
 * películas o episodios que pertenezcan a esas categorías. */
const ADULT_CAT_RE = new RegExp(
  '(^|[^a-z0-9])(adult[oa]?s?|adults|xxx+|pornograf[a-z]*|porn[oa]?s?|erotic[oa]?s?|sexo|sexy|sex ?shop|nsfw|milf|hentai|' +
  'brazzers|hustler|penthouse|playboy|onlyfans|para adultos|solo adultos|for adults|adults only|mayores de 18|\\+18|18\\+)' +
  '(?=[^a-z0-9]|$)', 'i');

/** Nombre normalizado (minúsculas y sin acentos) para comparar sin falsos negativos. */
function normFlat(s) {
  let t = String(s || '').toLowerCase();
  try { t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (_e) { /* motor viejo */ }
  return t;
}
function isAdultCatName(name) { return ADULT_CAT_RE.test(normFlat(name)); }

/** Devuelve {cats, items, hidden} sin categorías adultas ni su contenido.
 *  hidden = número de categorías eliminadas (los elementos de esas categorías van aparte). */
function filterAdultCatalog(cats, items) {
  const src = Array.isArray(cats) ? cats : [];
  const keep = [], bad = {};
  for (const c of src) {
    if (c && isAdultCatName(c.category_name)) bad[String(c.category_id)] = 1;
    else keep.push(c);
  }
  const list = Array.isArray(items) ? items : [];
  const nBad = Object.keys(bad).length;
  if (!nBad) return { cats: src, items: list, hidden: 0 };
  const okItems = [];
  for (const it of list) if (!bad[String(it && it.category_id)]) okItems.push(it);
  return { cats: keep, items: okItems, hidden: nBad };
}

/* ---------- Sesión: catálogo activo (cuenta real o demo) ---------- */
const Session = {
  ready: false,
  isDemo: false,
  account: null,
  client: null,          // XtreamClient activo
  liveCats: [], live: [],
  vodCats: [],  vod: [],
  seriesCats: [], series: [],
  rev: 0,                // revisión: invalida las vistas al recargar

  reset() {
    this.ready = false; this.isDemo = false; this.account = null; this.client = null;
    this.liveCats = []; this.live = []; this.vodCats = []; this.vod = [];
    this.seriesCats = []; this.series = [];
    this.rev++;
    Search.buildIndex();
    emit('session:changed');
  },

  async load(accountId, force = false) {
    const acc = accountId === 'demo' ? { id: 'demo', alias: 'Modo Demo', isDemo: true, hue: 265 } : Accounts.get(accountId);
    if (!acc) return;
    this.account = acc;
    this.isDemo = !!acc.isDemo;
    this.activeIdSet(acc.id);
    Accounts.activeId = acc.id;
    S.set('lastAccount', acc.id);
    this.ready = false;
    this.rev++;
    emit('session:loading', acc);

    try {
      if (this.isDemo) await this._loadDemo();
      else await this._loadReal(acc, force);
      this.ready = true;
      this.rev++;
      Search.buildIndex();
      emit('session:changed', acc);
    } catch (e) {
      Toast.err('No se pudo cargar «' + acc.alias + '»: ' + Net.explain(e));
      emit('session:error', e);
    }
  },

  activeIdSet(id) { /* reservado para sincronías futuras */ },

  async _loadDemo() {
    this.client = null;
    this.liveCats = DemoData.liveCats();  this.live = DemoData.liveView();
    this.vodCats = DemoData.moviesCats(); this.vod = DemoData.moviesView();
    this.seriesCats = DemoData.seriesCats(); this.series = DemoData.seriesView();
    await new Promise(r => setTimeout(r, 260)); // deja ver el estado de carga
  },

  async _loadReal(acc, force) {
    const pass = await Accounts.passwordOf(acc);
    if (!pass && pass !== '') throw new Error('No se pudo descifrar la contraseña de esta cuenta');
    const cli = new XtreamClient({ ...acc, password: pass });
    // Validación rápida (y renovación de estado/expiración)
    const auth = await cli.authenticate().catch(e => { throw e; });
    acc.status = auth.user_info.status || acc.status;
    acc.expDate = auth.user_info.exp_date || acc.expDate;
    Accounts.update(acc);
    this.client = cli;

    const base = 'acc:' + acc.id + ':v2:';   // v2: ignora cachés viejas que pudieron guardar catálogos vacíos
    const jobs = [
      ['live',   () => cli.getLiveCategories(), () => cli.getLiveStreams()],
      ['vod',    () => cli.getVodCategories(),  () => cli.getVodStreams()],
      ['series', () => cli.getSeriesCategories(), () => this._loadSeriesResilient(cli)],
    ];
    let firstPaint = false;
    for (const [type, catFn, itemsFn] of jobs) {
      const ck = base + type;
      let cats = force ? null : await CatCache.get(ck + ':cats');
      let items = force ? null : await CatCache.get(ck + ':items');
      // items vacío con categorías presentes = caché envenenada: se vuelve a pedir
      const staleEmpty = !!(cats && cats.length && items && !items.length);
      if (!cats || !items || staleEmpty) {
        try {
          [cats, items] = await Promise.all([catFn(), itemsFn()]);
          cats = Array.isArray(cats) ? cats : [];
          items = Array.isArray(items) ? items : [];
          if (items.length || cats.length) {      // no guardar vacíos: impediría recuperarse
            await CatCache.put(ck + ':cats', cats);
            await CatCache.put(ck + ':items', items);
          }
        } catch (e) {
          if (!firstPaint) throw e;              // sin datos locales ni red: aborta
          Toast.err('Catálogo «' + type + '»: ' + Net.explain(e));
          cats = cats || []; items = items || [];
        }
      }
      // Filtro de contenido adulto: oculta categorías «adulto/xxx/+18/...» y todo su contenido.
      const f = filterAdultCatalog(cats, items);
      if (f.hidden && !this._adultToastShown) {
        this._adultToastShown = true;
        Toast.info('Contenido adulto oculto (' + f.hidden + (f.hidden === 1 ? ' categoría).' : ' categorías).'));
      }
      if (type === 'live') { this.liveCats = f.cats; this.live = f.items; }
      else if (type === 'vod') { this.vodCats = f.cats; this.vod = f.items; }
      else { this.seriesCats = f.cats; this.series = f.items; }
      if (!firstPaint) { firstPaint = true; this.ready = true; this.rev++; emit('session:partial', acc); }
    }
    acc.lastSync = Date.now();
    Accounts.update(acc);
  },

  /** Catálogo de series a prueba de fallos:
   *  1) listado completo (35 s); 2) si falla o llega vacío, se pide categoría por categoría
   *  (muchos paneles se rompen o cortan la respuesta del listado completo). */
  async _loadSeriesResilient(cli) {
    let full = null, fullErr = null;
    try { full = await cli.getSeries(null); } catch (e) { fullErr = e; }
    if (Array.isArray(full) && full.length) return full;
    let cats = [];
    try { cats = await cli.getSeriesCategories(); } catch (_e) { cats = []; }
    cats = Array.isArray(cats) ? cats : [];
    if (!cats.length) { if (fullErr) throw fullErr; return Array.isArray(full) ? full : []; }
    const seen = {}, out = [];
    let ok = 0, bad = 0, firstErr = null;
    const queue = cats.slice();
    const worker = async () => {
      while (queue.length) {
        const c = queue.shift();
        try {
          const arr = await cli.getSeries(c.category_id, 20000);
          ok++;
          for (const s of (Array.isArray(arr) ? arr : [])) {
            const k = String(s && s.series_id);
            if (k && !seen[k]) { seen[k] = 1; out.push(s); }
          }
        } catch (e) { bad++; if (!firstErr) firstErr = e; }
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    if (!out.length) {
      if (fullErr) throw fullErr;                 // el completo también falló: ese es el error real
      if (firstErr && !ok) throw firstErr;        // todas las categorías fallaron
    } else if (bad) {
      Toast.info('Series: ' + out.length.toLocaleString('es') + ' cargadas (' + bad + ' categorías no respondieron). Usa «Recargar catálogo» para reintentar.');
    }
    return out;
  },

  catName(type, catId) {
    const arr = type === 'live' ? this.liveCats : type === 'vod' ? this.vodCats : this.seriesCats;
    const c = arr.find(x => String(x.category_id) === String(catId));
    return c ? c.category_name : '';
  },
  vodUrl(item) {
    if (item.demo) return null; // la demo reproduce su señal sintética
    return this.client.movieUrl(item.stream_id, item.container_extension || 'mp4');
  },
  liveUrl(item) {
    if (item.demo) return null;
    return this.client.liveUrl(item.stream_id);
  },
};

/* ---------- EPG: ahora + siguiente, cola con concurrencia limitada ---------- */
const EPG = {
  mem: new Map(),                       // streamId → {list, ts}
  TTL: 4 * 60 * 1000,
  inflight: new Map(),
  queue: [], running: 0, MAX: 4,
  listeners: new Map(),

  getCached(id) {
    const c = this.mem.get(id);
    if (c && (Date.now() - c.ts) < this.TTL) return c.list;
    return null;
  },
  /** Pide EPG y notifica cuando llega (una sola petición por canal). */
  ensure(id, cb) {
    const cached = this.getCached(id);
    if (cached) { cb(cached); return; }
    if (!this.listeners.has(id)) this.listeners.set(id, new Set());
    this.listeners.get(id).add(cb);
    if (this.inflight.has(id) || this.queue.includes(id)) return;
    this.queue.push(id);
    this._pump();
  },
  async _pump() {
    while (this.running < this.MAX && this.queue.length) {
      const id = this.queue.shift();
      this.running++;
      this.inflight.set(id, true);
      this._fetch(id).finally(() => {
        this.running--;
        this.inflight.delete(id);
        this._pump();
      });
    }
  },
  async _fetch(id) {
    let list = null;
    try {
      if (Session.isDemo) list = DemoData.epgFor(id);
      else if (Session.client) list = await Session.client.getShortEPG(id, 6);
    } catch (_e) { list = null; }
    if (list && list.length) this.mem.set(id, { list, ts: Date.now() });
    const subs = this.listeners.get(id);
    if (subs) {
      const val = list && list.length ? list : [];
      subs.forEach(cb => { try { cb(val); } catch (_e) { /* noop */ } });
      this.listeners.delete(id);
    }
  },
  now(list) {
    const t = Date.now() / 1000;
    const now = list.find(p => p.start <= t && p.end > t);
    const next = list.find(p => p.start > (now ? now.start : t));
    return { now, next };
  },
};

/* ---------- Buscador global en memoria (<10 ms, ignora acentos) ---------- */
const Search = {
  index: [],
  /** Minusculas + sin diacríticos: «neón» == «neon». */
  norm(s) {
    try { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
    catch (_e) { return String(s).toLowerCase(); }
  },
  buildIndex() {
    const ix = [];
    for (const c of Session.live) ix.push({ t: 'live', id: c.stream_id, name: c.name, low: this.norm(c.name), icon: c.stream_icon, cat: Session.catName('live', c.category_id) });
    for (const m of Session.vod) ix.push({ t: 'vod', id: m.stream_id, name: m.name, low: this.norm(m.name), icon: m.stream_icon, cat: Session.catName('vod', m.category_id) });
    for (const s of Session.series) ix.push({ t: 'series', id: s.series_id, name: s.name, low: this.norm(s.name), icon: s.cover, cat: Session.catName('series', s.category_id) });
    this.index = ix;
  },
  run(q, limit = 40) {
    q = this.norm(q.trim());
    if (!q) return null;
    const out = { live: [], vod: [], series: [] };
    const starts = [], incl = [];
    for (const it of this.index) {
      if (it.low.startsWith(q)) starts.push(it);
      else if (it.low.includes(q)) incl.push(it);
    }
    for (const it of [...starts, ...incl]) {
      if (out[it.t].length >= limit) continue;
      out[it.t].push(it);
    }
    return out;
  },
};

/* ---------- Focus Engine estilo tvOS (ratón + teclado D-Pad) ---------- */
const Focus = {
  stack: [],
  current: null,
  get root() { return this.stack[this.stack.length - 1] || $('#main'); },
  push(root) { this.stack.push(root); },
  pop(root) {
    const i = this.stack.lastIndexOf(root);
    if (i >= 0) this.stack.splice(i, 1);
  },
  clearToMain() { this.stack.length = 0; this.set(null); },
  candidates() {
    return $$('[data-focus]', this.root).filter(e =>
      !e.disabled && e.offsetParent !== null && !e.closest('[hidden]'));
  },
  set(elm) {
    if (this.current) this.current.classList.remove('focused');
    this.current = elm || null;
    if (!elm) return;
    elm.classList.add('focused');
    try {
      elm.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: S.get('reduceMotion') ? 'auto' : 'smooth' });
    } catch (_e) { /* navegadores antiguos */ }
  },
  focusFirst() {
    const c = this.candidates();
    this.set(c.find(e => e.dataset.autofocus != null) || c[0] || null);
  },
  /** Navegación espacial: elige el candidato mejor posicionado en la dirección indicada. */
  move(dx, dy) {
    const cur = this.current;
    const cands = this.candidates();
    if (!cands.length) return;
    if (!cur || !cur.isConnected) { this.set(cands[0]); return; }
    const r = cur.getBoundingClientRect();
    let best = null, bestScore = Infinity;
    for (const n of cands) {
      if (n === cur) continue;
      const r2 = n.getBoundingClientRect();
      if (dx > 0 && r2.left < r.right - 6) continue;
      if (dx < 0 && r2.right > r.left + 6) continue;
      if (dy > 0 && r2.top < r.bottom - 6) continue;
      if (dy < 0 && r2.bottom > r.top + 6) continue;
      const overlap = dx !== 0
        ? Math.min(r.bottom, r2.bottom) - Math.max(r.top, r2.top)
        : Math.min(r.right, r2.right) - Math.max(r.left, r2.left);
      const O = Math.max(0, overlap);
      const dist = dx !== 0 ? Math.abs((r2.left + r2.width / 2) - (r.left + r.width / 2))
                            : Math.abs((r2.top + r2.height / 2) - (r.top + r.height / 2));
      const cross = dx !== 0 ? Math.abs((r2.top + r2.height / 2) - (r.top + r.height / 2))
                             : Math.abs((r2.left + r2.width / 2) - (r.left + r.width / 2));
      const score = dist + cross * 1.6 - O * .5;
      if (score < bestScore) { bestScore = score; best = n; }
    }
    if (best) this.set(best);
  },
};

/* ---------- Menús desplegables glass ---------- */
const Menus = {
  open: [],
  anyOpen() { return this.open.length > 0; },
  closeAll() { [...this.open].forEach(m => m.close()); },
};
function openDropdown(anchor, items, opts = {}) {
  Menus.closeAll();
  const menu = el('div', { class: 'menu' + (opts.up ? ' up' : ''), role: 'menu' });
  for (const it of items) {
    if (it === 'sep') { menu.append(el('div', { class: 'menu-sep' })); continue; }
    const b = el('button', {
      class: 'menu-item' + (it.danger ? ' danger' : ''), 'data-focus': '', role: 'menuitem',
      onclick: () => { m.close(); it.onClick && it.onClick(); },
    });
    b.innerHTML = (it.icon ? I(it.icon, 19) : '') +
      '<span class="grow">' + esc(it.label) + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</span>' +
      (it.check ? I('check', 17, 'style="color:var(--accent)"') : '');
    menu.append(b);
  }
  const holder = anchor.closest('.acc-wrap') || anchor.parentElement;
  const fixed = !holder || holder === document.body;
  if (fixed) { menu.style.position = 'fixed'; const r = anchor.getBoundingClientRect(); menu.style.top = (r.bottom + 10) + 'px'; menu.style.right = (innerWidth - r.right) + 'px'; }
  (holder || document.body).append(menu);

  const onOut = e => { if (!menu.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) m.close(); };
  const m = {
    el: menu,
    close() {
      if (!menu.isConnected) return;
      menu.remove();
      document.removeEventListener('pointerdown', onOut, true);
      Focus.pop(menu);
      Menus.open = Menus.open.filter(x => x !== m);
      Focus.set(anchor);
    },
  };
  document.addEventListener('pointerdown', onOut, true);
  Menus.open.push(m);
  Focus.push(menu);
  requestAnimationFrame(() => Focus.focusFirst());
  return m;
}

/* ---------- Gestor de modales (capas apilables) ---------- */
const Modal = {
  stack: [],
  count() { return this.stack.length; },
  top() { return this.stack[this.stack.length - 1] || null; },
  open(builder) {
    const veil = el('div', { class: 'modal-veil' });
    const m = {
      veil,
      closed: false,
      close() {
        if (this.closed) return;
        this.closed = true;
        veil.remove();
        Modal.stack = Modal.stack.filter(x => x !== m);
        Focus.pop(veil);
        const prev = Modal.top();
        if (prev) Focus.focusFirst();
        else Focus.set(Topbar.lastTrigger && Topbar.lastTrigger.isConnected ? Topbar.lastTrigger : null) || Focus.focusFirst();
      },
    };
    veil.addEventListener('pointerdown', e => { if (e.target === veil) m.close(); });
    let panel = null;
    try { panel = builder(veil, m); }
    catch (e) {
      panel = el('div', { class: 'modal slim' },
        el('div', { class: 'confirm-body' },
          el('div', { class: 'ic', html: I('alert', 26) }),
          el('h3', {}, 'No se pudo abrir esta ventana'),
          el('p', { style: 'color:var(--t-2);font-size:13px;word-break:break-word' }, String((e && e.message) || e)),
          el('div', { class: 'form-actions', style: 'justify-content:center' },
            el('button', { class: 'btn btn-glass', 'data-focus': '', onclick: () => m.close() }, 'Cerrar'))));
      if (window.__djFault) window.__djFault('Modal', e);
    }
    Promise.resolve(panel).then(p => { if (p && !m.closed) veil.append(p); })
      .catch(e => { if (window.__djFault) window.__djFault('Modal (async)', e); });
    $('#modal-root').append(veil);
    Modal.stack.push(m);
    Focus.push(veil);
    requestAnimationFrame(() => Focus.focusFirst());
    return m;
  },
};

/* ---------- Asistente de conexión (CORS · servidor local · extensión) ---------- */
const PROXY_PORTS = [8080, 8081, 8188, 8090];

/** Busca el servidor local incluido en los puertos habituales (ambas rutas). */
async function detectLocalProxy(log) {
  const hosts = ['http://localhost', 'http://127.0.0.1'];
  const routes = [
    { proxy: '/api/proxy', check: '/api/cors-check' },
    { proxy: '/proxy', check: '/cors-check' },
  ];
  for (const p of PROXY_PORTS) {
    for (const h of hosts) {
      for (const r of routes) {
        const base = h + ':' + p;
        if (log) log('Probando ' + base + r.proxy + ' …');
        if (await Net._probe(base, r.check)) {
          S.set('proxyBase', base);
          S.set('proxyRoute', r.proxy);
          return base;
        }
      }
    }
  }
  return null;
}

/** Modal con las soluciones al bloqueo CORS. Sin Node.js: proxy público, nube, extensión o local. */

        el('div', { class: 'ch-name' }, item.name || '')),
      el('span', { class: 'badge-live', html: '<i></i>LIVE' }),
      favId != null ? favBtn('live', favId, item.name) : null,
      nowEl, prog, next));
  // Difiere la consulta de EPG al siguiente frame: garantiza que la tarjeta
  // ya esté conectada al DOM (los callbacks sincrónicos de caché la necesitan).
  requestAnimationFrame(() => {
    if (!nowEl.isConnected) return;
    EPG.ensure(String(item.stream_id), list => {
      if (!nowEl.isConnected) return;
    const { now, next: n } = EPG.now(list);
    if (!now) { nowEl.textContent = 'Programación no disponible'; prog.hidden = true; next.textContent = ''; return; }
    nowEl.textContent = now.title;
    const p = (Date.now() / 1000 - now.start) / Math.max(1, now.end - now.start);
    prog.firstElementChild.style.width = Math.round(Math.min(1, Math.max(0, p)) * 100) + '%';
    next.textContent = n ? ('Luego ' + fmtClock(n.start) + ' · ' + n.title) : '';
    });
  });
  return c;
}

/* ---------- Riel horizontal con flechas ---------- */
function buildRail(title, ic, items, cardFn, moreLabel, onMore) {
  const track = el('div', { class: 'rail-track' });
  for (const it of items) track.append(cardFn(it));
  const prev = el('button', { class: 'rail-nav prev', html: I('chevL', 20), 'data-focus': '', 'aria-label': 'Anterior' });
  const nextB = el('button', { class: 'rail-nav next', html: I('chevR', 20), 'data-focus': '', 'aria-label': 'Siguiente' });
  prev.addEventListener('click', () => track.scrollBy({ left: -track.clientWidth * .8, behavior: 'smooth' }));
  nextB.addEventListener('click', () => track.scrollBy({ left: track.clientWidth * .8, behavior: 'smooth' }));
  const syncArrows = () => {
    prev.style.opacity = track.scrollLeft > 12 ? '' : '';
    nextB.style.opacity = track.scrollLeft + track.clientWidth >= track.scrollWidth - 12 ? '0' : '';
  };
  track.addEventListener('scroll', debounce(syncArrows, 80), { passive: true });
  const head = [el('span', { html: I(ic, 19) }), title];
  if (moreLabel) head.push(el('button', { class: 'section-more', onclick: onMore }, moreLabel + ' →'));
  return el('div', { class: 'rail' },
    el('div', { class: 'section-title' }, ...head),
    track, prev, nextB);
}

/* ---------- Hero / cartelera desplegable ---------- */
function buildHero(slides) {
  const root = el('div', { class: 'hero' });
  const track = el('div', { class: 'hero-slides' });
  const dots = el('div', { class: 'hero-dots' });
  let idx = 0, timer = 0;

  slides.forEach((s, i) => {
    const bg = el('div', { class: 'hero-bg', style: 'background-image:url("' + (s._bg || s.stream_icon || s.cover || '') + '")' });
    const meta = el('div', { class: 'hero-meta' });
    if (Number(s.rating) > 0) meta.append(el('span', { class: 'imdb', html: I('star', 13) + '<b>' + Number(s.rating).toFixed(1) + '</b>' }));
    if (s.year || s.releasedate) meta.append(el('span', {}, String(s.year || s.releasedate).slice(0, 4)));
    if (s.genre) meta.append(el('span', {}, s.genre));
    if (s.dur) meta.append(el('span', {}, s.dur + ' min'));
    const plot = el('p', { class: 'hero-plot' }, s.plot || 'Cargando sinopsis…');
    const play = el('button', { class: 'btn btn-primary', 'data-focus': '', html: I('play', 18) + '<span>Reproducir</span>' });
    play.addEventListener('click', () => Player.openMovie(s));
    const det = el('button', { class: 'btn btn-glass', 'data-focus': '', html: I('info', 18) + '<span>Detalles</span>' });
    det.addEventListener('click', () => openMovieModal(s));
    const actions = el('div', { class: 'hero-actions' }, play, det);
    if (!s.demo) {
      const dl = el('button', { class: 'btn btn-glass', 'data-focus': '', html: I('download', 18) + '<span>Descargar</span>' });
      dl.addEventListener('click', () => downloadMovie(s));
      actions.append(dl);
      if (!s.plot) VodInfoMem.get(s.stream_id).then(info => {
        if (!plot.isConnected) return;
        if (info && info.plot) plot.textContent = info.plot;
        if (info && info.genre && !s.genre) meta.append(el('span', {}, info.genre));
        if (info && info.movie_image) bg.style.backgroundImage = 'url("' + info.movie_image + '")';
      });
    }
    const kick = el('span', { class: 'hero-kicker' }, s.demo || s.stream_id ? 'Novedad · Película' : 'Destacado');
    track.append(el('div', { class: 'hero-slide' }, bg,
      el('div', { class: 'hero-shade' }),
      el('div', { class: 'hero-content' }, kick,
        el('h1', {}, s.name || s.title || ''),
        meta, plot, actions)));
    const d = el('button', { 'aria-label': 'Diapositiva ' + (i + 1), onclick: () => { go(i); restart(); } });
    dots.append(d);
  });

  const go = i => {
    idx = (i + slides.length) % slides.length;
    track.style.transform = 'translateX(-' + (idx * 100) + '%)';
    $$('button', dots).forEach((d, j) => d.classList.toggle('on', j === idx));
  };
  const next = () => go(idx + 1);
  const restart = () => { clearInterval(timer); timer = setInterval(() => {
    if (document.hidden || !root.isConnected) return;
    if (root.matches(':hover') || root.contains(document.activeElement)) return;
    next();
  }, 7000); };
  restart();

  root.append(track,
    el('button', { class: 'hero-arrow prev', html: I('chevL', 21), 'data-focus': '', 'aria-label': 'Anterior', onclick: () => { go(idx - 1); restart(); } }),
    el('button', { class: 'hero-arrow next', html: I('chevR', 21), 'data-focus': '', 'aria-label': 'Siguiente', onclick: () => { go(idx + 1); restart(); } }),
    dots);
  go(0);
  return root;
}

/* ---------- Rueda del ratón: desplaza en horizontal carriles, chips y pestañas ----------
   Pasa el ratón por una fila y usa la rueda: se mueve a izquierda/derecha.
   En los extremos deja pasar el desplazamiento vertical de la página. */
document.addEventListener('wheel', (e) => {
  const t = e.target && e.target.closest ? e.target.closest('.rail-track, .chips, .tabs') : null;
  if (!t) return;
  let dy = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : 0;
  if (!dy) return;
  if (e.deltaMode === 1) dy *= 33;                    // Firefox: líneas → píxeles
  if (t.scrollWidth <= t.clientWidth + 4) return;     // nada que desplazar
  const max = t.scrollWidth - t.clientWidth;
  // Objetivo acumulativo: girar rápido suma (el scroll suave del CSS es asíncrono)
  if (t.__djX === undefined) t.__djX = t.scrollLeft;
  const tgt = Math.max(0, Math.min(max, t.__djX + dy));
  t.__djX = tgt;
  t.scrollLeft = tgt;
  clearTimeout(t.__djT);
  t.__djT = setTimeout(() => { t.__djX = undefined; }, 200);
  if ((tgt <= 0 && dy < 0) || (tgt >= max - 1 && dy > 0)) return;   // al borde: la página sigue
  e.preventDefault();
}, { passive: false });

/** Renderiza una rejilla por bloques con IntersectionObserver. */
function paginateGrid(grid, items, cardFn, chunk = 60) {
  if (!items.length) {
    grid.append(el('div', { class: 'empty', style: 'grid-column:1/-1' },
      el('div', { class: 'big' }, 'Sin elementos en esta categoría')));
    return;
  }
  let i = 0, obs = null;
  const sentinel = el('div', { class: 'sentinel' });
  const load = () => {
    const end = Math.min(items.length, i + chunk);
    const frag = document.createDocumentFragment();
    for (; i < end; i++) frag.append(cardFn(items[i]));
    grid.append(frag);
    if (i >= items.length && obs) { obs.disconnect(); obs = null; }
  };
  obs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) load(); }, { rootMargin: '700px' });
  grid.append(sentinel);
  obs.observe(sentinel);
  load();
  grid.append(sentinel);   // el centinela siempre al final de la rejilla
}

async function openSeriesModal(item) {

  const seasonsWrap = el('div', { class: 'seasons', hidden: true });
