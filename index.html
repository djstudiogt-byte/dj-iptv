/* ---------- Editor de listas: ocultar / renombrar categorías y canales ----------
 * Se guarda por cuenta en localStorage: 'dj:edit:<cuenta>' →
 *   { cat: { 'live|12': {hide:1, name:'Deportes ★'} }, ch: { 'vod|3301': {hide:1} } }
 * El filtro se aplica cada vez que la sesión carga y al instante cuando cambias
 * algo en Ajustes → Canales y categorías. El servidor original no se toca. */
const Edits = {
  _src: {},               // type → {cats, items} sin editar (referencias de la sesión activa)
  _key() {
    const acc = Session.isDemo ? 'demo' : (Accounts.activeId || 'ninguna');
    return 'dj:edit:' + acc;
  },
  _data() {
    try { const d = JSON.parse(localStorage.getItem(this._key()) || '{}'); return d && typeof d === 'object' ? d : {}; }
    catch (_e) { return {}; }
  },
  _save(d) { try { localStorage.setItem(this._key(), JSON.stringify(d)); } catch (_e) { /* lleno o privado */ } },
  _applyPatch(map, key, patch) {
    const e = map[key] || {};
    if (patch.hide != null) { if (patch.hide) e.hide = 1; else delete e.hide; }
    if (patch.name != null) { const n = String(patch.name).trim(); if (n) e.name = n; else delete e.name; }
    if (e.hide || e.name) map[key] = e; else delete map[key];
  },
  catEntry(type, id) { const d = this._data(); return (d.cat && d.cat[type + '|' + id]) || null; },
  chEntry(type, id) { const d = this._data(); return (d.ch && d.ch[type + '|' + id]) || null; },
  setCat(type, id, patch) { const d = this._data(); if (!d.cat) d.cat = {}; this._applyPatch(d.cat, type + '|' + id, patch); this._save(d); },
  setCh(type, id, patch) { const d = this._data(); if (!d.ch) d.ch = {}; this._applyPatch(d.ch, type + '|' + id, patch); this._save(d); },
  /** Resumen: {catH, chH, ren} categorías ocultas / contenido oculto / renombrados. */
  counts() {
    const d = this._data();
    let catH = 0, chH = 0, ren = 0;
    for (const k in (d.cat || {})) { const e = d.cat[k]; if (e.hide) catH++; if (e.name) ren++; }
    for (const k in (d.ch || {})) { const e = d.ch[k]; if (e.hide) chH++; if (e.name) ren++; }
    return { catH: catH, chH: chH, ren: ren };
  },
  reset() { try { localStorage.removeItem(this._key()); } catch (_e) { /* nada guardado */ } this.applyToSession(); },
  /** Guarda las listas originales de la sesión (referencias; no copia memoria). */
  setSource(type, cats, items) { this._src[type] = { cats: cats, items: items }; },
  clearSource() { this._src = {}; },
  /** Devuelve {cats, items} sin lo oculto y con los nombres personalizados.
   *  No altera las listas de origen (crea otras); los objetos sí son compartidos,
   *  así que el nombre original se recuerda en _djOrigName para poder restaurar. */
  filter(type, cats, items) {
    const d = this._data();
    const catD = d.cat || {}, chD = d.ch || {};
    const srcCats = Array.isArray(cats) ? cats : [];
    const hiddenCat = {};
    for (const c of srcCats) {
      if (!c) continue;
      const e = catD[type + '|' + String(c.category_id)];
      if (e && e.hide) hiddenCat[String(c.category_id)] = 1;
    }
    const outCats = [];
    for (const c of srcCats) {
      if (!c || hiddenCat[String(c.category_id)]) continue;
      if (c._djOrigName != null) c.category_name = c._djOrigName;
      const e = catD[type + '|' + String(c.category_id)];
      if (e && e.name) { if (c._djOrigName == null) c._djOrigName = c.category_name; c.category_name = e.name; }
      outCats.push(c);
    }
    const outItems = [];
    const srcItems = Array.isArray(items) ? items : [];
    for (const it of srcItems) {
      if (!it) continue;
      if (hiddenCat[String(it.category_id)]) continue;
      if (it._djOrigName != null) it.name = it._djOrigName;
      const id = Favs.idOf(type, it);
      const ie = id != null ? chD[type + '|' + String(id)] : null;
      if (ie && ie.name) { if (it._djOrigName == null) it._djOrigName = it.name; it.name = ie.name; }
      if (ie && ie.hide) continue;
      outItems.push(it);
    }
    return { cats: outCats, items: outItems };
  },
  /** Reaplica los cambios sobre la sesión activa y refresca las vistas. */
  applyToSession() {
    if (typeof Session === 'undefined' || !Session.ready) return;
    Session.applyCatalogs();
  },
};

/* ---------- Capa de red: directo → micro-proxy propio → cadena de proxies públicos ---------- */

/** Proxies CORS públicos que no requieren instalar nada (ideales para file:// y ChromeOS Flex).
 *  Verificados aceptando peticiones con Origin: null.  {enc} = URL codificada · {raw} = URL tal cual. */
const CORS_PRESETS = [
  { name: 'cors.lol · rápido (recomendado)', tpl: 'https://api.cors.lol/?url={enc}' },
  { name: 'allorigins.win',                  tpl: 'https://api.allorigins.win/raw?url={enc}' },
  { name: 'codetabs.com',                    tpl: 'https://api.codetabs.com/v1/proxy?quest={enc}' },
  { name: 'cors.eu.org',                     tpl: 'https://cors.eu.org/{raw}' },
  { name: 'cors.workers.dev',                tpl: 'https://test.cors.workers.dev/?{raw}' },
];

const Net = {
  lastVia: '',               // 'direct' | 'local' | 'public' — transporte de la última llamada JSON

  /** Reescribe una URL externa a través del micro-proxy propio si está configurado. */
  proxied(url) {
    const p = (S.get('proxyBase') || '').replace(/\/+$/, '');
    if (!p) return url;
    const route = S.get('proxyRoute') || '/proxy';
    const prefix = p + route + '?url=';
    if (String(url).indexOf(prefix) === 0) return url;   // ya envuelta: no duplicar el proxy
    try { if (new URL(url, location.href).origin === location.origin) return url; } catch (_e) { /* url relativa */ }
    return p + route + '?url=' + encodeURIComponent(url);
  },
  /** Recupera la URL original de una que ya pasó por el proxy propio. */
  unwrap(url) {
    const u = String(url || '');
    const p = (S.get('proxyBase') || '').replace(/\/+$/, '');
    if (p) {
      const prefix = p + (S.get('proxyRoute') || '/proxy') + '?url=';
      if (u.indexOf(prefix) === 0) {
        try { return decodeURIComponent(u.slice(prefix.length)) || u; } catch (_e) { /* plantilla rara */ }
      }
    }
    return u;
  },
  isProxied() { return !!(S.get('proxyBase') || '').trim(); },

  /* --- Proxies CORS públicos (sin instalar nada) --- */
  applyTpl(tpl, url) {
    const enc = encodeURIComponent(url);
    if (tpl.indexOf('{enc}') >= 0) return tpl.replace('{enc}', enc);
    if (tpl.indexOf('{raw}') >= 0) return tpl.replace('{raw}', url);
    return tpl + enc;
  },
  publicOn() { return !!(S.get('corsTpl') || '').trim(); },
  publicWrap(url) {
    const tpl = (S.get('corsTpl') || '').trim();
    return tpl ? this.applyTpl(tpl, url) : url;
  },
  /** Envuelve por el proxy público solo una vez (evita proxy de proxy). */
  wrapOnce(url) {
    const w = this.publicWrap(url);
    if (w === url) return url;
    try {
      if (new URL(w, location.href).origin === new URL(url, location.href).origin) return url;
    } catch (_e) { /* URL rara */ }
    return w;
  },
  /** Cadena a probar: el elegido primero y después toda la lista de prefijados. */
  chain() {
    const chosen = (S.get('corsTpl') || '').trim();
    const out = chosen ? [chosen] : [];
    for (const p of CORS_PRESETS) if (out.indexOf(p.tpl) < 0) out.push(p.tpl);
    return out;
  },
  /** URL para vídeo progresivo (mp4): el <video> nativo no sufre CORS; solo evita contenido mixto. */
  streamFile(url) {
    if (this.isProxied()) return this.proxied(url);
    if (location.protocol === 'https:' && /^http:/i.test(url) && this.publicOn() && S.get('corsMode') !== 'off') return this.wrapOnce(url);
    return url;
  },
  /** URL del manifiesto HLS para el reproductor nativo (Safari/WebKit). */
  streamSrc(url) {
    if (this.isProxied()) return this.proxied(url);
    if (this.publicOn() && S.get('corsMode') !== 'off') return this.wrapOnce(url);
    return url;
  },
  /** Clase loader de hls.js que envuelve TODAS las peticiones (manifiesto, niveles, segmentos, claves)
   *  y REESCRIBE los manifiestos: los servidores Xtream suelen devolver rutas de segmento
   *  RELATIVAS, que hls.js resolvería contra la URL del proxy (404). Aquí cada URI del m3u8
   *  se convierte en absoluta contra el servidor original y se envuelve por el proxy. */
  hlsProxyLoader(wrapFn) {
    const Base = window.Hls && window.Hls.DefaultConfig && window.Hls.DefaultConfig.loader;
    if (!Base) return null;
    const self = this;
    const wrap = wrapFn || (u => self.wrapOnce(u));
    const rewriteM3U = (text, base) => {
      if (!text || text.indexOf('#EXTM3U') < 0) return text;
      const abs = u => {
        u = String(u || '').trim();
        if (!u || /^(data:|blob:)/i.test(u)) return u;
        try { return wrap(new URL(u, base).href) || u; } catch (_e) { return u; }
      };
      return text.split(/\r?\n/).map(ln => {
        if (!ln) return ln;
        if (ln.charAt(0) === '#') return ln.replace(/URI="([^"]*)"/g, (m2, u) => 'URI="' + abs(u) + '"');
        return abs(ln);
      }).join('\n');
    };
    return class ProxyLoader extends Base {
      load(context, config, callbacks) {
        try {
          const u = String(context.url || '');
          if (!u) { super.load(context, config, callbacks); return; }
          const isPlaylist = context.type === 'manifest' || context.type === 'level';
          if (isPlaylist && !callbacks.__djrw) {
            callbacks.__djrw = true;
            const base = self.unwrap(u);          // URL original en el servidor IPTV
            const origOk = callbacks.onSuccess;
            callbacks.onSuccess = (resp, stats, ctx2, net) => {
              try {
                const txt = typeof resp.data === 'string' ? resp.data : '';
                if (txt.indexOf('#EXTM3U') >= 0) {
                  resp.data = rewriteM3U(txt, base);
                  resp.url = base;                // futuras resoluciones usan el servidor real
                }
              } catch (_e) { /* deja el texto tal cual */ }
              return origOk(resp, stats, ctx2, net);
            };
          }
          context.url = wrap(u) || u;
        } catch (_e) { /* deja la URL tal cual */ }
        super.load(context, config, callbacks);
      }
    };
  },
  /** URL para descargas (fetch con lectura por trozos). */
  downloadUrl(url) {
    if (this.isProxied()) return this.proxied(url);
    if (this.publicOn() && S.get('corsMode') !== 'off') return this.wrapOnce(url);
    return url;
  },

  /** Comprueba una ruta /cors-check concreta (firma DJ-IPTV). */
  async _probe(base, check, timeout = 1800) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout);
    try {
      const r = await fetch(base.replace(/\/+$/, '') + check, { signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) return false;
      const j = await r.json().catch(() => null);
      return !!(j && j.ok && j.proxy === 'DJ-IPTV');
    } catch (_e) { return false; }
    finally { clearTimeout(t); }
  },

  /** Detecta sin configuración un proxy en el mismo origen (hosting con función
   *  proxy) o en la URL vía #proxy=…  Devuelve true si encontró y guardó uno. */
  async autoDetectProxy() {
    let fromHash = '';
    try {
      const m = /(?:^|[#&])proxy=([^&]+)/.exec(location.hash || '');
      if (m) fromHash = decodeURIComponent(m[1]).replace(/\/+$/, '');
    } catch (_e) { /* hash raro */ }
    const already = (S.get('proxyBase') || '').replace(/\/+$/, '');
    const bases = [];
    if (fromHash) bases.push(fromHash);
    if (already) bases.push(already);
    if (location.protocol.indexOf('http') === 0 && bases.indexOf(location.origin) < 0) bases.push(location.origin);
    const routes = [
      { proxy: '/api/proxy', check: '/api/cors-check' },
      { proxy: '/proxy', check: '/cors-check' },
    ];
    for (const b of bases) {
      for (const r of routes) {
        if (await this._probe(b, r.check)) {
          const changed = b !== already || r.proxy !== S.get('proxyRoute');
          S.set('proxyBase', b);
          S.set('proxyRoute', r.proxy);
          return changed || true;
        }
      }
    }
    return false;
  },

  /* --- Motor de peticiones con reserva automática --- */
  _isNetErr(e) {
    if (e && e.__net) return true;
    return /Failed to fetch|NetworkError|Load failed|CORS/i.test(String((e && e.message) || e));
  },
  _blockErr(prev) {
    const e = new Error('Sin conexión: el navegador bloqueó el acceso directo (CORS) y los proxies públicos tampoco respondieron. Comprueba que el servidor IPTV está activo y la URL es correcta; reintenta en un minuto o prueba otro proxy en Ajustes → Red.');
    e.__net = true; e.__prev = prev || null;
    return e;
  },
  /** Un intento fetch→JSON. Marca e.__net si el fallo es de red/CORS y e.__status si hubo respuesta HTTP. */
  async _once(finalUrl, timeout) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout);
    try {
      const r = await fetch(finalUrl, { signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) {
        let detail = '';
        try { detail = (await r.text()).slice(0, 140).trim(); } catch (_e) { /* sin cuerpo */ }
        const err = new Error((detail && detail.charAt(0) !== '<') ? 'HTTP ' + r.status + ' · ' + detail : 'HTTP ' + r.status);
        err.__status = r.status;
        throw err;
      }
      return await r.json();
    } catch (e) {
      if (e && e.name === 'AbortError') {
        const err = new Error('El servidor tardó demasiado en responder');
        err.__timeout = true;
        throw err;
      }
      if (!(e && e.__status)) {
        const err = (e instanceof Error) ? e : new Error(String(e));
        err.__net = true;
        throw err;
      }
      throw e;
    } finally { clearTimeout(t); }
  },
  /** Un intento fetch→texto con PROGRESO (listas M3U de hasta decenas de MB).
   *  Mismo control de errores que _once; onBytes(recibidos, total) si se puede medir. */
  async _onceText(finalUrl, timeout, onBytes) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout);
    try {
      const r = await fetch(finalUrl, { signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) {
        const err = new Error('HTTP ' + r.status);
        err.__status = r.status;
        throw err;
      }
      if (!onBytes || !r.body || !r.body.getReader) return await r.text();
      const total = Number(r.headers.get('content-length')) || 0;
      const reader = r.body.getReader();
      const chunks = [];
      let recv = 0;
      for (;;) {
        const rd = await reader.read();
        if (rd.done) break;
        chunks.push(rd.value);
        recv += rd.value.byteLength;
        try { onBytes(recv, total); } catch (_e) { /* el progreso no debe cortar nada */ }
      }
      const blob = new Blob(chunks);
      try { return await blob.text(); }
      catch (_e2) { return new TextDecoder('utf-8').decode(await blob.arrayBuffer()); }
    } catch (e) {
      if (e && e.name === 'AbortError') {
        const err = new Error('El servidor tardó demasiado en responder');
        err.__timeout = true;
        throw err;
      }
      if (!(e && e.__status)) {
        const err = (e instanceof Error) ? e : new Error(String(e));
        err.__net = true;
        throw err;
      }
      throw e;
    } finally { clearTimeout(t); }
  },
  /** fetch TEXTO con cadena de reserva completa: proxy propio → proxy público →
   *  directo → resto de proxies públicos. A diferencia de json(), aquí cada ruta
   *  se intenta aunque la anterior devolviera un HTTP de error: muchos paneles
   *  IPTV devuelven 403 a las IPs de la nube (Cloudflare) pero sirven bien al
   *  navegador del usuario, y las listas M3U son demasiado grandes para los
   *  proxies públicos, así que conviene intentarlo todo. */
  async text(url, timeout = 15000, onStep, onBytes) {
    const mode = S.get('corsMode') || 'auto';
    const routes = [];
    if (this.isProxied()) routes.push({ via: 'local', build: u => this.proxied(u), step: 'conexión por el proxy…' });
    if (mode === 'always' && this.publicOn()) routes.push({ via: 'public', build: u => this.publicWrap(u), to: Math.max(timeout, 30000), step: 'conexión por proxy público…' });
    if (mode !== 'off') {
      routes.push({ via: 'direct', build: u => u, step: 'conexión directa…' });
      if (mode !== 'always') {
        const tpls = this.chain();
        for (let i = 0; i < tpls.length; i++) {
          const tpl = tpls[i];
          routes.push({ via: 'public', build: u => this.applyTpl(tpl, u), tpl: tpl, to: Math.max(timeout, 30000), step: 'proxy público ' + (i + 1) + '/' + tpls.length + '…' });
        }
      }
    } else {
      routes.push({ via: 'direct', build: u => u, step: 'conexión directa…' });
    }
    let firstErr = null;
    for (let i = 0; i < routes.length; i++) {
      const r = routes[i];
      try {
        if (onStep) onStep(r.step || 'conectando…');
        const d = await this._onceText(r.build(url), r.to || timeout, onBytes);
        this.lastVia = r.via;
        if (r.tpl && S.get('corsTpl') !== r.tpl) S.set('corsTpl', r.tpl);
        return d;
      } catch (e) {
        if (!firstErr) firstErr = e;
        if (e && e.__timeout) throw e;          // sin tiempo en esta ruta: no insistir
        continue;                                // 403/5xx/red: prueba la siguiente ruta
      }
    }
    if (firstErr && firstErr.__status) throw firstErr;   // el HTTP de la 1ª ruta dice más que un «bloqueado» genérico
    throw this._blockErr(firstErr);
  },
  /** fetch JSON con reserva: directo → proxies públicos (o micro-proxy propio). */
  async json(url, timeout = 15000, onStep) {
    const mode = S.get('corsMode') || 'auto';
    if (this.isProxied()) {                                   // 1) proxy propio (hosting / .bat)
      const d = await this._once(this.proxied(url), timeout);
      this.lastVia = 'local'; return d;
    }
    if (mode === 'always' && this.publicOn()) {               // 2) siempre proxy público
      const d = await this._once(this.publicWrap(url), Math.max(timeout, 20000));
      this.lastVia = 'public'; return d;
    }
    if (mode === 'off') {                                     // 3) solo directo
      const d = await this._once(url, timeout);
      this.lastVia = 'direct'; return d;
    }
    try {                                                     // 4) automático
      if (onStep) onStep('conexión directa…');
      const d = await this._once(url, timeout);
      this.lastVia = 'direct'; return d;
    } catch (e) {
      if (!this._isNetErr(e)) throw e;      // HTTP 401/403/5xx: el servidor SÍ respondió
      const tpls = this.chain();
      let last = e;
      for (let i = 0; i < tpls.length; i++) {
        if (onStep) onStep('proxy público ' + (i + 1) + '/' + tpls.length + '…');
        try {
          const d = await this._once(this.applyTpl(tpls[i], url), Math.max(timeout, 20000));
          if (S.get('corsTpl') !== tpls[i]) S.set('corsTpl', tpls[i]);   // recordamos el que funciona
          this.lastVia = 'public'; return d;
        } catch (e2) { last = e2; }
      }
      throw this._blockErr(last);
    }
  },
  /** Test del panel Ajustes → Red: prueba directo + cada proxy público y guarda el primero OK. */
  async testChain(log) {
    const target = 'https://example.com';
    const rows = [['Directo', target]];
    for (const tpl of this.chain()) {
      const host = (tpl.split('/')[2] || 'proxy');
      rows.push([host, this.applyTpl(tpl, target)]);
    }
    let okTpl = '';
    for (const row of rows) {
      const t0 = performance.now();
      try {
        await this._once(row[1], 12000);
        log(row[0] + ': OK (' + Math.round(performance.now() - t0) + ' ms)', true);
        if (!okTpl && row[0] !== 'Directo') {
          for (const p of CORS_PRESETS) if ((p.tpl.split('/')[2] || '') === row[0] && !okTpl) okTpl = p.tpl;
        }
      } catch (e) {

/* ---------- Cliente Xtream Codes (Fase 1) ---------- */
class XtreamClient {
  /** @param {{host:string,port:string|number,username:string,password:string}} acc */
  constructor(acc) {
    this.base = XtreamClient.normalizeBase(acc.host, acc.port);
    this.u = encodeURIComponent(acc.username || '');
    this.p = encodeURIComponent(acc.password || '');
  }
  static normalizeBase(host, port) {
    let h = String(host || '').trim().replace(/\/+$/, '');
    if (!h) return '';
    if (!/^https?:\/\//i.test(h)) h = 'http://' + h;
    if (port && !/:\d+$/.test(h)) h += ':' + Number(port);
    return h;
  }
  /** Construye URL de player_api.php con acción y parámetros. */
  api(action, params) {
    let url = `${this.base}/player_api.php?username=${this.u}&password=${this.p}`;
    if (action) url += `&action=${action}`;
    if (params) for (const [k, v] of Object.entries(params)) url += `&${k}=${encodeURIComponent(v)}`;
    return url;
  }
  authUrl() { return this.api(); }
  /** Handshake: devuelve {user_info, server_info}. */
  async authenticate(onStep) {
    const d = await Net.json(this.authUrl(), 15000, onStep);
    if (!d || !d.user_info) throw new Error('El servidor no devolvió información de usuario');
    if (Number(d.user_info.auth) !== 1) throw new Error('Credenciales inválidas (usuario o contraseña incorrectos)');
    return d;
  }
  getLiveCategories() { return Net.json(this.api('get_live_categories'), 20000); }
  getLiveStreams(catId) { return Net.json(this.api('get_live_streams', catId ? { category_id: catId } : null), 20000); }
  getVodCategories() { return Net.json(this.api('get_vod_categories'), 20000); }
  getVodStreams(catId) { return Net.json(this.api('get_vod_streams', catId ? { category_id: catId } : null), 25000); }
  getSeriesCategories() { return Net.json(this.api('get_series_categories'), 20000); }
  /** Listado de series: margen de 35 s (suele ser el JSON más grande de todo el panel). */
  getSeries(catId, timeout) { return Net.json(this.api('get_series', catId ? { category_id: catId } : null), timeout || 35000); }
  /** Información de serie: 2 intentos a 35 s (algunos paneles tardan o fallan a la primera). */
  async getSeriesInfo(seriesId) {
    const url = this.api('get_series_info', { series_id: seriesId });
    let last = null;
    for (let i = 0; i < 2; i++) {
      try { return await Net.json(url, 35000); } catch (e) { last = e; }
    }
    throw last;
  }
  /** Información de película: 2 intentos con más margen. */
  async getVodInfo(vodId) {
    const url = this.api('get_vod_info', { vod_id: vodId });
    let last = null;
    for (let i = 0; i < 2; i++) {
      try { return await Net.json(url, 35000); } catch (e) { last = e; }
    }
    throw last;
  }
  /** EPG corto: programa actual y siguientes. */
  async getShortEPG(streamId, limit = 6) {
    const d = await Net.json(this.api('get_short_epg', { stream_id: streamId, limit }), 12000);
    return (d && d.epg_listings ? d.epg_listings : []).map(e => ({
      title: b64utf8(e.title),
      desc: b64utf8(e.description),
      start: Number(e.start_timestamp) || parseXtreamTime(e.start),
      end: Number(e.stop_timestamp) || parseXtreamTime(e.stop || e.end),
    })).filter(p => p.end > p.start && p.title);
  }
  /* --- Construcción dinámica de URLs de reproducción --- */
  liveUrl(streamId) { return `${this.base}/live/${this.u}/${this.p}/${streamId}.m3u8`; }
  movieUrl(streamId, ext) { return `${this.base}/movie/${this.u}/${this.p}/${streamId}.${ext || 'mp4'}`; }
  episodeUrl(episodeId, ext) { return `${this.base}/series/${this.u}/${this.p}/${episodeId}.${ext || 'mp4'}`; }
}

    const dayStart = Math.floor(new Date().setHours(0, 0, 0, 0) / 1000);
    let t = dayStart, k = 0, now = null, next = null;
    while (t < dayStart + 86400 + 7200) {
      const d = (durs[k % durs.length]) * 60;
      const start = t, end = t + d;
      const title = pool[(k + this.hash(chId)) % pool.length];
      if (!now && end > Date.now() / 1000 && start <= Date.now() / 1000) {
        now = { title, start, end, desc: `Emisión en ${ch ? ch.name : 'canal demo'} · bloque de ${Math.round(d / 60)} minutos con la mejor programación ${ch ? ch.cat.toLowerCase() : ''}.` };
      } else if (now && !next && start >= (Date.now() / 1000 | 0)) {
        next = { title, start, end, desc: 'A continuación en este canal.' };
        break;
      }
      t = end; k++;
    }
    return [now, next].filter(Boolean);
  },

  /** Señal de vídeo demo generada en canvas (captureStream), 100% local. */
  makeStream(label) {
    const cv = document.createElement('canvas');
    cv.width = 1280; cv.height = 720;
    const ctx = cv.getContext('2d');
    let raf = 0; const t0 = performance.now();
    const draw = () => {
      const t = (performance.now() - t0) / 1000;
      const h = (t * 10) % 360;
      const g = ctx.createLinearGradient(0, 0, 1280, 720);
      g.addColorStop(0, `hsl(${h},68%,13%)`);
      g.addColorStop(.5, `hsl(${(h + 55) % 360},72%,22%)`);
      g.addColorStop(1, `hsl(${(h + 130) % 360},66%,9%)`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, 1280, 720);
      for (let i = 0; i < 6; i++) {
        const x = (Math.sin(t * .5 + i * 1.7) * .5 + .5) * 1280;
        const y = (Math.cos(t * .35 + i * 1.1) * .5 + .5) * 720;
        ctx.beginPath(); ctx.arc(x, y, 80 + i * 26, 0, 7);
        ctx.fillStyle = `hsla(${(h + i * 42) % 360},80%,62%,.09)`; ctx.fill();
      }
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,.94)';
      ctx.font = '700 62px -apple-system,Segoe UI,Arial';
      ctx.fillText(label || 'DJ-IPTV · SEÑAL DEMO', 640, 345);
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.font = '500 28px -apple-system,Segoe UI,Arial';
      ctx.fillText('Demostración generada en local · ' + new Date().toLocaleTimeString('es'), 640, 402);
      ctx.fillStyle = 'rgba(255,69,58,.9)';
      ctx.beginPath(); ctx.arc(96, 88, 11, 0, 7); ctx.fill();
      ctx.font = '800 24px -apple-system,Segoe UI,Arial';
      ctx.textAlign = 'left'; ctx.fillText('DEMO', 118, 97);
      raf = requestAnimationFrame(draw);
    };
    draw();
    const stream = cv.captureStream(30);
    return { stream, stop() { cancelAnimationFrame(raf); stream.getTracks().forEach(tr => tr.stop()); } };
  },
};

 * DJ-IPTV · SESIÓN MULTICUENTA (Fases 1 y 4)
 * Cuentas · Caché por cuenta · Sesión de catálogo · EPG · Search

const Accounts = {
  list: [],
  activeId: null,

  async refresh() { this.list = await DB.all('accounts'); },

  get(id) { return this.list.find(a => a.id === id) || null; },
  active() { return this.get(this.activeId); },

  /** Prueba conexión y crea el perfil cifrado en IndexedDB. */
  async add({ alias, host, port, username, password, onStep }) {
    const probe = new XtreamClient({ host, port, username, password });
    const data = await probe.authenticate(onStep);
    const acc = {
      id: uid(),
      alias: (alias || username || 'Cuenta').slice(0, 40),
      host: String(host).trim(),
      port: String(port || '').trim(),
      username: String(username).trim(),
      passEnc: await Crypt.enc(password),
      hue: Math.floor(Math.random() * 360),
      expDate: data.user_info.exp_date || '',
      status: data.user_info.status || 'Active',
      maxConn: data.user_info.active_cons || '',
      createdAt: Date.now(),
      lastSync: Date.now(),
    };
    await DB.put('accounts', acc);
    this.list.push(acc);
    return acc;
  },

  async update(acc) {
    await DB.put('accounts', acc);
    const i = this.list.findIndex(a => a.id === acc.id);
    if (i >= 0) this.list[i] = acc;
    return acc;
  },

  async remove(id) {
    await DB.del('accounts', id);
    this.list = this.list.filter(a => a.id !== id);
    // Aislamiento de caché: elimina catálogos propios de la cuenta
    const stale = (await DB.all('cache')).filter(c => c.key.startsWith('acc:' + id + ':'));
    for (const c of stale) await DB.del('cache', c.key);
    if (this.activeId === id) {
      this.activeId = null;
      S.set('lastAccount', '');
      Session.reset();
      Topbar.renderAccounts();
      Router.refreshView();
    }
  },

  /** Descifra la contraseña para reconstruir el cliente API. */
  async passwordOf(acc) { return Crypt.dec(acc.passEnc); },

  /** Añade una cuenta «por URL» (playlist M3U): prueba la URL y la guarda cifrada.
   *  Las listas reales pesan decenas de MB (una m3u_plus típica: 40-60 MB), así
   *  que hay tiempo de sobra, progreso visible y respaldo de rutas en Net.text. */
  async addM3u({ alias, m3uUrl, onStep }) {
    const url = String(m3uUrl || '').trim();
    if (!/^https?:\/\//i.test(url)) throw new Error('La URL debe empezar por http:// o https://');
    if (onStep) onStep('leyendo lista M3U…');
    const onBytes = (recv, total) => {
      if (!onStep) return;
      const mb = x => (x / 1048576).toFixed(1);
      onStep(total ? 'descargando lista… ' + mb(recv) + ' / ' + mb(total) + ' MB' : 'descargando lista… ' + mb(recv) + ' MB');
    };
    const text = await Net.text(url, 150000, onStep, onBytes);
    const t = String(text || '');
    if (t.indexOf('#EXTM3U') < 0 && !/#EXTINF/i.test(t))
      throw new Error('Esa URL no devolvió una lista M3U válida (revisa la URL y que esté activa)');
    const n = (t.match(/#EXTINF/gi) || []).length;
    if (!n) throw new Error('La lista no contiene ningún elemento');
    const acc = {
      id: uid(),
      alias: (alias || 'Lista M3U').slice(0, 40),
      type: 'm3u',
      m3uEnc: await Crypt.enc(url),
      hue: Math.floor(Math.random() * 360),
      status: 'Active',
      createdAt: Date.now(),
      lastSync: Date.now(),
    };
    await DB.put('accounts', acc);
    this.list.push(acc);
    // La lista ya está descargada: la guardo cruda para que Session.load no la
    // vuelva a bajar (en listas de 50 MB eso es un minuto entero de espera).
    try { await CatCache.put('acc:' + acc.id + ':m3u1:raw', { text: t }); } catch (_e) { /* sin caché, no pasa nada */ }
    return acc;
  },

  /** Descifra la URL M3U para volver a descargar la lista. */
  async m3uUrlOf(acc) { return Crypt.dec(acc.m3uEnc); },
};

/* ---------- Caché de catálogos con TTL (por cuenta) ---------- */
const CatCache = {
  TTL: 6 * 3600 * 1000,
  async get(key) {
    try {
      const r = await DB.get('cache', key);
      if (r && (Date.now() - r.ts) < this.TTL) return r.data;
    } catch (_e) { /* IDB no disponible */ }
    return null;
  },
  async put(key, data) {
    try { await DB.put('cache', { key, data, ts: Date.now() }); } catch (_e) { /* cuota */ }
  },
  async dropAccount(accId) {
    const stale = (await DB.all('cache')).filter(c => c.key.startsWith('acc:' + accId + ':'));
    for (const c of stale) await DB.del('cache', c.key);
  },
  async clearAll() { await DB.clear('cache').catch(() => {}); },
};

/* ---------- Filtro de contenido adulto ----------
 * Oculta categorías cuyo nombre apunte a contenido para adultos
 * (adulto/adultos/xxx/porno/+18/erótico/...) y también los canales,
 * películas o episodios que pertenezcan a esas categorías. */
const ADULT_CAT_RE = new RegExp(
  '(^|[^a-z0-9])(adult[oa]?s?|adults|xxx+|pornograf[a-z]*|porn[oa]?s?|erotic[oa]?s?|sexo|sexy|sex ?shop|nsfw|milf|hentai|' +
  'brazzers|hustler|penthouse|playboy|onlyfans|para adultos|solo adultos|for adults|adults only|mayores de 18|\\+18|18\\+)' +
  '(?=[^a-z0-9]|$)', 'i');

/** Nombre normalizado (minúsculas y sin acentos) para comparar sin falsos negativos. */
function normFlat(s) {
  let t = String(s || '').toLowerCase();
  try { t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (_e) { /* motor viejo */ }
  return t;
}
function isAdultCatName(name) { return ADULT_CAT_RE.test(normFlat(name)); }

/** Devuelve {cats, items, hidden} sin categorías adultas ni su contenido.
 *  hidden = número de categorías eliminadas (los elementos de esas categorías van aparte). */
function filterAdultCatalog(cats, items) {
  const src = Array.isArray(cats) ? cats : [];
  const keep = [], bad = {};
  for (const c of src) {
    if (c && isAdultCatName(c.category_name)) bad[String(c.category_id)] = 1;
    else keep.push(c);
  }
  const list = Array.isArray(items) ? items : [];
  const nBad = Object.keys(bad).length;
  if (!nBad) return { cats: src, items: list, hidden: 0 };
  const okItems = [];
  for (const it of list) if (!bad[String(it && it.category_id)]) okItems.push(it);
  return { cats: keep, items: okItems, hidden: nBad };
}

/* ---------- Listas M3U (m3u_plus): parser y clasificación ----------
 * Convierte el texto de una lista .m3u en los mismos catálogos que la API
 * Xtream (TV en vivo / películas / series), para cuentas «por URL».
 * Clasificación por ruta del enlace:  /movie/  → película ·  /series/ → serie
 * (cada línea S01E02 se agrupa con su serie) · el resto → canal en vivo. */
const M3U_SE_RE = /(?:^|[^a-z0-9])s(\d{1,2})[\s._\-|]?e(\d{1,3})(?![a-z0-9])/i;   // S01E02 · s1e2
const M3U_X_RE  = /(?:^|[^a-z0-9])(\d{1,2})x(\d{2,3})(?![a-z0-9])/i;              // 1x02

function m3uTitle(line, attrs) {
  const q = line.lastIndexOf('"');
  const c = line.indexOf(',', q >= 0 ? q : 8);
  let t = c >= 0 ? line.slice(c + 1).trim() : '';
  if (!t) t = attrs.tvg_name || attrs.tvgname || '';
  return t || 'Sin nombre';
}

function m3uExt(url) {
  const m = String(url).match(/\.([a-z0-9]{2,5})(?:\?|#|$)/i);
  return m ? m[1].toLowerCase() : '';
}

function parseM3U(text) {
  const lines = String(text || '').split(/\r?\n/);
  const raw = [];
  let cur = null;
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i].trim();
    if (!ln) continue;
    if (/^#EXTM3U/i.test(ln)) continue;
    if (/^#EXTINF/i.test(ln)) {
      const attrs = {};
      try {
        const am = ln.match(/[a-zA-Z0-9_-]+="[^"]*"/g) || [];
        for (const a of am) { const j = a.indexOf('="'); attrs[a.slice(0, j).toLowerCase()] = a.slice(j + 2, -1); }
      } catch (_e) { /* línea sin atributos */ }
      cur = {
        name: m3uTitle(ln, attrs),
        logo: attrs.tvg_logo || attrs['tvg-logo'] || attrs.logo || '',
        group: attrs.group_title || attrs['group-title'] || '',
        url: '',
      };
      continue;
    }
    if (/^#EXTGRP/i.test(ln)) { if (cur) cur.group = ln.replace(/^#EXTGRP:?/i, '').trim() || cur.group; continue; }
    if (ln.charAt(0) === '#') continue;                    // otras directivas: se ignoran
    if (cur) { cur.url = ln; raw.push(cur); cur = null; }  // la línea tras EXTINF es el enlace
  }

  const liveCats = [], vodCats = [], seriesCats = [];
  const live = [], vod = [], series = [];
  const catIdx = {};
  const catId = (type, g) => {
    const name = g || 'Sin categoría';
    const k = type + '|' + name.toLowerCase();
    if (!catIdx[k]) {
      catIdx[k] = String(Object.keys(catIdx).length + 1);
      const arr = type === 'live' ? liveCats : type === 'vod' ? vodCats : seriesCats;
      arr.push({ category_id: catIdx[k], category_name: name });
    }
    return catIdx[k];
  };

  /* Clasificación. Además de las rutas clásicas Xtream (/movie/, /series/), hay
   * paneles que entregan enlaces tokenizados tipo /play/<código>#.mkv (o /play/
   * <código>/m3u8): ahí la ruta no dice nada, pero la pseudo-extensión sí — los
   * canales en directos van en HLS (.m3u8, .ts) y el resto son archivos de
   * vídeo (películas, y series si el nombre trae S01E02 / 1x02). */
  const M3U_VOD_EXT = { mp4: 1, m4v: 1, mkv: 1, avi: 1, mpg: 1, mpeg: 1, wmv: 1, flv: 1, mov: 1, webm: 1 };
  const M3U_LIVE_EXT = { ts: 1, m3u8: 1, mpd: 1 };
  const seriesMap = {};
  let id = 0;
  for (const it of raw) {
    id++;
    const u = it.url || '';
    const ext = m3uExt(u);
    const isSerPath = /\/series?\//i.test(u);
    const isVodPath = !isSerPath && /\/movie[s]?\/|\/videos?\//i.test(u);
    const fileVod = !!(M3U_VOD_EXT[ext] && !isVodPath);      // archivo de vídeo sin ruta clásica
    const nameSer = fileVod && (M3U_SE_RE.test(it.name) || M3U_X_RE.test(it.name));
    if (isSerPath || nameSer) {
      const mm = M3U_SE_RE.exec(it.name) || M3U_X_RE.exec(it.name);
      let base = it.name, season = 1, epnum = 0, eptitle = '';
      if (mm) {
        base = it.name.slice(0, mm.index);
        if (mm[3] != null) { season = Number(mm[3]) || 1; epnum = Number(mm[4]) || 0; }
        else { season = Number(mm[1]) || 1; epnum = Number(mm[2]) || 0; }
        eptitle = it.name.slice(mm.index + mm[0].length).replace(/^[\s\-_.·|:]+/, '');
      }
      base = base.replace(/[\s\-_.·|]+$/, '').trim() || it.name;
      const key = base.toLowerCase();
      if (!seriesMap[key]) {
        seriesMap[key] = true;
        series.push({
          series_id: id, name: base, cover: it.logo, stream_icon: it.logo,
          category_id: catId('series', it.group), plot: '', rating: 0, last_modified: 0,
          _m3uEps: [],
        });
      }
      const sItem = series[series.length - 1];
      sItem._m3uEps.push({
        id: 'e' + id, season: season, episode_num: epnum,
        title: eptitle || ('Episodio ' + (epnum || sItem._m3uEps.length)),
        url: u, container_extension: m3uExt(u) || 'mp4', info: {},
      });
    } else if (isVodPath || fileVod) {
      vod.push({
        stream_id: id, name: it.name, stream_icon: it.logo,
        category_id: catId('vod', it.group), container_extension: m3uExt(u) || 'mp4',
        url: u, rating: 0, added: 0,
      });
    } else {
      live.push({ stream_id: id, name: it.name, stream_icon: it.logo, category_id: catId('live', it.group), url: u });
    }
  }

  // Episodios: numerar los que quedaron en 0 y ordenar por temporada/episodio
  for (const s of series) {
    const by = {};
    for (const ep of s._m3uEps) (by[ep.season] = by[ep.season] || []).push(ep);
    const out = [];
    Object.keys(by).map(Number).sort((a, b) => a - b).forEach(sn => {
      const arr = by[sn];
      arr.sort((a, b) => (a.episode_num || 0) - (b.episode_num || 0) || String(a.title).localeCompare(String(b.title), 'es'));
      let n = 0;
      for (const ep of arr) { if (!ep.episode_num) { n++; ep.episode_num = n; } else n = ep.episode_num; out.push(ep); }
    });
    s._m3uEps = out;
  }
  return { liveCats, live, vodCats, vod, seriesCats, series };
}

/* ---------- Sesión: catálogo activo (cuenta real, M3U o demo) ---------- */
const Session = {
  ready: false,
  isDemo: false,
  account: null,
  client: null,          // XtreamClient activo (null en cuentas M3U)
  liveCats: [], live: [],
  vodCats: [],  vod: [],
  seriesCats: [], series: [],
  rev: 0,                // revisión: invalida las vistas al recargar

  reset() {
    this.ready = false; this.isDemo = false; this.account = null; this.client = null;
    this.liveCats = []; this.live = []; this.vodCats = []; this.vod = [];
    this.seriesCats = []; this.series = [];
    this.rev++;
    try { Edits.clearSource(); } catch (_e) { /* editor aún no listo */ }
    Search.buildIndex();
    emit('session:changed');
  },

  async load(accountId, force = false) {
    const acc = accountId === 'demo' ? { id: 'demo', alias: 'Modo Demo', isDemo: true, hue: 265 } : Accounts.get(accountId);
    if (!acc) return;
    this.account = acc;
    this.isDemo = !!acc.isDemo;
    this.activeIdSet(acc.id);
    Accounts.activeId = acc.id;
    S.set('lastAccount', acc.id);
    this.ready = false;
    this.rev++;
    emit('session:loading', acc);

    try {
      if (this.isDemo) await this._loadDemo();
      else if (acc.type === 'm3u') await this._loadM3u(acc, force);
      else await this._loadReal(acc, force);
      this.ready = true;
      this.rev++;
      Search.buildIndex();
      emit('session:changed', acc);
    } catch (e) {
      Toast.err('No se pudo cargar «' + acc.alias + '»: ' + Net.explain(e));
      emit('session:error', e);
    }
  },

  activeIdSet(id) { /* reservado para sincronías futuras */ },

  async _loadDemo() {
    this.client = null;
    // Demo + editor de listas: se guarda el origen y se aplican ocultos/renombrados
    const dSets = [
      ['live', DemoData.liveCats(), DemoData.liveView()],
      ['vod', DemoData.moviesCats(), DemoData.moviesView()],
      ['series', DemoData.seriesCats(), DemoData.seriesView()],
    ];
    for (const [t, cs, its] of dSets) {
      const f = Edits.filter(t, cs, its);
      Edits.setSource(t, cs, its);
      if (t === 'live') { this.liveCats = f.cats; this.live = f.items; }
      else if (t === 'vod') { this.vodCats = f.cats; this.vod = f.items; }
      else { this.seriesCats = f.cats; this.series = f.items; }
    }
    await new Promise(r => setTimeout(r, 260)); // deja ver el estado de carga
  },

  /** Aplica control parental + editor de listas a un catálogo y recuerda la
   *  fuente SIN filtrar adulto (el control parental puede desactivarse luego
   *  en Ajustes y las categorías reaparecen sin re-descargar nada). */
  _applyCatalog(type, cats, items) {
    const parental = S.get('parental') !== false;
    const fa = parental ? filterAdultCatalog(cats, items) : { cats: cats, items: items, hidden: 0 };
    Edits.setSource(type, cats, items);                 // fuente original para re-aplicar
    const f = Edits.filter(type, fa.cats, fa.items);    // ocultos/renombrados del editor
    if (type === 'live') { this.liveCats = f.cats; this.live = f.items; }
    else if (type === 'vod') { this.vodCats = f.cats; this.vod = f.items; }
    else { this.seriesCats = f.cats; this.series = f.items; }
    return fa.hidden;
  },

  /** Re-aplica los filtros (control parental / editor) sobre la sesión activa
   *  y refresca la vista actual. Instantáneo: no vuelve a tocar la red. */
  applyCatalogs() {
    if (!this.ready) return;
    for (const t of ['live', 'vod', 'series']) {
      const s = Edits._src[t];
      if (s) this._applyCatalog(t, s.cats, s.items);
    }
    this.rev++;
    try { Search.buildIndex(); } catch (_e) { /* sin índice, la app sigue */ }
    try { if (Router.current && Router.RENDER[Router.current]) Router.RENDER[Router.current](); } catch (_e) { /* vista en carga */ }
  },

  /** Carga de cuentas «por URL» (playlist M3U / m3u_plus): descarga la lista,
   *  la parsea y clasifica en los mismos catálogos que la API Xtream.
   *  En caché se guarda el TEXTO crudo (no los 145.000 objetos parseados): ocupa
   *  4 veces menos en IndexedDB, nunca revienta la cuota y además permite que
   *  las mejoras del parser se apliquen a la lista ya descargada. */
  async _loadM3u(acc, force) {
    this.client = null;
    const base = 'acc:' + acc.id + ':m3u1:';
    let data = null;
    if (!force) {
      const raw = await CatCache.get(base + 'raw');
      if (raw && raw.text) {
        const t = String(raw.text);
        if (t.indexOf('#EXTM3U') >= 0 || /#EXTINF/i.test(t)) data = parseM3U(t);
      }
    }
    if (!data) {
      let url = '';
      try { url = (await Accounts.m3uUrlOf(acc)) || ''; } catch (_e) { url = ''; }
      if (!url) throw new Error('No se pudo descifrar la URL de la lista M3U');
      const text = await Net.text(url, 150000);
      const t = String(text || '');
      if (t.indexOf('#EXTM3U') < 0 && !/#EXTINF/i.test(t))
        throw new Error('La URL no devolvió una playlist M3U válida (revisa la URL y tu suscripción)');
      try { await CatCache.put(base + 'raw', { text: t }); } catch (_e) { /* cuota: se re-descarga la próxima */ }
      data = parseM3U(t);
    }
    let hidden = 0;
    const put = (type, cats, items) => {
      hidden += this._applyCatalog(type, cats, items);
    };
    put('live', data.liveCats, data.live);
    put('vod', data.vodCats, data.vod);
    put('series', data.seriesCats, data.series);
    if (hidden && !this._adultToastShown) {
      this._adultToastShown = true;
      Toast.info('Contenido adulto oculto (' + hidden + (hidden === 1 ? ' categoría).' : ' categorías).'));
    }
    acc.lastSync = Date.now();
    Accounts.update(acc);
  },

  async _loadReal(acc, force) {
    const pass = await Accounts.passwordOf(acc);
    if (!pass && pass !== '') throw new Error('No se pudo descifrar la contraseña de esta cuenta');
    const cli = new XtreamClient({ ...acc, password: pass });
    // Validación rápida (y renovación de estado/expiración)
    const auth = await cli.authenticate().catch(e => { throw e; });
    acc.status = auth.user_info.status || acc.status;
    acc.expDate = auth.user_info.exp_date || acc.expDate;
    Accounts.update(acc);
    this.client = cli;

    const base = 'acc:' + acc.id + ':v2:';   // v2: ignora cachés viejas que pudieron guardar catálogos vacíos
    const jobs = [
      ['live',   () => cli.getLiveCategories(), () => cli.getLiveStreams()],
      ['vod',    () => cli.getVodCategories(),  () => cli.getVodStreams()],
      ['series', () => cli.getSeriesCategories(), () => this._loadSeriesResilient(cli)],
    ];
    let firstPaint = false;
    for (const [type, catFn, itemsFn] of jobs) {
      const ck = base + type;
      let cats = force ? null : await CatCache.get(ck + ':cats');
      let items = force ? null : await CatCache.get(ck + ':items');
      // items vacío con categorías presentes = caché envenenada: se vuelve a pedir
      const staleEmpty = !!(cats && cats.length && items && !items.length);
      if (!cats || !items || staleEmpty) {
        try {
          [cats, items] = await Promise.all([catFn(), itemsFn()]);
          cats = Array.isArray(cats) ? cats : [];
          items = Array.isArray(items) ? items : [];
          if (items.length || cats.length) {      // no guardar vacíos: impediría recuperarse
            await CatCache.put(ck + ':cats', cats);
            await CatCache.put(ck + ':items', items);
          }
        } catch (e) {
          if (!firstPaint) throw e;              // sin datos locales ni red: aborta
          Toast.err('Catálogo «' + type + '»: ' + Net.explain(e));
          cats = cats || []; items = items || [];
        }
      }
      // Control parental + editor de listas sobre el catálogo recién cargado.
      const hid = this._applyCatalog(type, cats, items);
      if (hid && !this._adultToastShown) {
        this._adultToastShown = true;
        Toast.info('Contenido adulto oculto (' + hid + (hid === 1 ? ' categoría).' : ' categorías).'));
      }
      if (!firstPaint) { firstPaint = true; this.ready = true; this.rev++; emit('session:partial', acc); }
    }
    acc.lastSync = Date.now();
    Accounts.update(acc);
  },

  /** Catálogo de series a prueba de fallos:
   *  1) listado completo (35 s); 2) si falla o llega vacío, se pide categoría por categoría
   *  (muchos paneles se rompen o cortan la respuesta del listado completo). */
  async _loadSeriesResilient(cli) {
    let full = null, fullErr = null;
    try { full = await cli.getSeries(null); } catch (e) { fullErr = e; }
    if (Array.isArray(full) && full.length) return full;
    let cats = [];
    try { cats = await cli.getSeriesCategories(); } catch (_e) { cats = []; }
    cats = Array.isArray(cats) ? cats : [];
    if (!cats.length) { if (fullErr) throw fullErr; return Array.isArray(full) ? full : []; }
    const seen = {}, out = [];
    let ok = 0, bad = 0, firstErr = null;
    const queue = cats.slice();
    const worker = async () => {
      while (queue.length) {
        const c = queue.shift();
        try {
          const arr = await cli.getSeries(c.category_id, 20000);
          ok++;
          for (const s of (Array.isArray(arr) ? arr : [])) {
            const k = String(s && s.series_id);
            if (k && !seen[k]) { seen[k] = 1; out.push(s); }
          }
        } catch (e) { bad++; if (!firstErr) firstErr = e; }
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    if (!out.length) {
      if (fullErr) throw fullErr;                 // el completo también falló: ese es el error real
      if (firstErr && !ok) throw firstErr;        // todas las categorías fallaron
    } else if (bad) {
      Toast.info('Series: ' + out.length.toLocaleString('es') + ' cargadas (' + bad + ' categorías no respondieron). Usa «Recargar catálogo» para reintentar.');
    }
    return out;
  },

  catName(type, catId) {
    const arr = type === 'live' ? this.liveCats : type === 'vod' ? this.vodCats : this.seriesCats;
    const c = arr.find(x => String(x.category_id) === String(catId));
    return c ? c.category_name : '';
  },
  vodUrl(item) {
    if (item.demo) return null; // la demo reproduce su señal sintética
    if (item.url) return item.url;   // cuentas M3U: enlace directo de la lista
    return this.client.movieUrl(item.stream_id, item.container_extension || 'mp4');
  },
  liveUrl(item) {
    if (item.demo) return null;
    if (item.url) return item.url;   // cuentas M3U: enlace directo de la lista
    return this.client.liveUrl(item.stream_id);
  },
};

/* ---------- EPG: ahora + siguiente, cola con concurrencia limitada ---------- */
const EPG = {
  mem: new Map(),                       // streamId → {list, ts}
  TTL: 4 * 60 * 1000,
  inflight: new Map(),
  queue: [], running: 0, MAX: 4,
  listeners: new Map(),

  getCached(id) {
    const c = this.mem.get(id);
    if (c && (Date.now() - c.ts) < this.TTL) return c.list;
    return null;
  },
  /** Pide EPG y notifica cuando llega (una sola petición por canal). */
  ensure(id, cb) {
    const cached = this.getCached(id);
    if (cached) { cb(cached); return; }
    if (!this.listeners.has(id)) this.listeners.set(id, new Set());
    this.listeners.get(id).add(cb);
    if (this.inflight.has(id) || this.queue.includes(id)) return;
    this.queue.push(id);
    this._pump();
  },
  async _pump() {
    while (this.running < this.MAX && this.queue.length) {
      const id = this.queue.shift();
      this.running++;
      this.inflight.set(id, true);
      this._fetch(id).finally(() => {
        this.running--;
        this.inflight.delete(id);
        this._pump();
      });
    }
  },
  async _fetch(id) {
    let list = null;
    try {
      if (Session.isDemo) list = DemoData.epgFor(id);
      else if (Session.client) list = await Session.client.getShortEPG(id, 6);
    } catch (_e) { list = null; }
    if (list && list.length) this.mem.set(id, { list, ts: Date.now() });
    const subs = this.listeners.get(id);
    if (subs) {
      const val = list && list.length ? list : [];
      subs.forEach(cb => { try { cb(val); } catch (_e) { /* noop */ } });
      this.listeners.delete(id);
    }
  },
  now(list) {
    const t = Date.now() / 1000;
    const now = list.find(p => p.start <= t && p.end > t);
    const next = list.find(p => p.start > (now ? now.start : t));
    return { now, next };
  },
};

/* ---------- Buscador global en memoria (<10 ms, ignora acentos) ---------- */
const Search = {
  index: [],
  /** Minusculas + sin diacríticos: «neón» == «neon». */
  norm(s) {
    try { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
    catch (_e) { return String(s).toLowerCase(); }
  },
  buildIndex() {
    const ix = [];
    for (const c of Session.live) ix.push({ t: 'live', id: c.stream_id, name: c.name, low: this.norm(c.name), icon: c.stream_icon, cat: Session.catName('live', c.category_id) });
    for (const m of Session.vod) ix.push({ t: 'vod', id: m.stream_id, name: m.name, low: this.norm(m.name), icon: m.stream_icon, cat: Session.catName('vod', m.category_id) });
    for (const s of Session.series) ix.push({ t: 'series', id: s.series_id, name: s.name, low: this.norm(s.name), icon: s.cover, cat: Session.catName('series', s.category_id) });
    this.index = ix;
  },
  run(q, limit = 40) {
    q = this.norm(q.trim());
    if (!q) return null;
    const out = { live: [], vod: [], series: [] };
    const starts = [], incl = [];
    for (const it of this.index) {
      if (it.low.startsWith(q)) starts.push(it);
      else if (it.low.includes(q)) incl.push(it);
    }
    for (const it of [...starts, ...incl]) {
      if (out[it.t].length >= limit) continue;
      out[it.t].push(it);
    }
    return out;
  },
};

/* ---------- Focus Engine estilo tvOS (ratón + teclado D-Pad) ---------- */
const Focus = {
  stack: [],
  current: null,
  get root() { return this.stack[this.stack.length - 1] || $('#main'); },
  push(root) { this.stack.push(root); },
  pop(root) {
    const i = this.stack.lastIndexOf(root);
    if (i >= 0) this.stack.splice(i, 1);
  },
  clearToMain() { this.stack.length = 0; this.set(null); },
  candidates() {
    return $$('[data-focus]', this.root).filter(e =>
      !e.disabled && e.offsetParent !== null && !e.closest('[hidden]'));
  },
  set(elm) {
    if (this.current) this.current.classList.remove('focused');
    this.current = elm || null;
    if (!elm) return;
    elm.classList.add('focused');
    try {
      elm.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: S.get('reduceMotion') ? 'auto' : 'smooth' });
    } catch (_e) { /* navegadores antiguos */ }
  },
  focusFirst() {
    const c = this.candidates();
    this.set(c.find(e => e.dataset.autofocus != null) || c[0] || null);
  },
  /** Navegación espacial: elige el candidato mejor posicionado en la dirección indicada. */
  move(dx, dy) {
    const cur = this.current;
    const cands = this.candidates();
    if (!cands.length) return;
    if (!cur || !cur.isConnected) { this.set(cands[0]); return; }
    const r = cur.getBoundingClientRect();
    let best = null, bestScore = Infinity;
    for (const n of cands) {
      if (n === cur) continue;
      const r2 = n.getBoundingClientRect();
      if (dx > 0 && r2.left < r.right - 6) continue;
      if (dx < 0 && r2.right > r.left + 6) continue;
      if (dy > 0 && r2.top < r.bottom - 6) continue;
      if (dy < 0 && r2.bottom > r.top + 6) continue;
      const overlap = dx !== 0
        ? Math.min(r.bottom, r2.bottom) - Math.max(r.top, r2.top)
        : Math.min(r.right, r2.right) - Math.max(r.left, r2.left);
      const O = Math.max(0, overlap);
      const dist = dx !== 0 ? Math.abs((r2.left + r2.width / 2) - (r.left + r.width / 2))
                            : Math.abs((r2.top + r2.height / 2) - (r.top + r.height / 2));
      const cross = dx !== 0 ? Math.abs((r2.top + r2.height / 2) - (r.top + r.height / 2))
                             : Math.abs((r2.left + r2.width / 2) - (r.left + r.width / 2));
      const score = dist + cross * 1.6 - O * .5;
      if (score < bestScore) { bestScore = score; best = n; }
    }
    if (best) this.set(best);
  },
};

/* ---------- Menús desplegables glass ---------- */
const Menus = {
  open: [],
  anyOpen() { return this.open.length > 0; },
  closeAll() { [...this.open].forEach(m => m.close()); },
};
function openDropdown(anchor, items, opts = {}) {
  Menus.closeAll();
  const menu = el('div', { class: 'menu' + (opts.up ? ' up' : ''), role: 'menu' });
  for (const it of items) {
    if (it === 'sep') { menu.append(el('div', { class: 'menu-sep' })); continue; }
    const b = el('button', {
      class: 'menu-item' + (it.danger ? ' danger' : ''), 'data-focus': '', role: 'menuitem',
      onclick: () => { m.close(); it.onClick && it.onClick(); },
    });
    b.innerHTML = (it.icon ? I(it.icon, 19) : '') +
      '<span class="grow">' + esc(it.label) + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</span>' +
      (it.check ? I('check', 17, 'style="color:var(--accent)"') : '');
    menu.append(b);
  }
  const holder = anchor.closest('.acc-wrap') || anchor.parentElement;
  const fixed = !holder || holder === document.body;
  if (fixed) { menu.style.position = 'fixed'; const r = anchor.getBoundingClientRect(); menu.style.top = (r.bottom + 10) + 'px'; menu.style.right = (innerWidth - r.right) + 'px'; }
  (holder || document.body).append(menu);

  const onOut = e => { if (!menu.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) m.close(); };
  const m = {
    el: menu,
    close() {
      if (!menu.isConnected) return;
      menu.remove();
      document.removeEventListener('pointerdown', onOut, true);
      Focus.pop(menu);
      Menus.open = Menus.open.filter(x => x !== m);
      Focus.set(anchor);
    },
  };
  document.addEventListener('pointerdown', onOut, true);
  Menus.open.push(m);
  Focus.push(menu);
  requestAnimationFrame(() => Focus.focusFirst());
  return m;
}

/* ---------- Gestor de modales (capas apilables) ---------- */
const Modal = {
  stack: [],
  count() { return this.stack.length; },
  top() { return this.stack[this.stack.length - 1] || null; },
  open(builder) {
    const veil = el('div', { class: 'modal-veil' });
    const m = {
      veil,
      closed: false,
      close() {
        if (this.closed) return;
        this.closed = true;
        veil.remove();
        Modal.stack = Modal.stack.filter(x => x !== m);
        Focus.pop(veil);
        const prev = Modal.top();
        if (prev) Focus.focusFirst();
        else Focus.set(Topbar.lastTrigger && Topbar.lastTrigger.isConnected ? Topbar.lastTrigger : null) || Focus.focusFirst();
      },
    };
    veil.addEventListener('pointerdown', e => { if (e.target === veil) m.close(); });
    let panel = null;
    try { panel = builder(veil, m); }
    catch (e) {
      panel = el('div', { class: 'modal slim' },
        el('div', { class: 'confirm-body' },
          el('div', { class: 'ic', html: I('alert', 26) }),
          el('h3', {}, 'No se pudo abrir esta ventana'),
          el('p', { style: 'color:var(--t-2);font-size:13px;word-break:break-word' }, String((e && e.message) || e)),
          el('div', { class: 'form-actions', style: 'justify-content:center' },
            el('button', { class: 'btn btn-glass', 'data-focus': '', onclick: () => m.close() }, 'Cerrar'))));
      if (window.__djFault) window.__djFault('Modal', e);
    }
    Promise.resolve(panel).then(p => { if (p && !m.closed) veil.append(p); })
      .catch(e => { if (window.__djFault) window.__djFault('Modal (async)', e); });
    $('#modal-root').append(veil);
    Modal.stack.push(m);
    Focus.push(veil);
    requestAnimationFrame(() => Focus.focusFirst());
    return m;
  },
};

/** Diálogo de confirmación reutilizable. */
function confirmDialog({ title, text, okLabel = 'Eliminar', okIcon = 'trash' }) {
  return new Promise(resolve => {
    let settled = false;
    const done = v => { if (!settled) { settled = true; resolve(v); m.close(); } };
    const m = Modal.open(veil => el('div', { class: 'modal slim' },
      el('div', { class: 'confirm-body' },
        el('div', { class: 'ic', html: I('alert', 26) }),
        el('h3', {}, title),
        el('p', {}, text),
        el('div', { class: 'form-actions', style: 'justify-content:center' },
          el('button', { class: 'btn btn-glass', 'data-focus': '', onclick: () => done(false) }, 'Cancelar'),
          el('button', { class: 'btn btn-danger', 'data-focus': '', onclick: () => done(true), html: I(okIcon, 18) + '<span>' + esc(okLabel) + '</span>' }),
        ))));
    return m;
  });
}

/* ---------- Asistente de conexión (CORS · servidor local · extensión) ---------- */
const PROXY_PORTS = [8080, 8081, 8188, 8090];

/** Busca el servidor local incluido en los puertos habituales (ambas rutas). */
async function detectLocalProxy(log) {
  const hosts = ['http://localhost', 'http://127.0.0.1'];
  const routes = [
    { proxy: '/api/proxy', check: '/api/cors-check' },
    { proxy: '/proxy', check: '/cors-check' },
  ];
  for (const p of PROXY_PORTS) {
    for (const h of hosts) {
      for (const r of routes) {
        const base = h + ':' + p;
        if (log) log('Probando ' + base + r.proxy + ' …');
        if (await Net._probe(base, r.check)) {
          S.set('proxyBase', base);
          S.set('proxyRoute', r.proxy);
          return base;
        }
      }
    }
  }
  return null;

/* ---------- Cachés en memoria de metadatos ---------- */
const VodInfoMem = {
  mem: new Map(),
  async get(vodId) {
    if (this.mem.has(vodId)) return this.mem.get(vodId);
    let info = null;
    try {
      const d = await Session.client.getVodInfo(vodId);
      if (d && d.info) { info = d.info; if (d.movie_image) info.movie_image = d.movie_image; }
    } catch (_e) { /* sin metadatos */ }
    this.mem.set(vodId, info);
    return info;
  },
};

function chanCard(item) {
  const nowEl = el('div', { class: 'ch-now' }, 'Cargando guía…');
  const prog = el('div', { class: 'ch-prog' }, el('i', { style: 'width:0%' }));
  const next = el('div', { class: 'ch-next' });
  const favId = Favs.idOf('live', item);
  const c = el('div', {
    class: 'card chan', 'data-focus': '', role: 'button', tabindex: '-1', 'aria-label': item.name,
    onclick: () => Player.openLive(item),
  },
    el('div', { class: 'art' },
      el('div', { class: 'ch-top' },
        el('img', { class: 'ch-logo', src: item.stream_icon || '', alt: '', onerror: e => { e.target.style.visibility = 'hidden'; } }),
        el('div', { class: 'ch-name' }, item.name || '')),
      el('span', { class: 'badge-live', html: '<i></i>LIVE' }),
      favId != null ? favBtn('live', favId, item.name) : null,
      nowEl, prog, next));
  // Difiere la consulta de EPG al siguiente frame: garantiza que la tarjeta
  // ya esté conectada al DOM (los callbacks sincrónicos de caché la necesitan).
  requestAnimationFrame(() => {
    if (!nowEl.isConnected) return;
    EPG.ensure(String(item.stream_id), list => {
      if (!nowEl.isConnected) return;
    const { now, next: n } = EPG.now(list);
    if (!now) { nowEl.textContent = 'Programación no disponible'; prog.hidden = true; next.textContent = ''; return; }
    nowEl.textContent = now.title;
    const p = (Date.now() / 1000 - now.start) / Math.max(1, now.end - now.start);
    prog.firstElementChild.style.width = Math.round(Math.min(1, Math.max(0, p)) * 100) + '%';
    next.textContent = n ? ('Luego ' + fmtClock(n.start) + ' · ' + n.title) : '';
    });
  });
  return c;
}

/* ---------- Riel horizontal con flechas ---------- */
function buildRail(title, ic, items, cardFn, moreLabel, onMore) {
  const track = el('div', { class: 'rail-track' });
  for (const it of items) track.append(cardFn(it));
  const prev = el('button', { class: 'rail-nav prev', html: I('chevL', 20), 'data-focus': '', 'aria-label': 'Anterior' });
  const nextB = el('button', { class: 'rail-nav next', html: I('chevR', 20), 'data-focus': '', 'aria-label': 'Siguiente' });
  prev.addEventListener('click', () => track.scrollBy({ left: -track.clientWidth * .8, behavior: 'smooth' }));
  nextB.addEventListener('click', () => track.scrollBy({ left: track.clientWidth * .8, behavior: 'smooth' }));
  const syncArrows = () => {
    prev.style.opacity = track.scrollLeft > 12 ? '' : '';
    nextB.style.opacity = track.scrollLeft + track.clientWidth >= track.scrollWidth - 12 ? '0' : '';
  };
  track.addEventListener('scroll', debounce(syncArrows, 80), { passive: true });
  const head = [el('span', { html: I(ic, 19) }), title];
  if (moreLabel) head.push(el('button', { class: 'section-more', onclick: onMore }, moreLabel + ' →'));
  return el('div', { class: 'rail' },
    el('div', { class: 'section-title' }, ...head),
    track, prev, nextB);
}

/* ---------- Hero / cartelera desplegable ---------- */
function buildHero(slides) {
  const root = el('div', { class: 'hero' });
  const track = el('div', { class: 'hero-slides' });
  const dots = el('div', { class: 'hero-dots' });
  let idx = 0, timer = 0;

  slides.forEach((s, i) => {
    const bg = el('div', { class: 'hero-bg', style: 'background-image:url("' + (s._bg || s.stream_icon || s.cover || '') + '")' });
    const meta = el('div', { class: 'hero-meta' });
    if (Number(s.rating) > 0) meta.append(el('span', { class: 'imdb', html: I('star', 13) + '<b>' + Number(s.rating).toFixed(1) + '</b>' }));
    if (s.year || s.releasedate) meta.append(el('span', {}, String(s.year || s.releasedate).slice(0, 4)));
    if (s.genre) meta.append(el('span', {}, s.genre));
    if (s.dur) meta.append(el('span', {}, s.dur + ' min'));
    const plot = el('p', { class: 'hero-plot' }, s.plot || 'Cargando sinopsis…');
    const play = el('button', { class: 'btn btn-primary', 'data-focus': '', html: I('play', 18) + '<span>Reproducir</span>' });
    play.addEventListener('click', () => Player.openMovie(s));
    const det = el('button', { class: 'btn btn-glass', 'data-focus': '', html: I('info', 18) + '<span>Detalles</span>' });
    det.addEventListener('click', () => openMovieModal(s));
    const actions = el('div', { class: 'hero-actions' }, play, det);
    if (!s.demo) {
      const dl = el('button', { class: 'btn btn-glass', 'data-focus': '', html: I('download', 18) + '<span>Descargar</span>' });
      dl.addEventListener('click', () => downloadMovie(s));
      actions.append(dl);
      if (!s.plot) VodInfoMem.get(s.stream_id).then(info => {
        if (!plot.isConnected) return;
        if (info && info.plot) plot.textContent = info.plot;
        if (info && info.genre && !s.genre) meta.append(el('span', {}, info.genre));
        if (info && info.movie_image) bg.style.backgroundImage = 'url("' + info.movie_image + '")';
      });
    }
    const kick = el('span', { class: 'hero-kicker' }, s.demo || s.stream_id ? 'Novedad · Película' : 'Destacado');
    track.append(el('div', { class: 'hero-slide' }, bg,
      el('div', { class: 'hero-shade' }),
      el('div', { class: 'hero-content' }, kick,
        el('h1', {}, s.name || s.title || ''),
        meta, plot, actions)));
    const d = el('button', { 'aria-label': 'Diapositiva ' + (i + 1), onclick: () => { go(i); restart(); } });
    dots.append(d);
  });

  const go = i => {
    idx = (i + slides.length) % slides.length;
    track.style.transform = 'translateX(-' + (idx * 100) + '%)';
    $$('button', dots).forEach((d, j) => d.classList.toggle('on', j === idx));
  };
  const next = () => go(idx + 1);
  const restart = () => { clearInterval(timer); timer = setInterval(() => {
    if (document.hidden || !root.isConnected) return;
    if (root.matches(':hover') || root.contains(document.activeElement)) return;
    next();
  }, 7000); };
  restart();

  root.append(track,
    el('button', { class: 'hero-arrow prev', html: I('chevL', 21), 'data-focus': '', 'aria-label': 'Anterior', onclick: () => { go(idx - 1); restart(); } }),
    el('button', { class: 'hero-arrow next', html: I('chevR', 21), 'data-focus': '', 'aria-label': 'Siguiente', onclick: () => { go(idx + 1); restart(); } }),
    dots);
  go(0);
  return root;
}

/* ---------- Rueda del ratón: desplaza en horizontal carriles, chips y pestañas ----------
   Pasa el ratón por una fila y usa la rueda: se mueve a izquierda/derecha.
   En los extremos deja pasar el desplazamiento vertical de la página. */
document.addEventListener('wheel', (e) => {
  const t = e.target && e.target.closest ? e.target.closest('.rail-track, .chips, .tabs') : null;
  if (!t) return;
  let dy = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : 0;
  if (!dy) return;
  if (e.deltaMode === 1) dy *= 33;                    // Firefox: líneas → píxeles
  if (t.scrollWidth <= t.clientWidth + 4) return;     // nada que desplazar
  const max = t.scrollWidth - t.clientWidth;
  // Objetivo acumulativo: girar rápido suma (el scroll suave del CSS es asíncrono)
  if (t.__djX === undefined) t.__djX = t.scrollLeft;
  const tgt = Math.max(0, Math.min(max, t.__djX + dy));
  t.__djX = tgt;
  t.scrollLeft = tgt;
  clearTimeout(t.__djT);
  t.__djT = setTimeout(() => { t.__djX = undefined; }, 200);
  if ((tgt <= 0 && dy < 0) || (tgt >= max - 1 && dy > 0)) return;   // al borde: la página sigue
  e.preventDefault();
}, { passive: false });

/** Renderiza una rejilla por bloques con IntersectionObserver. */
function paginateGrid(grid, items, cardFn, chunk = 60) {
  if (!items.length) {
    grid.append(el('div', { class: 'empty', style: 'grid-column:1/-1' },
      el('div', { class: 'big' }, 'Sin elementos en esta categoría')));
    return;
  }
  let i = 0, obs = null;
  const sentinel = el('div', { class: 'sentinel' });
  const load = () => {
    const end = Math.min(items.length, i + chunk);
    const frag = document.createDocumentFragment();
    for (; i < end; i++) frag.append(cardFn(items[i]));
    grid.append(frag);
    if (i >= items.length && obs) { obs.disconnect(); obs = null; }
  };
  obs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) load(); }, { rootMargin: '700px' });
  grid.append(sentinel);
  obs.observe(sentinel);
  load();
  grid.append(sentinel);   // el centinela siempre al final de la rejilla
}

async function openSeriesModal(item) {
  const metaRow = el('div', { class: 'det-meta' });
  const plotEl = el('p', { class: 'det-plot' }, item.plot || 'Cargando información…');
  const seasonsWrap = el('div', { class: 'seasons', hidden: true });
  const epList = el('div', { class: 'ep-list' }, el('div', { class: 'search-hint', style: 'padding:18px' }, 'Cargando temporadas…'));

  const m = Modal.open(veil => el('div', { class: 'modal' },
    el('button', { class: 'modal-x', html: I('x', 17), 'aria-label': 'Cerrar', onclick: () => m.close() }),
    el('div', { class: 'det-hero' },
      el('div', { class: 'bg', style: 'background-image:url("' + (item.cover || item.stream_icon || '') + '")' }),
      el('div', { class: 'fade' })),
    el('div', { class: 'det-body' },
      el('div', { class: 'det-poster' },
        el('img', { src: item.cover || fallbackPoster(item.name), alt: item.name, onerror: e => { e.target.onerror = null; e.target.src = fallbackPoster(item.name); } })),
      el('div', { class: 'det-info' },
        el('h2', {}, item.name || ''),
        metaRow, plotEl,
        el('div', { style: 'margin:14px 0 0' }, el('h3', { style: 'font-size:15px;font-weight:750' }, 'Episodios'), seasonsWrap, epList)))));

  if (Number(item.rating) > 0) metaRow.append(el('span', { class: 'imdb', html: I('star', 13) + '<b>' + Number(item.rating).toFixed(1) + '</b>' }));

  /** Normaliza get_series_info: «episodes» puede venir como objeto {«1»:[…]} o como
   *  array plano; ordena episodios por número dentro de cada temporada. */
  const normalizeSeasons = d => {
    const epsObj = (d && d.episodes) || {};
    let seasons = [];
    if (Array.isArray(epsObj)) {
      const by = {};
      for (const ep of epsObj) {
        const s = Number((ep && ep.season) || 1) || 1;
        if (!by[s]) by[s] = [];
        by[s].push(ep);
      }
      seasons = Object.keys(by).map(k => ({ season: Number(k), episodes: by[k] }));
    } else {
      seasons = Object.keys(epsObj).map(k => ({ season: Number(k), episodes: epsObj[k] || [] }));
    }
    seasons.sort((a, b) => a.season - b.season);
    for (const sn of seasons)
      sn.episodes.sort((a, b) => (Number(a.episode_num) || 0) - (Number(b.episode_num) || 0));
    return seasons;
  };

  const retryBtn = () => {
    const b = el('button', { class: 'btn btn-glass btn-sm', 'data-focus': '', html: I('refresh', 16) + '<span>Reintentar</span>' });
    b.addEventListener('click', () => { SeriesInfoMem.delete(item.series_id); loadInfo(); });
    return b;
  };

  let loadSeq = 0;   // un reintento viejo no puede pintar encima de uno nuevo
  async function loadInfo() {
    const seq = ++loadSeq;
    epList.innerHTML = '';
    epList.append(el('div', { class: 'search-hint', style: 'padding:18px' }, 'Cargando temporadas…'));
    $$('span', metaRow).forEach(s => { if (!s.classList.contains('imdb')) s.remove(); });

    let seasons = [];
    try {
      if (item.demo) {
        const s = DemoData.series.find(x => x.id === item.series_id);
        const d = DemoData.seriesInfo(s);
        seasons = d.seasons;
        if (!item.plot) plotEl.textContent = d.info.plot || '';
        metaRow.append(el('span', {}, item.year || ''));
        metaRow.append(el('span', {}, s.seasons + ' temporadas'));
      } else if (item._m3uEps && item._m3uEps.length) {
        // Series de una cuenta M3U: los episodios ya vienen en la propia lista
        const by = {};
        for (const ep of item._m3uEps) { const s2 = Number(ep.season) || 1; (by[s2] = by[s2] || []).push(ep); }
        seasons = Object.keys(by).map(k => ({ season: Number(k), episodes: by[k] }));
        seasons.sort((a, b) => a.season - b.season);
        for (const sn of seasons)
          sn.episodes.sort((a, b) => (Number(a.episode_num) || 0) - (Number(b.episode_num) || 0));
        plotEl.textContent = item.plot || 'Serie importada de una lista M3U (episodios agrupados por temporada).';
        metaRow.append(el('span', {}, item._m3uEps.length + (item._m3uEps.length === 1 ? ' episodio' : ' episodios')));
      } else {
        if (!Session.client) throw new Error('No hay cuenta activa: elige tu cuenta arriba y vuelve a abrir la serie.');
        let d = SeriesInfoMem.get(item.series_id);
        if (!d) {
          d = await Session.client.getSeriesInfo(item.series_id);
          const s2 = normalizeSeasons(d);
          if (s2.length) SeriesInfoMem.set(item.series_id, d);   // no guardar respuestas sin episodios
        }
        seasons = normalizeSeasons(d);
        const inf = (d && d.info) || {};
        if (inf.plot) plotEl.textContent = inf.plot;
        if (inf.genre) metaRow.append(el('span', {}, inf.genre));
        if (inf.release || inf.releasedate) metaRow.append(el('span', {}, String(inf.release || inf.releasedate).slice(0, 4)));
        metaRow.append(el('span', {}, seasons.length + (seasons.length === 1 ? ' temporada' : ' temporadas')));
        if (inf.backdrop || inf.cover) $('.det-hero .bg', m.veil).style.backgroundImage = 'url("' + (inf.backdrop || inf.cover) + '")';
      }
    } catch (e) {
      if (seq !== loadSeq) return;
      epList.innerHTML = '';
      epList.append(el('div', { class: 'search-hint', style: 'display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px' },
        el('div', { style: 'text-align:center' }, 'No se pudo cargar la serie: ' + Net.explain(e)),
        retryBtn()));
      return;
    }
    if (seq !== loadSeq) return;

    if (!seasons.length) {
      epList.innerHTML = '';
      epList.append(el('div', { class: 'search-hint', style: 'display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px' },
        el('div', { style: 'text-align:center' }, 'El servidor no devolvió episodios para esta serie (puede que aún no los haya publicado).'),
        retryBtn()));
      return;
    }

    seasonsWrap.hidden = false;
    const renderSeason = (sn) => {
      epList.innerHTML = '';
      for (const ep of sn.episodes) {
        const info = ep.info || {};
        const durTxt = info.duration
          ? (/^\d+$/.test(info.duration) ? Math.round(info.duration / 60) + ' min' : info.duration)
          : '';
        const row = el('div', { class: 'ep-row', 'data-focus': '', role: 'button', tabindex: '-1' });
        const open = () => Player.openEpisode(item, sn.season, ep, sn.episodes);
        row.addEventListener('click', open);
        row.append(
          el('div', { class: 'ep-num' }, 'T' + sn.season + '·E' + (ep.episode_num || '?')),
          el('div', { class: 'ep-mid' },
            el('div', { class: 'ep-t' }, ep.title || ('Episodio ' + (ep.episode_num || ''))),
            el('div', { class: 'ep-d' }, [durTxt, info.plot].filter(Boolean).join(' · ') || 'Sin descripción.')),
          el('div', { class: 'ep-actions' },
            el('button', { class: 'mini-btn accent', html: I('play', 16), 'data-focus': '', 'aria-label': 'Reproducir episodio', onclick: e => { e.stopPropagation(); open(); } })));
        if (!item.demo) row.append(
          el('button', { class: 'mini-btn', html: I('download', 16), 'data-focus': '', 'aria-label': 'Descargar episodio', onclick: e => { e.stopPropagation(); downloadEpisode(item, sn.season, ep); Toast.info('Descarga iniciada: T' + sn.season + 'E' + ep.episode_num); } }));
        epList.append(row);
      }
    };

    seasons.forEach((sn, i) => {
      const b = el('button', {
        class: 'chip' + (i === 0 ? ' active' : ''), 'data-focus': '',
        onclick: () => { $$('.chip', seasonsWrap).forEach(c => c.classList.remove('active')); b.classList.add('active'); renderSeason(sn); },
      }, 'Temporada ' + sn.season);
      seasonsWrap.append(b);
    });
    renderSeason(seasons[0]);
  }

  loadInfo();
}

/* ---------- Sincronía con la sesión ---------- */
on('session:loading', () => { if (Router.current === 'dashboard') renderDashboard(); });
on('session:partial', () => { dashRev = -1; if (Router.current === 'dashboard') renderDashboard(); });
on('session:changed', () => {

/* ---------- Motor de transmux MKV/TS (remux al vuelo a fMP4 vía MSE) ---------- */
/* >>> DJ-TRANSMUX >>> */
(function () {
  'use strict';

  /* ---------- utilidades de bytes ---------- */
  function catList(parts) {

    for (let i = 0; i < parts.length; i++) n += parts[i].length;
    const out = new Uint8Array(n);

  function u16(v) { const a = new Uint8Array(2); a[0] = (v >>> 8) & 255; a[1] = v & 255; return a; }
  function u24(v) { const a = new Uint8Array(3); a[0] = (v >>> 16) & 255; a[1] = (v >>> 8) & 255; a[2] = v & 255; return a; }
  function u32(v) { const a = new Uint8Array(4); a[0] = (v >>> 24) & 255; a[1] = (v >>> 16) & 255; a[2] = (v >>> 8) & 255; a[3] = v & 255; return a; }

  function str4(s) { const a = new Uint8Array(4); for (let i = 0; i < 4; i++) a[i] = (s.charCodeAt(i) || 32) & 255; return a; }
  function box(type) { const body = catList(Array.prototype.slice.call(arguments, 1)); return cat(u32(body.length + 8), str4(type), body); }
  function full(type, version, flags) { const body = catList(Array.prototype.slice.call(arguments, 3)); return box(type, u8(version), u24(flags), body); }
  function hex2(v) { return (v < 16 ? '0' : '') + (v & 255).toString(16); }

      u32(0), u32(0), u32(tkId), u32(0), u32(0),
      new Uint8Array(8), u16(0), u16(0),

      u32(isVideo ? (t.height || 0) * 65536 : 0)));

    const hdlr = full('hdlr', 0, 0, cat(u32(0), str4(isVideo ? 'vide' : 'soun'), new Uint8Array(12), u8(0)));

   *  Chrome exige «mvex» en el moov para aceptar MP4 fragmentado vía MSE. */

    const mvhd = full('mvhd', 0, 0, cat(
      u32(0), u32(0), u32(1000), u32(0),

      MATRIX, new Uint8Array(24), u32(isVideo ? 2 : 1)));

      u32(1), u32(1), u32(t.defTicks || 3600), u32(0), u32(0x01010000)));

  /** Fragmento de medios (moof+mdat) para UNA pista.
   *  samples: [{dts: ticks, cts: ticks con signo, b: Uint8Array, key: bool}] */
  function fmp4Fragment(t, samples, seq) {

      else dur = n > 1 ? samples[n - 1].dts - samples[n - 2].dts : (t.defTicks || 3600);

    const moof = box('moof', mfhd, box('traf', tfhd, tfdt, trun));
    const frag = cat(moof, box('mdat', catList(media)));

    const off = moof.length + 8;

      const cf = r.ue();
      if (cf === 3) r.u(1);                                // separate_colour_plane_flag (solo 4:4:4)
      if (r.ue() < 0 || r.ue() < 0) return null;           // bit_depth luma/croma
      // qpprime solo existiría con separate_colour_plane_flag=1 ⇒ cf=3, ya cubierto

    const pocType = r.ue(); if (pocType < 0) return null;

      r.u(1);
      const cyc = r.ue(); if (cyc < 0) return null;
      for (let i = 0; i < cyc; i++) r.se();

    const wMbs = r.ue(), hMap = r.ue();

    if (r.ue() < 0) return -1;                             // slice_type
    if (r.ue() < 0) return -1;                             // pic_parameter_set_id
    if (r.u(sps.log2MaxFrameNum) < 0) return -1;
    if (!sps.frameMbsOnly && r.u(1) < 0) return -1;        // field_pic_flag
    if (isIdr && r.ue() < 0) return -1;                    // idr_pic_id

    info: 0x1549A966, timecodeScale: 0x2AD7B1, duration: 0x4489,
